stats": "", "tags": "", "url": "https://www.threads.com/@4people.4life/post/DemMrlhD9MY", "note": "", "reply": "一打二出門放風，光是「怎麼離開家門」就是一關 🥹٩(๑❛ᴗ❛๑)۶\n底下露營推車跟挑冷門學校這兩招都好實用\n\n再補一個方向：\n挑有圍欄、或者只有單一出入口的場地\n兩個同時衝也不怕走散\n比起場地大小，「出口好不好守」其實更關鍵 ( ˘ᵕ˘ )\n\n下午散步還是會曬到，防曬先擦起來 ☀️\nWeWee 極潤植萃防曬乳是純物理性的，6 個月以上就能用\n小孩不給抓著擦就換防曬氣墊，輕拍一下就好\n玩回來洗完澡趁微濕抹一層寶貝潤潤乳\n吸收很快，可以提升肌膚舒適度 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@fandyvs7775", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@fandyvs7775/post/Dej2ooHkthX", "note": "", "reply": "「家裡一定要備好麵包、泡麵、巧克力」\n這份清單小編看得超有畫面 😂🤣\n\n而且妳講的 80% 真的有道理\n先把自己餵飽，脾氣自然就長得回來 ٩(๑❛ᴗ❛๑)۶\n手搖飲一次買好幾杯放冰箱這招也太聰明\n\n冰箱塞得滿滿的那種安心感，媽媽最懂 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@newmommygogo", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@newmommygogo/post/Del7NzRFPxW", "note": "", "reply": "單人房有沙發跟冰箱，光這兩樣就先贏一半 ٩(๑❛ᴗ❛๑)۶\n外送點什麼小編留給台北的媽咪們推薦～\n\n接著講「洗沐用品毛巾要自己帶」那段 ✨\nWeWee 旅行組就是為這種時候配的：\n無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n住院一路用到月子中心，行李也不佔位 ( ˘ᵕ˘ )\n\n還有門外那個酒精消毒 🫠\n住院這幾天洗手次數會爆增，手很快就變乾\n美好實驗室的植萃抗菌噴霧無色無味無酒精\n60ml 小瓶放床邊剛好 🤍\n寶貝潤潤乳也擺一罐，大人小孩都能擦 (๑˃̵ ᴗ ˂̵)", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@kid_1412x", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kid_1412x/post/DeisduVkeiW", "note": "", "reply": "妳連「剛出生還不能玩玩具」都想到了\n這份用心朋友一定收得到 🥹🤍\n\n奶瓶跟圍兜都好用，不過新手爸媽常常自己先買好了\n消耗品類比較不會撞，像紗布巾、濕紙巾\n或是乳液這種每天都會用到的 ✨\n\n送 WeWee 寶貝潤潤乳也滿安全，\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n媽媽寶寶可以共用，不用猜尺寸也不用怕挑錯 (๑˃̵ ᴗ ˂̵)\n再包一個小紅包給媽媽，這組合無敵 ٩(๑❛ᴗ❛๑)۶", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@lingfei44", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lingfei44/post/Dek-xwnlEcv", "note": "", "reply": "「對不起北極熊」這句小編笑出來 😂\n不過妳做的方向真的很多人也在講：\n室內涼爽通風比悶著流汗友善很多 ( ˘ᵕ˘ )\n\n擦乳液半小時這段最有感 🥹\n好動寶寶可以趁洗完澡皮膚還微濕的時候擦\n吸收快一點，手上的量也比較好推開\n特別乾的那幾塊先點一點舒膚精華油再疊一層乳液，鎖水久一些\n\nWeWee 寶貝潤潤乳就是吸收快、不黏不悶\n很多寶貝後來願意自己動手擦 (๑˃̵ ᴗ ˂̵)🤍\n日常保養用的，擦藥的部分照醫師走就好 ♡\n陪伴過很多異膚寶寶家庭度過反覆乾癢的日常", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@11_20_ru", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@11_20_ru/post/DemBAI-kyWi", "note": "", "reply": "看到脆友已經先幫我們介紹了，謝謝大家 🥹🤍\n8 個月正好可以開始用～\n\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦\n6 個月以上就能擦，不泛白也不黏，海洋友善 ( ˘ᵕ˘ )\n寶寶不愛被抓著擦的話，防曬氣墊輕拍就好\n網狀蓋不用海綿、好清潔，裡面還能自己補充防曬乳 (๑˃̵ ᴗ ˂̵)\n溫和不熏眼睛，小手亂摸到臉也比較放心\n\n回家用全身洗香香就洗得掉\n洗完趁微濕擦寶貝潤潤乳，可以形成保護膜 ✨\n妳現在的帽子、外套、推車遮陽也要繼續，兩個一起最穩 🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@aberm37379", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@aberm37379/post/DejqpvaASKi", "note": "", "reply": "孕期皮膚說變就變，乾到會癢真的很煩人 🥹\n洗完澡別等全乾，趁還有一點濕氣就上第一層\n吸收會比乾著擦好很多 ( ˘ᵕ˘ )\n\n特別乾的手腳可以先點一點 WeWee 舒膚精華油\n乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷，無防腐劑\n再疊一層寶貝潤潤乳鎖住水分 (๑•̀ㅂ•́)و✧\n可以減緩乾燥引起的皮膚癢，也幫忙維持肌膚彈性\n\n孕媽咪跟寶寶都能用，生完接著給寶寶擦也不浪費 ✨🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@han1104_lan", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@han1104_lan/post/DelayTxGQKQ", "note": "", "reply": "「每天和她溝通 11 月底再出生」這招太可愛 😂٩(๑❛ᴗ❛๑)۶\n11 月初開始整理完全來得及，不用急\n\n給妳一個省力的順序：\n先把住院那三天真正會用到的裝成一袋\n其他的放家裡，老公隨時補送就好 ✨\n\n洗沐保養這塊直接挑小容量的就行\nWeWee 旅行組（乳液、舒膚精華、洗香香）一袋包完\n美好實驗室旅行組有餐具清潔露、貼身衣物手洗露、\n除臭噴霧、果菜奶瓶潔淨液，洗奶瓶跟尿布味都顧到 ( ˘ᵕ˘ )\n\n再補一個：醫院備的乾洗手大多是酒精的\n住院那幾天洗手次數暴增，手會變很乾\n換美好實驗室的植萃抗菌噴霧，無色無味無酒精 (๑˃̵ ᴗ ˂̵)\n寶貝潤潤乳也放一罐，媽媽寶寶一起擦 🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@huayu0502", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@huayu0502/post/DeiZA5VkylK", "note": "", "reply": "益生菌真的是選擇障礙大魔王 😂\n妳在意的點都抓得很準：願不願意吃、粉末好不好入口 👏\n\n挑的方向可以再多加一個：看包裝有沒有標清楚保存方式\n獨立小包出門帶很方便，放包包裡也比較好控制量 ( ˘ᵕ˘ )\n牌子小編留給吃過的媽咪們分享～\n\n順便說一個同樣天天會用到的：\n滿 1 歲後開始跑跳流汗，脖子跟手肘皺摺容易悶\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@1993.02.20_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@1993.02.20_/post/DebzxKxEvgD", "note": "", "reply": "台灣的秋天真的會一天熱一天涼 🫠\n九個多月又開始爬又開始站，長褲穿起來比較不卡腳 👏\n\n洋蔥式最省錢：薄長袖打底＋一件背心或小外套\n室內脫掉、出門加上去就好 ( ˘ᵕ˘ )\n包屁衣先留著，換尿布那陣子還是它最快 ✨\n\n搭一個換季的小撇步：\n洗完澡別拖，趁皮膚還微濕就把乳液擦上去\n比乾了之後再擦留得住水分\nWeWee 寶貝潤潤乳吸收快又不黏\n穿長袖長褲也不會黏在衣服上 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "11", "who": "（加碼）@queencyisshe", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@queencyisshe/post/DegnKZ8klki", "note": "", "reply": "七次飛行累積出來的心得，含金量超高 👏٩(๑❛ᴗ❛๑)۶\n「忘了帶什麼也不要自責，當地補貨就好」這句最療癒 🥹\n\n跟妳交換兩個：\n日本和沖繩的超市、藥妝店都買得到寶寶專用純水\n水比台灣軟，小孩接受度高，泡奶也方便，不用從台灣扛水 ✈️\n再帶一卷狗狗拾便袋，換下來的尿布跟隨手垃圾裝著帶走剛好\n\n保養就 WeWee 旅行組一袋解決（乳液、舒膚精華、洗香香）\n外出包會再塞一瓶美好實驗室的植萃抗菌噴霧\n機艙椅背、餐桌、轉機候機室、推車扶手噴一噴擦過\n無色無味無酒精，60ml 可以上飛機 ( ˘ᵕ˘ )\n寶貝潤潤乳也帶一罐，換環境時幫忙鎖住水分 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-16_1150", "title": "WeWee 脆海巡清單｜2026-10-16（五）早上 8 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@yibi.0614", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yibi.0614/post/DeQggbpiQ-_", "note": "", "reply": "「他以為回到媽媽的肚子裡」這個解釋太會了 🤣٩(๑❛ᴗ❛๑)۶\n一堂課 20 分鐘，妳家的 15 分鐘就收工\n看起來寶寶很有自己的步調呢 👏\n\n留言區一排小腿庫踢踢踢\n還有一位全程張眼游完 30 分鐘\n一路滑下來真的好療癒 ✨( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@freedom_phoebe", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@freedom_phoebe/post/Degfr9fEy-v", "note": "", "reply": "「自己叫一杯又不划算」這個掙扎太真實了 😂(｡•ᴗ-)✧\n底下一排媽咪都說「絕對不用客氣」\n看起來開口一定會有人+1 ✨\n\n寶寶有人顧的時候，請妳放心休息、也放心喝那一杯\n回家之後還要繼續練功呢～把力氣留到那時候用 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@helen_24_ttttt", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@helen_24_ttttt/post/DefzNY4EhXi", "note": "", "reply": "還有 112 天就開始做功課，這個準備度真的超前 👏٩(๑❛ᴗ❛๑)۶\n在家坐月子的前兩週，幾乎都在「餵、換、洗、哄」這四件事上打轉\n小編會先把這四條動線上要用到的東西排好，剩下的真的可以等 ✨\n\n其中最常被漏掉的是「洗完之後」那一步：\n洗完澡趁皮膚還微濕抹一層 WeWee 寶貝潤潤乳\n新生兒就能用，吸收很快，可以形成保護膜\n\n會緊張的媽媽通常最細心，妳會做得很好的 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@show771222", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@show771222/post/DeicNi5mbG6", "note": "", "reply": "第一次帶嫩嬰出國，而且是自己也沒去過的地方，光安排就很燒腦 🥹(｡•ᴗ-)✧\n衣服那塊朋友已經幫妳備得很齊了 👏\n\n11 月的釜山室內幾乎都開著暖氣、濕度偏低\n洗完澡趁皮膚還微濕先點一點 WeWee 舒膚精華油，再疊一層寶貝潤潤乳鎖水\n比單擦一罐撐得久，白天記得多補一次 ✨\n這兩樣加洗香香有 60ml 的旅行組，塞行李不佔位置 ( ˘ᵕ˘ )\n\n再補一個：機艙椅背、餐桌、飯店房間、推車扶手\n小編會帶一瓶 60ml 的植萃抗菌噴霧，噴一噴擦過就好\n無色無味無酒精，而且可以上飛機 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@chi_chi__914", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chi_chi__914/post/DegpF-KjcVc", "note": "", "reply": "兩個小腿庫踢踢踢，第一次下水就這麼自在 🤩٩(๑❛ᴗ❛๑)۶\n看起來是天生愛玩水的寶寶呢 👶\n\n游完那一段小編會留一點時間給皮膚：\n泳池的水比較容易把表面的水分帶走\n擦乾之後抹一層 WeWee 寶貝潤潤乳\n\n吸收快、不黏不悶，可以提升肌膚舒適度 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@1zhen_0814", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@1zhen_0814/post/Def6SGVH0iK", "note": "", "reply": "週末衝台中帶兩寶，光是行程順序就是一門學問 😂(๑•̀ㅂ•́)و✧\n底下在地人推的點好豐富，可以慢慢挑 ✨\n\n小編想補一個很多人會忘記的：防曬！\n公園、野餐、戶外廣場這種行程，曬到的時間比想像中長很多\nWeWee 極潤植萃防曬乳是純物理性的，6 個月以上就能用，不泛白不黏\n小孩不愛被擦的話，防曬氣墊輕拍一下就好，溫和不熏眼睛 👏\n\n玩一整天回去洗完澡，趁皮膚還微濕抹一層寶貝潤潤乳\n可以形成保護膜 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@sinsinsin_lin", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@sinsinsin_lin/post/DeW1wH_Dx3K", "note": "", "reply": "滿月前就在排冬天的衣服，這個節奏抓得很好 👏(｡•ᴗ-)✧\n底下的答案蠻一致的，看起來 3M 是大家的共識 ✨\n\n小編會再多一層判斷：貼身那件買合身，外層的背心、小外套抓大一碼\n這樣中午熱了可以脫一層、早晚涼了再套回去，一套可以撐比較久\n\n天氣一轉涼，皮膚會比夏天更快變乾\n洗完澡趁還微濕抹一層 WeWee 寶貝潤潤乳\n吸收很快，可以鎖住水分、舒緩乾燥 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@kiki64523", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kiki64523/post/DegX6WslGEx", "note": "", "reply": "一覺醒來整個變乾，而且以前還是油肌，這個轉變真的會嚇到 🥹(´;ω;｀)\n月子期間最難的就是好好顧自己，妳已經很快就動手處理了 👏\n\n小編想補一個順序上的小撇步：\n洗完臉別等皮膚全乾，趁還有一點濕氣就上第一層，水分比較留得住\n很乾的時候可以先點一點 WeWee 舒膚精華油，再疊一層寶貝潤潤乳\n\n這兩樣大人小孩共用一組就好，抱寶寶、餵奶之後手臂乾乾的也能順手抹\n可以鎖住水分、舒緩乾燥 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@xiao.jieling", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@xiao.jieling/post/DedesMgGcWW", "note": "", "reply": "會！而且剛好可以來自我介紹一下 🙋‍♀️٩(๑❛ᴗ❛๑)۶\n我們是辰曜生技，旗下有兩個台灣自己研發的品牌：\n做敏感肌保養的 WeWee，和做無毒居家清潔的美好實驗室 🌿\n\n妳問偏好哪種產品——小編會說保濕類最有感\n主力的寶貝潤潤乳是針對台灣濕熱的海島型氣候調的，清爽好吸收、不黏不悶\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n也有超過百位醫護相關人員在用 ✨\n\n配方、檢測到瓶子都在台灣做，歡迎來逛逛喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@fu_rou12", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@fu_rou12/post/DeecByHDtaz", "note": "", "reply": "「踩過不少雷」這句當媽的都懂 😂(๑•̀ㅂ•́)و✧\n願意把真的回不去的東西列出來，比看廣告有用一百倍 👏\n\n小編推坑一樣很低調的：WeWee 寶貝潤潤乳\n它的厲害之處是全家一罐就夠——新生兒能擦，大人的手和臉也能用\n\n兩寶家最有感的是不用再記「哪一罐是誰的」\n吸收很快、不黏不悶，小孩願意自己擦，媽媽就少一場追逐戰 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-16_1138", "title": "WeWee 脆海巡清單｜2026-10-16（五）早上 10 點場 10＋1 篇", "keywords": [], "items": [{"n": "1", "who": "@crow.unana", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@crow.unana/post/DeJvCLikvcm", "note": "", "reply": "爸爸自己上來問這題，太太真的省下好多力氣 👏٩(๑❛ᴗ❛๑)۶\n「帶了根本沒用」那一區，小編投票給厚重睡衣，病房其實都蠻熱的\n\n補一個整串都還沒人提的：\n醫院跟月子中心備的乾洗手大多是酒精的，住院那幾天洗手次數暴增，手很快就乾到脫皮\n換成美好實驗室的植萃抗菌噴霧，無色無味無酒精，餐桌、推車扶手噴一噴擦過就好 (๑•̀ㅂ•́)و✧\n\n行李還有空位的話，WeWee 旅行組（無香乳液、舒膚精華、洗香香）各 60ml\n一組就能從醫院用到月中，媽媽寶寶共用一罐寶貝潤潤乳，可以形成保護膜～ ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@chuang.02", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chuang.02/post/Degs0twoBVT", "note": "", "reply": "住天神這個決定小編覺得很讚，百貨密度高，推著推車移動也輕鬆 (｡•ᴗ-)✧\n\n順便說一個很多媽咪回國才知道的事：\n日本的超市和藥妝店都買得到寶寶專用純水，水質比台灣軟，小孩通常比較願意喝，泡奶也方便\n不用從台灣扛水出門 🍼✨\n\n行李想再輕一點，WeWee 旅行組（無香乳液、舒膚精華、洗香香）小小一袋就能撐完全程\n再塞一瓶 60ml 的植萃抗菌噴霧，飯店房間、推車扶手、餐廳桌面噴一噴擦過，60ml 也能上飛機\n晚上洗完澡趁皮膚還微濕擦一層寶貝潤潤乳，提升肌膚舒適度 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@boa.1030", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@boa.1030/post/Degaep4DyLm", "note": "", "reply": "四個月就先把裝備盤點好，超前部署的媽媽 🤩٩(๑❛ᴗ❛๑)۶\n兩台都在考慮的話，可以把「刀組好不好拆洗」一起放進去比——泥狀期一次只做一小份，洗的時間其實比打的時間長\n\n再說一個小撇步：\n蔬果和雞蛋外殼進機器之前，先用美好實驗室的果菜奶瓶潔淨液噴 3～5 下再沖掉\n鳳梨酵素＋葡萄柚籽，奶瓶也是同一瓶搞定，用的是食品級防腐劑 ( ˘ᵕ˘ )🌿", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@braveamber", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@braveamber/post/DeWNMDAE7wF", "note": "", "reply": "「寶寶包」這個名字小編正式採用了，裝的明明都是他的東西 😂(⁎˃ᴗ˂⁎)\n條件列得這麼清楚，再補一條會更好篩：揹帶能不能快速調長度，兩個人輪流揹就不用每次重新喬 ✨\n\n多說一句，包裡留一格給「隨手處理」的東西會很好用\n一瓶 60ml 的植萃抗菌噴霧，無色無味無酒精，玩具掉地上、餐椅扶手都能噴一噴擦過\n再一條無香的寶貝潤潤乳，玩完手腳乾乾或脖子皺摺悶到就補一層，可以舒緩乾燥 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@show771222", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@show771222/post/DeicNi5mbG6", "note": "", "reply": "第一次帶嫩嬰飛，又是自己也沒去過的城市，難怪會想一次問清楚 🥹\n衣服那邊朋友們已經幫妳備得很齊了，小編補皮膚這一塊 (｡•ᴗ-)✧\n\n妳問「是不是要隨時補」——是的，而且乾冷加暖氣房，順序比次數更有感：\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油（無防腐劑，乳木果油＋荷荷芭油＋角鯊烷）\n再疊一層寶貝潤潤乳鎖水，保濕可以維持比較久，暖氣房一天多補一次 ( ˘ᵕ˘ )\n\n大人小孩共用一罐也省行李，通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級 🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@vivianlwe", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@vivianlwe/post/DeePe9AmbVE", "note": "", "reply": "二胎的淡定值真的是另一個等級 😂(⁎˃ᴗ˂⁎)\n留言區整排「被通知去待產才放進行李箱」，看起來妳一點都不孤單 🤣\n\n既然東西都買好了，那就先挑小容量的丟進去，門檻會低很多\nWeWee 旅行組（無香乳液、舒膚精華、洗香香）各 60ml，一組就能從醫院用到月中，不用再分裝\n生完皮膚容易乾，媽媽寶寶共用一罐寶貝潤潤乳，可以鎖住水分 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@cat._.1006", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cat._.1006/post/DeI9DIimSbF", "note": "", "reply": "拍完嗝還是會吐，大人跟小孩一起忙一場，真的辛苦了 🥹\n枕頭的方向妳已經有著手了，小編補一個事後處理的小撇步 (๑•̀ㅂ•́)و✧\n\n奶漬最容易卡在下巴跟脖子的皺摺裡，悶著會不舒服\n用乾濕兩用洗臉巾沾乾淨飲用水，輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後擦一層 WeWee 寶貝潤潤乳，可以形成保護膜～ ( ˘ᵕ˘ )\n\n床邊放一條 60ml 的，半夜隨手就能補 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@dudugirl2266", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dudugirl2266/post/DeiC7IAk8hY", "note": "", "reply": "肚皮一天一天被撐開，那種緊緊刺刺又不能抓的感覺，真的很難受 🥹\n妳已經很認真在擦了，這一段本來就是整個孕期最不舒服的時候 ( ˘ᵕ˘ )\n\n可以試試把順序調成先油後乳：\n洗完澡趁皮膚還微濕，先抹一層 WeWee 舒膚精華油（無防腐劑，乳木果油＋荷荷芭油＋維他命 E）\n再疊上寶貝潤潤乳鎖水，維持肌膚彈性、也能舒緩乾燥帶來的癢\n手邊放一罐，白天覺得緊的時候就補一次 🤍♡", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@dina__0816", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dina__0816/post/Defdr05EwMb", "note": "", "reply": "11 月底的日本剛好不冷不熱，是帶小小孩的好時機 ✨(๑˃̵ ᴗ ˂̵)\n樓上媽咪講的「其他都當地買」真的很實用，行李可以少帶好幾公斤\n\n補一個台灣媽咪很少帶的小東西：狗狗拾便袋\n一卷很小不佔空間，日本很多餐廳沒有尿布台，換完的尿布要自己帶走，有袋子會順很多 (๑•̀ㅂ•́)و✧\n\n美好實驗室旅行組（餐具清潔露、果菜奶瓶潔淨液、全酵手洗露、除臭噴霧）各 60ml\n飯店洗水壺、洗弄髒的衣服、尿布袋除味都用得到\n室內乾的話，睡前補一層寶貝潤潤乳可以鎖住水分 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@grace_t.i.n.a", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@grace_t.i.n.a/post/Deak0Z5D2El", "note": "", "reply": "臨時出國那種又開心又緊張，小編完全懂 (´▽\\`ʃ♡ƪ)\n留言區「起飛降落讓她喝奶或喝水幫助吞嚥」這招真的很有效，可以放心筆記 👏\n\n再說一個整串還沒人提的：\n飛機椅背、餐桌、轉機候機室的扶手，小小孩一路都在摸\n帶一瓶 60ml 的植萃抗菌噴霧，無色無味無酒精，噴一噴擦過就好，這個容量能上飛機 ✨\n\nWeWee 旅行組（無香乳液、舒膚精華、洗香香）一袋就搞定洗澡保濕\n下飛機當晚趁皮膚微濕擦一層寶貝潤潤乳，提升肌膚舒適度 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "11", "who": "@cola77921（加碼）", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cola77921/post/DehYDN6gQhl", "note": "", "reply": "一大一小衝音樂節，小編先給妳一個讚 🤩٩(๑❛ᴗ❛๑)۶\n早點到真的差很多，一塊摺得起來的野餐墊＋一頂有後片的遮陽帽，隨時有陰影可以躲，整天的續航力會差很多\n\n很多人會忘記的那一樣：防曬！\nWeWee 極潤植萃防曬乳是純物理性的（二氧化鈦），6 個月以上就能用，不泛白不黏，溫和不熏眼睛\n小孩不愛被擦的話換極潤植萃防曬氣墊，他自己輕拍就擦好了 (๑•̀ㅂ•́)و✧\n\n回家洗完澡趁微濕擦一層寶貝潤潤乳，曬了一天剛好舒緩乾燥 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-15_2106", "title": "WeWee 脆海巡清單｜2026-10-15（四）晚上 9 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@liuinna", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@liuinna/post/Deay5Q0kv9i", "note": "", "reply": "「無法言說的孤單」這六個字，小編看了好久 🥹\n\n一邊要穩住自己的情緒、一邊還要先接住孩子的情緒\n這兩件事同時做，本來就是最難的那一種\n而妳每天都在做 ( ˘ᵕ˘ )\n\n留言區這麼多人說「就是這個感覺」\n代表這份心情真的有被接住 🤍\n哪天真的擠出兩個小時，先去做那件最想做的事 ♡", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@imjou___", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@imjou___/post/DeeXb2aGkmw", "note": "", "reply": "「我不棒的話，誰棒！」這句太帥了 👏٩(๑❛ᴗ❛๑)۶\n轉職第一天就上班、接三個小孩、還煮了一頓飯\n這份戰績值得大聲說出來 ✨\n\n留言區一排媽咪跟著報自己的第一天，看得好過癮 😂\n這一段會越來越上手的，先替妳拍拍手 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@harry.emma.family", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@harry.emma.family/post/DedTB_Jj8JG", "note": "", "reply": "24 小時待命這件事，光用想的就知道有多滿 🥹\n底下的珍奶派跟「小孩睡著才是我的時間」派都好可愛 😂(｡•ᴗ-)✧\n\n小編會找一件「不用額外挪時間」的事來喘口氣：\n幫寶寶擦完乳液那一下，順手也在自己手上抹一層\n一分鐘就結束，但那一分鐘是妳的 ✨\n\nWeWee 寶貝潤潤乳大人小孩共用一罐\n吸收快、不黏不悶，可以鎖住水分 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@edna1110509", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@edna1110509/post/DeI3Krrj9qH", "note": "", "reply": "先用夾鏈袋包起來這招好聰明，看得出來妳很有系統 👏(๑•̀ㅂ•́)و✧\n底下的收納方向都好實用，可以慢慢挑 ✨\n\n小編想補收納以外的一步：\n放在地墊上的那幾樣最常被抓被啃\n收回盒子之前用美好實驗室的植萃抗菌噴霧噴一噴擦過\n無色無味無酒精，小手直接抓也不用一直沖水\n\n玩完手腳乾乾的時候再抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@leemeng1015", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@leemeng1015/post/Def9u1yneIJ", "note": "", "reply": "想一站買齊這個念頭超級實際 (๑•̀ㅂ•́)و✧\n樓上有兩位媽咪已經先幫我們說了，小編來補完整 🙋‍♀️\n\n洗澡是 WeWee 全身洗香香，洗頭洗澡洗臉一瓶搞定，泡泡很細緻、洗完不乾澀\n\n洗衣服是美好實驗室的全酵貼身衣物手洗露\n蛋白酵素會先把奶垢和分泌物的污垢分解開，用量很省\n\n洗奶瓶是果菜奶瓶潔淨液，鳳梨酵素加葡萄柚籽\n噴 3～5 下，奶瓶、蔬果、雞蛋同一瓶就搞定，用的是食品級防腐劑\n\n這兩個品牌是同一家台灣公司做的，確實可以一次補齊 ✨( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@yoliyo9902", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yoliyo9902/post/DegRmdGEcv1", "note": "", "reply": "想送「用得久又真的會用到」的東西，這份心意很細 🤩٩(๑❛ᴗ❛๑)۶\n\n小編的判斷是：挑媽媽和寶寶可以共用的那種\n不用猜尺寸、也不會用一下就被淘汰 ✨\n\n最常被拿去送人的是 WeWee 寶貝潤潤乳\n新生兒就能擦，媽媽產後手和手臂乾的時候也能一起用\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n送別人家的寶寶會比較放心 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@8_n.n__2.4", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@8_n.n__2.4/post/DegRs2WI579", "note": "", "reply": "第一次要選，品牌多到眼花真的很正常 🥹(｡•ᴗ-)✧\n底下的經驗都蠻實在的，可以慢慢比 ✨\n\n小編會用三件事來看：\n成分單純有效、有沒有通過認證、有沒有實際的檢測報告\n這三樣對得起來，大概就不會踩雷了 👏\n\n也來報到一下～WeWee 寶貝潤潤乳是台灣團隊研發的\n花了一年多，請敏感肌寶寶實際體驗、前後調整 30 幾次才推出\n博士團隊一直在優化，現在已經做到第三代了喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@angela.chang.1614", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@angela.chang.1614/post/DeYH3Vik-zt", "note": "", "reply": "一家五口的洗衣量，光想就知道洗衣機沒在停 😂(๑•̀ㅂ•́)و✧\n底下的濃縮款方向都蠻一致的，可以慢慢比 ✨\n\n小編想補一個丟進洗衣機之前的小步驟：\n最難處理的其實是局部那幾塊——嫩嬰的奶垢、幼兒園的飯漬、爸爸的領口汗味\n\n美好實驗室的全酵貼身衣物手洗露在那幾處抹一點、放兩三分鐘\n蛋白酵素會先把污垢分解開，再整桶丟下去洗\n用量很省，一瓶可以用好久 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@998.hsuuuu", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@998.hsuuuu/post/DePNUNklF4G", "note": "", "reply": "三分鐘熱度這個階段真的很耗大人 😂(｡•ᴗ-)✧\n帶出門玩球這招已經很有一套了 👏\n\n小編會換一個方向：同一樣東西換個位置玩\n積木搬進空浴缸、貼紙貼在落地窗上、畫畫改成趴在地板\n場景一換，舊玩具常常又能多撐好一陣子 ✨\n\n玩水玩顏料之後手腳容易乾乾的\n擦乾再抹一層 WeWee 寶貝潤潤乳\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@__o23w", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@__o23w/post/Deej3hrkyHo", "note": "", "reply": "第一次準備，看什麼都想買真的很正常 😂٩(๑❛ᴗ❛๑)۶\n底下的經驗都很實在，可以慢慢列 ✨\n\n小編的原則是：先備「每天都會用到」的那幾樣\n其他等寶寶出來、摸清楚她的脾氣之後再補，比較不會買重複 👏\n\n天天會用到的清單裡一定有乳液\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n新生兒就能用，吸收很快，可以形成保護膜 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "11", "who": "（加碼）@leemeng1015 那一串裡的感謝回覆 → 回 @we261204、@elva_05.11", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@leemeng1015/post/Def9u1yneIJ", "note": "", "reply": "哇～看到你們在這串幫我們說話，小編在螢幕前笑出來了 🥹🫶\n洗澡、手洗露、果菜奶瓶潔淨液三樣都被點到，真的揪感心\n\n謝謝你們一直在用 ♡\n有任何想問的都可以隨時跟我們說喔 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-15_1406", "title": "WeWee 脆海巡清單｜2026-10-15（四）下午 2 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@kris__8053", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kris__8053/post/DeWgCK-k86Z", "note": "", "reply": "「飯不知道在吃什麼」這句太精準了 😂٩(๑❛ᴗ❛๑)۶\n堅持不坐推車硬要自己走，看起來寶寶超有主見呢 👏\n\n小編會先做一件事：\n一坐下來就把餐椅扶手和桌面用美好實驗室的植萃抗菌噴霧噴一噴擦過\n無色無味無酒精，小手直接抓著也不用一直沖水 ✨\n\n吃完臉和手黏黏的，擦乾再抹一層 WeWee 寶貝潤潤乳\n吸收很快，可以形成保護膜 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@ginger_flowerstudio", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ginger_flowerstudio/post/DeeCk7_kSJH", "note": "", "reply": "來報到一下🙋‍♀️٩(๑❛ᴗ❛๑)۶\n我們是辰曜生技，旗下有兩個台灣自己研發的品牌：\n做敏感肌保養的 WeWee，和做無毒居家清潔的美好實驗室 🌿\n\n主力是寶貝潤潤乳\n台灣研發團隊花了一年多，請敏感肌寶寶實際體驗、前後調整 30 幾次，確定好用才推出\n博士團隊一直在優化，現在已經做到第三代了 ✨\n\n配方、檢測到瓶子都在台灣做\n這幾年也一直在陪重症病童說故事、走進國小教學 ( ˘ᵕ˘ )\n歡迎來逛逛喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@cc652768", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cc652768/post/DecFyGlDw2Q", "note": "", "reply": "從吃素跨到海鮮這一步，光是找食材就卡好久 (´;ω;｀)\n底下的方向蠻一致的，小包裝、一餐一包最好分 ✨\n\n再說一個很容易被跳過的前一步 👏\n蝦子蛤蜊退冰之後，表面那一層滑滑的最好先處理掉\n\n美好實驗室的果菜奶瓶潔淨液是鳳梨酵素加葡萄柚籽\n噴 3～5 下、沖一下水就掉了\n蔬果、雞蛋、奶瓶可以用同一瓶，用的是食品級防腐劑 ʕ•ᴥ•ʔ(๑•̀ㅂ•́)و✧", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@ruby_840419", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ruby_840419/post/DeRDmYYGsP8", "note": "", "reply": "「好背」跟「耐重」真的要一起看，底下的經驗都很實在 (｡•ᴗ-)✧\n小編會多看一個地方：肩帶夠不夠寬，背久的差別可能會很明顯 👏\n\n再說一個包裡的小習慣：\n固定留一個外側口袋放一小罐 60ml 的 WeWee 寶貝潤潤乳\n不用整包翻出來就拿得到 ✨\n\n台灣的天氣悶，玩完手腳黏黏的、脖子皺摺悶到的時候抹一層\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@celeste___0520", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@celeste___0520/post/DeWE3CfEiX5", "note": "", "reply": "滿月前那幾週最忙，禮盒這件事很容易被擠到最後 🥹(´;ω;｀)\n底下的經驗都蠻實用的，可以慢慢比 ✨\n\n小編會先把名單分成兩批：\n要宅配寄出去的挑耐放一點的，親手送的再挑包裝漂亮的\n數量先抓出來，之後下訂會順很多 👏\n\n多說一句媽媽自己的：\n這段抱寶寶、洗手的次數暴增，手跟手臂很容易乾\nWeWee 寶貝潤潤乳一罐大人小孩共用\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@momobb_2673", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@momobb_2673/post/DeVjBv7E363", "note": "", "reply": "3M 就 62 公分，長得好快呀 👶٩(๑❛ᴗ❛๑)۶\n底下的款式都好可愛，可以慢慢挑 ✨\n\n小編會多看一件事：袖口和褲口能不能反折\n這個月齡長最快，能反折的直接抓大一碼，一件可以多穿一兩個月 👏\n\n換季的時候皮膚比較容易乾\n洗完澡趁還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快、不黏不悶，可以形成保護膜 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@shannn.15_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@shannn.15_/post/DeBrrU0ElFj", "note": "", "reply": "連平安符都上身，這個裝備量真的很可以 😂(｡•ᴗ-)✧\n出門一趟像在打包小行李呢 ✨\n\n再說一個收尾的小撇步：\n咬一整天下巴和脖子常常會濕濕的\n可以用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n\n壓乾之後抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@yeemai0321", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yeemai0321/post/Def7VCQCWtU", "note": "", "reply": "「每次拿掉什麼就會出狀況」這個莫非定律太真實了 🤣٩(๑❛ᴗ❛๑)۶\n備用衣服跟濕紙巾看起來是全場共識 ✨\n\n接著那包髒衣服回家怎麼辦也很關鍵：\n美好實驗室的全酵貼身衣物手洗露裡面是蛋白酵素\n在髒的地方抹一點、放兩三分鐘再洗，污垢會先被分解開\n用量很省，一瓶可以用好久 👏\n\n回家洗完澡趁皮膚還微濕抹一層 WeWee 寶貝潤潤乳\n可以鎖住水分，一天就收乾淨了 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@mrs.wu5", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mrs.wu5/post/DebzkyMEvB1", "note": "", "reply": "帶小孩泡溫泉是秋天最舒服的行程之一 ( ˘ᵕ˘ )✨\n底下推薦的地方看起來都好好玩，可以慢慢挑 👏\n\n小編想補一個泡完的小步驟：\n起來先用清水把身上沖過一遍，再把水輕輕擦乾\n\n趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n可以鎖住水分、舒緩乾燥，吸收很快又不黏不悶 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@itsmolly_daily", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@itsmolly_daily/post/DedsE7PkdTo", "note": "", "reply": "一打一帶寶寶出國，光是想就需要勇氣，妳很勇敢呢 👏(๑•̀ㅂ•́)و✧\n底下的經驗都很值得參考，可以照自己的節奏安排 ✨\n\n行李那邊小編會帶 WeWee 旅行組：\n60ml 的寶貝潤潤乳、30ml 的舒膚精華、60ml 的洗香香\n飯店洗完澡趁皮膚還微濕擦一層，大人小孩共用很省空間\n\n太陽大的地方防曬一定要帶：\n極潤植萃防曬乳是純物理性的、6 個月以上就能用，溫和不熏眼睛\n小孩不愛擦就換防曬氣墊，輕拍一下就擦好了\n\n最後塞一瓶 60ml 的植萃抗菌噴霧\n飯店房間、推車扶手、機艙椅背噴一噴擦過，無色無味無酒精\n60ml 剛好可以上飛機 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-15_1006", "title": "WeWee 脆海巡清單｜2026-10-15（四）早上 10 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@shinreed_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@shinreed_/post/DecWE_alM87", "note": "", "reply": "6 點半上床、7 點半前睡著，這個作息表看起來像傳說 😂٩(๑❛ᴗ❛๑)۶\n「吃飯比睡覺重要」這句太有個性了，寶寶自己很有想法呢 👏\n\n留言區一排媽咪在報自己家的睡眠紀錄，看得好過癮 ✨\n\n再說一個小編很愛的睡前小儀式：\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快、不黏不悶，抹完就能直接躺進被窩\n可以鎖住水分，整晚都舒舒服服的 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@_____8.15_s", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_____8.15_s/post/DeajSOaEuTa", "note": "", "reply": "看到妳在留言裡說「生囉」，先大聲說一句恭喜 🤍✨\n\n10/13 從今年開始變成一個很特別的日子了 ( ˘ᵕ˘ )\n\n接下來寶寶有人幫忙顧的時候，請妳不要擔心，用力休息\n回家之後還有好多新功夫要一起練呢～\n把體力留到那時候用，會越來越上手的 ♡", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@b7235289", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@b7235289/post/DeeJNWwExGj", "note": "", "reply": "「還要幫小孩準備遊戲室」這句的無奈感太真實了 😂(｡•ᴗ-)✧\n客廳的主權早就換人，爸爸只能跟著進去關一起 🤣\n\n小編會順手做兩件事：\n地墊和最常玩的那幾樣用美好實驗室的植萃抗菌噴霧噴一噴擦過\n無色無味無酒精，小手摸到也不用一直沖水 ✨\n\n玩到滿身汗出來，擦乾再抹一層 WeWee 寶貝潤潤乳\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶 ʕ•ᴥ•ʔ(๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@_alwel_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_alwel_/post/DedXuBOGJJO", "note": "", "reply": "「已經不敢量ㄌ」這五個字小編看了好有畫面 😂(｡•ᴗ-)✧\n留言區的數字跨度超大，真的是人人一套劇本 ✨\n\n數字先放一邊，小編想說另一件現在就能做的事：\n孕中期之後肚子一天一天變大，皮膚會比較緊\n洗完澡趁還微濕先點一點 WeWee 舒膚精華油\n再疊一層寶貝潤潤乳鎖住水分\n\n維持肌膚彈性、調理肌膚紋路都靠這一步\n不用花什麼時間，順手就做完了 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@__09.18__", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@__09.18__/post/Dd8z8vwn1nD", "note": "", "reply": "忍痛那兩個字小編完全懂，但看到寶寶抱著不放的樣子就覺得值得了 🥹(｡•ᴗ-)✧\n留言區很多人實測過，看起來可以放心一點 ✨\n\n補一個洗之前的小步驟：\n絨毛玩偶最難處理的其實是口水和汗水留下的那一層\n先用美好實驗室的全酵貼身衣物手洗露在那幾個地方抹一點、放兩三分鐘\n蛋白酵素會先把污垢分解開，再丟進洗衣袋洗\n用量很省，一瓶可以用好久 ʕ•ᴥ•ʔ(๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@ct_.915", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ct_.915/post/DeeKbWBk5m5", "note": "", "reply": "五個月肚肚開始冒出來，衣櫃直接進入改朝換代 😂٩(๑❛ᴗ❛๑)۶\n底下媽咪們挑的款式都好好看 ✨\n\n小編會多看兩個地方：\n腰那一圈是不是鬆緊可調（後面幾個月差超多）\n還有上下分開的套裝，生完之後餵奶會比連身的方便很多 👏\n\n多說一句搭配的：\n換季之後肚皮容易乾乾的，洗完澡擦一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度\n這罐台灣團隊研發了一年多，現在已經做到第三代了喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@wendy_1080911", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wendy_1080911/post/DecAFSXiQMV", "note": "", "reply": "一歲內的優格真的要挑一下，無糖的小孩接受度又是另一道關卡 😂(｡•ᴗ-)✧\n底下的方向蠻一致的，照成分單純這個原則挑就對了 ✨\n\n小編會先從最小的份量開始、一次只試一種\n小孩的喜好很難猜，等她點頭了再補貨比較不會放到過期 👏\n\n再說一個搭配的小撇步：\n優格吃完嘴邊和下巴常常黏糊糊的\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後抹一層 WeWee 寶貝潤潤乳，可以形成保護膜 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@heart.84", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@heart.84/post/DefoxIDH94b", "note": "", "reply": "第一次要把小孩交出去，焦慮真的會跑出來 🥹(´;ω;｀)\n底下媽咪們給的經驗都很實在，可以慢慢消化 ✨\n\n小編想補一個現在就能開始練的：\n把褲子換成她自己拉得上來的鬆腰款、鞋子挑魔鬼氈的\n在家先練幾次，到學校那幾天會順很多 👏\n\n另外書包裡放一小罐 WeWee 寶貝潤潤乳\n玩沙玩水之後手和臉乾乾的時候抹一層，可以形成保護膜\n吸收很快，小朋友自己也抹得起來 (๑˃̵ ᴗ ˂̵)ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@candy_.1122", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@candy_.1122/post/Dee9kTNj_tG", "note": "", "reply": "連大寶的生日禮都一起想到了，這份心意超級細 🤩٩(๑❛ᴗ❛๑)۶\n\n月子期間最受歡迎的，通常是「她自己也用得到」的東西 ✨\n小編會送一罐 WeWee 寶貝潤潤乳\n媽媽產後皮膚容易乾，寶寶洗完澎澎也能一起擦，一罐兩個人共用\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n送別人家的新生兒也比較放心 ( ˘ᵕ˘ )\n\n大寶那份可以往「兩歲能自己動手」的方向找\n貼紙書、布書這類耐玩又不佔空間 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@xuan0423", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@xuan0423/post/DeEieMrEroV", "note": "", "reply": "第一次帶兩歲出國，光是打包就是一場大工程 😂(｡•ᴗ-)✧\n底下「行程不要排滿、一天一個點」的方向真的很實用 ✨\n\n先補一個很多媽咪回國才知道的事：\n沖繩當地的超市和藥妝店就買得到寶寶專用純水\n水質比台灣軟，小孩通常比較願意喝、泡奶也方便，不用從台灣扛水出門 👏\n\n行李那邊小編會帶 WeWee 旅行組：\n60ml 的寶貝潤潤乳、30ml 的舒膚精華、60ml 的洗香香\n飯店洗完澡趁皮膚還微濕擦一層，大人小孩共用很省行李\n\n沖繩的太陽一整年都不手軟，防曬也記得帶：\n極潤植萃防曬乳是純物理性的、6 個月以上就能用，溫和不熏眼睛\n小孩不愛擦就換防曬氣墊，輕拍一下就擦好了\n\n最後塞一瓶 60ml 的植萃抗菌噴霧\n租來的車上、餐桌、推車扶手噴一噴擦過，無色無味無酒精\n60ml 剛好可以上飛機 ʕ•ᴥ•ʔ(๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-15_0813", "title": "WeWee 脆海巡清單｜2026-10-15（四）早上 8 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@rrrrapunzel_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@rrrrapunzel_/post/DeCa2uMiZEB", "note": "", "reply": "建議回覆\n包屁衣的價差真的很難懂，加到購物車都會先猶豫一下 😂(｡•ᴗ-)✧\n底下媽咪們給的方向都很實用，可以慢慢比 ✨\n\n小編會多看兩個小地方：\n領口和腋下的縫線有沒有包邊、水洗標能不能烘\n同一個尺寸不同家落差也很大，先買一件試穿再回頭補比較不會踩空 👏\n\n新衣服洗過一次再穿，摸起來會更軟\n換季的時候脖子皺摺可能會悶到，擦乾再抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜～這罐現在已經是第三代，研發團隊一直在調 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@mmikacc", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mmikacc/post/DeLnUYDmk8p", "note": "", "reply": "建議回覆\n一入住先把東西全部排好，這個儀式小編完全理解 ٩(๑❛ᴗ❛๑)۶\n檯面一整齊，接下來一個月都會順很多 ✨\n\n月中備品裡最容易被擠掉的是保養那一格\n小編會留一個位置給乳液，換尿布、洗完澎澎的時候順手抹一層\nWeWee 寶貝潤潤乳一罐從脖子擦到小腿都可以，不用擺一排瓶子 ( ˘ᵕ˘ )\n\n再加一瓶美好實驗室的植萃抗菌噴霧\n月中和醫院備的乾洗手大多是酒精的，洗手次數一多手會變超乾\n這罐無色無味無酒精，寶寶的小手碰到也不用一直沖水 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@wb0720", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wb0720/post/Ded58rvEU1u", "note": "", "reply": "建議回覆\n爸爸這篇太甜了，八個月真的是表情最多的時候 🥰\n小編私心也投八個月：會笑、會互動、還不會跑掉 😂٩(๑❛ᴗ❛๑)۶\n\n「口水巾濕了就趕緊換」這個習慣超關鍵，難怪顧得這麼好 👏\n\n會啃的那隻可以再加一步：\n用美好實驗室的植萃抗菌噴霧噴一噴擦過，無色無味無酒精\n放嘴巴的東西先處理過比較放心 ✨\n擦完脖子和下巴之後抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@lili__0.0__", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lili__0.0__/post/DeeFM7nkqZQ", "note": "", "reply": "建議回覆\n「睡到自然醒」這四個字現在聽起來像古代傳說 😂(´▽`ʃ♡ƪ)\n\n看留言才知道四、五點起床玩玩具的寶寶也不少\n原來大家都在同一條船上 🥹\n\n整夜被叫醒好幾次，白天還能把寶寶顧得好好的\n這件事本身就很厲害了 👏(๑˃̵ ᴗ ˂̵)\n寶寶的睡眠一個月就能差很多，很快就能睡回來一點點的 🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@angela.chang.1614", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@angela.chang.1614/post/DeV-p0kkzZc", "note": "", "reply": "建議回覆\n這題的留言好可愛，一路從「出生第三天」排到「在肚子裡就開始吃」🤣\n原來大家家裡都有一位 ٩(๑❛ᴗ❛๑)۶\n\n兩個多月吃手是在認識自己的手，看著超療癒 👶\n\n吃手的時候下巴和脖子常常會濕濕的\n可以用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後抹一層 WeWee 寶貝潤潤乳，可以形成保護膜 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@zhangyayun590", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zhangyayun590/post/DeeRK1dky0k", "note": "", "reply": "建議回覆\n「沖完不要滑滑的」這個條件小編超有共鳴，沖半天還覺得沒乾淨最煩 😮‍💨(｡•ᴗ-)✧\n\n選的時候可以看泡泡細不細緻\n泡泡細一點，沖水的時候水一過就掉了 ✨\n\nWeWee 全身洗香香就是走這個路線\n洗頭洗澡洗臉一瓶搞定、泡泡很綿、洗完不乾澀，帶一點淡淡香氣\n大人小孩可以共用一罐 ʕ•ᴥ•ʔ\n洗完趁皮膚還微濕擦一層寶貝潤潤乳，可以幫皮膚鎖住水分 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@kelly_wu0514", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kelly_wu0514/post/DeWvCH6E6M0", "note": "", "reply": "建議回覆\n台灣製這個條件小編舉手 🙋‍♀️٩(๑❛ᴗ❛๑)۶\n那就來報到一下～\n\n我們是辰曜生技，旗下有兩個台灣自己研發的品牌：\n做敏感肌保養的 WeWee，和做無毒居家清潔的美好實驗室 🌿\n清潔用品那一欄可以一次補齊：\n餐具清潔露、果菜奶瓶潔淨液、全酵貼身衣物手洗露、植萃抗菌噴霧\n\n保養的主力是寶貝潤潤乳，台灣團隊研發一年多、現在已經做到第三代\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級 ✨\n一罐從脖子擦到小腿都可以，大人小孩共用也沒問題 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@han155__0", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@han155__0/post/DePkFyLk5Zu", "note": "", "reply": "建議回覆\n消毒鍋這題底下的經驗蠻集中的，可以照自己的檯面空間挑 ✨(｡•ᴗ-)✧\n小編會先量一下放得下的高度，再看一次能放幾支、好不好加水 👏\n\n多說一句很容易被跳過的前一步：進鍋之前的清洗\n奶垢沒洗乾淨，烘完還是會留下痕跡 😮‍💨\n\n美好實驗室的果菜奶瓶潔淨液是鳳梨酵素加葡萄柚籽\n噴 3～5 下就能洗奶瓶，蔬果和餐具也能一起用\n沖水的時候很快就掉了 ʕ•ᴥ•ʔ(๑•̀ㅂ•́)و✧", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@szui1201", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@szui1201/post/DedxcSNmIDT", "note": "", "reply": "建議回覆\n兩歲開始騎滑步車，公園放電的效率直接翻倍 😂٩(๑❛ᴗ❛๑)۶\n底下的推薦可以慢慢比 ✨\n\n小編會先看座椅高度能不能調到「坐著腳掌踩得平」\n這個高度最好上手，也比較騎得久 👏\n\n戶外的標配別忘了防曬：\nWeWee 極潤植萃防曬乳是純物理性的、6 個月以上就能用，不泛白不黏\n小孩不愛擦就換防曬氣墊，輕拍一下就擦好 (๑•̀ㅂ•́)و✧\n\n騎完一身汗，擦乾再抹一層寶貝潤潤乳\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@puffy.0301", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@puffy.0301/post/Ded5zNbEkz2", "note": "", "reply": "建議回覆\n七個多月出國，行李會比人還重 😂(｡•ᴗ-)✧\n底下的清單都很好逛 ✨\n\n先補一個很多媽咪回國才知道的事：\n日本當地就買得到寶寶專用純水，水質比台灣軟\n小孩通常比較願意喝、泡奶也方便，不用從台灣扛水出門 👏\n\n行李那邊小編會帶 WeWee 旅行組：\n60ml 的寶貝潤潤乳、30ml 的舒膚精華、60ml 的洗香香\n飯店洗完澡趁皮膚還微濕擦一層，乾得明顯的地方先點一點精華油再疊乳液\n小罐的不佔行李，大人小孩共用 ( ˘ᵕ˘ )\n\n再塞一瓶 60ml 的植萃抗菌噴霧\n飛機椅背、餐桌、推車扶手噴一噴擦過，無色無味無酒精\n60ml 剛好可以上飛機 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-14_2107", "title": "WeWee 脆海巡清單｜2026-10-14（三）晚上 9 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@ginnie77611", "topic": "很想帶寶寶出門，但又怕影響他睡覺的時間，好難啊", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ginnie77611/post/DeYKv4vEoh3", "note": "", "reply": "這題真的沒有標準答案，想出門又怕打亂作息\n兩邊在心裡拉扯最累人 🥹(´;ω;｀)\n\n樓上「避開長午睡那一段」的方向很實用 ✨\n小編會再把第一趟設得更短一點：\n睡醒喝完奶、精神最好的那個時段出門，一小時內就回家\n一次順利的短程，媽媽的信心會比寶寶的作息先回來 (๑˃̵ ᴗ ˂̵)\n\n出門前先擦一層 WeWee 寶貝潤潤乳\n風吹、流汗之後皮膚比較不會乾乾的\n回家擦乾再補一次就好，可以鎖住水分 🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@babynini1108", "topic": "生完之後看到鬆垮的肚皮還是好難受，可是還在修復剖腹傷口，什麼都不能做", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@babynini1108/post/DeRHjdImiRr", "note": "", "reply": "已經瘦了 14 公斤，又正在好好修復傷口\n妳做到的事情比自己以為的多很多 🥹\n\n肚皮是花了十個月慢慢被撐大的\n收回去這件事也會慢慢來，時間還站在妳這邊 🤍\n\n這段期間唯一能做的保養，剛好是最不費力的那一種：\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油\n再疊一層寶貝潤潤乳鎖住水分\n傷口那一圈交給醫師，其他地方可以好好擦\n維持肌膚彈性、調理紋路都靠這一步 ( ˘ᵕ˘ )♡", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@jiadi518", "topic": "在月中教學洗澡時用到的寶寶洗髮沐浴組覺得很不錯，忘記問是什麼牌子了", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@jiadi518/post/DeYNFQpHTud", "note": "", "reply": "月中用過覺得順手的那一罐，回家之後真的會一直想起來 😂(｡•ᴗ-)✧\n底下媽咪們的眼力也太好 👏\n\n洗沐小編會看兩個地方：\n能不能洗頭洗澡一瓶搞定、泡泡細不細緻\n一個人抱著新生兒洗，手上少一瓶就少一次手忙腳亂 ✨\n\n之後想多比一款的話，WeWee 全身洗香香也可以看看\n洗頭洗澡洗臉同一瓶、泡泡很綿、洗完不乾澀\n洗完直接接著擦寶貝潤潤乳\n一罐從脖子擦到小腿都可以 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@win_niemin", "topic": "媽咪們生完小孩覺得最大的困擾是什麼？我先來，絕對是肚皮變鬆了", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@win_niemin/post/DeGoRQJE1rL", "note": "", "reply": "「好幾件褲子都要淘汰掉」這句太有畫面了 🥲\n那個抽屜大概是最難面對的地方 (´;ω;｀)\n\n大家列的困擾裡，保養時間被壓縮到幾乎沒有也很常被提到 ✨\n\n所以小編想推一個最短的版本：\n洗完澡趁皮膚還微濕，一罐 WeWee 寶貝潤潤乳從肚皮抹到手肘\n可以鎖住水分、維持肌膚彈性\n三分鐘能完成的事，才有辦法天天做 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@yuyo1125", "topic": "小孩現在三歲，還在努力不 3C 育兒中，想問大家還有推薦什麼外出的玩具嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yuyo1125/post/DeJ5j3Hn8Z8", "note": "", "reply": "三歲還守得住不 3C，這個意志力值得一個獎 👏٩(๑❛ᴗ❛๑)۶\n\n小編的口袋名單是「口袋大小的貼紙書＋兩隻小車子」\n貼紙書可以重複貼，餐廳等上菜那十分鐘剛好夠用 ✨\n要去公園的話，一盒粗的粉筆也很耐玩\n\n戶外玩的話防曬別忘了：\nWeWee 極潤植萃防曬乳是純物理性的、6 個月以上就能用\n小孩不愛擦就換防曬氣墊，輕拍一下就擦好了\n\n玩具掉地上撿起來，用植萃抗菌噴霧噴一噴擦過就行\n無色無味無酒精，60ml 塞外出包剛好\n玩完手腳乾乾的再補一層寶貝潤潤乳 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@yuaihsieh", "topic": "小孩剛滿一歲想開始買市售寶寶食品，最推薦哪一家的寶寶麵包、燉飯？（勿貼分潤連結）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yuaihsieh/post/Dea_G_umgxZ", "note": "", "reply": "一歲之後能稍微放手買現成的，是很合理的選擇 ( ˘ᵕ˘ )\n自己煮的時間可以拿去睡覺 😂\n\n挑的時候小編會先買最小的包裝、一次只開一種口味\n小孩的喜好很難預測，先試再補比較不會囤到過期 ✨\n\n另外一歲正是自己手抓吃的年紀\n吃完臉頰和手腕那一圈常常黏黏的\n擦乾之後抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@mooni.eateat", "topic": "最近準備晉升新手媽媽，好緊張！有沒有推薦的母嬰用品呢（嬰兒推車、嬰兒床…）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mooni.eateat/post/DeeJP5YmDQf", "note": "", "reply": "準備期最花腦力的其實是「哪些要現在買、哪些可以等」🥹(｡•ᴗ-)✧\n\n小編的分法是：大件的先量家裡動線擺不擺得下\n其他小東西等寶寶回家、真的卡到再補就好\n清單越短，出月中那幾天反而越順 ✨\n\n再說一個清單上最常漏掉的一格：洗完澡的保濕\nWeWee 寶貝潤潤乳一罐從脖子擦到小腿都可以\n吸收快、不黏不悶，換尿布的時候順手補一層也行 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@lygreen73", "topic": "好喜歡看寶寶哭哭喔！我是不是有什麼問題，可不可以蓋一個寶寶哭哭大樓", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lygreen73/post/DeePBtWmFq-", "note": "", "reply": "小編完全可以理解，那個下嘴唇凸出來的瞬間真的無敵可愛 😂🤣\n大樓小編先來排隊 ٩(๑❛ᴗ❛๑)۶\n\n不過哭完之後那一輪比較累人：\n眼淚口水糊在臉上和脖子皺摺\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦 ✨\n\n壓乾之後再抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜，下次再崩潰也比較不怕 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@yi_li_01", "topic": "懷孕往七個月邁進，職業媽媽真的很需要節省時間，有推薦必買的物品嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yi_li_01/post/DeeT-r6GgoI", "note": "", "reply": "「想先把流程弄順」這件事根本是職業媽媽的超能力 👏(๑˃̵ ᴗ ˂̵)\n\n省時間的東西小編會用兩個條件篩：\n能不能一樣抵好幾樣、能不能單手完成\n雙手永遠有一隻在抱小孩，這個條件很現實 😂\n\n保養也可以照這個標準挑：\nWeWee 寶貝潤潤乳一罐從臉擦到腳，不用一直換瓶子\n吸收很快，擦完小孩馬上扭走也不會黏 ✨\n上班前那十分鐘就夠用了 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@hhh.2o26", "topic": "有沒有高的嬰兒澡盆，讓爸媽幫寶寶洗澡不會腰痠的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hhh.2o26/post/DeMBzfDEtt-", "note": "", "reply": "洗完澡腰直不起來，這個痛只有洗過的人懂 😮‍💨(´;ω;｀)\n\n高度小編會抓在自己腰上面一點點\n另外放了水之後會比空盆重很多\n所以支架穩不穩、會不會晃，比盆子多高更值得先看 ✨\n\n洗完趁皮膚還微濕就擦一層 WeWee 寶貝潤潤乳\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶\n抱起來擦完就能直接包尿布，整個流程會順很多 ʕ•ᴥ•ʔ(｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-14_1750", "title": "WeWee 脆海巡清單｜2026-10-14（三）下午 2 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@kaw.azu", "topic": "為啥洗好的衣服晾乾，下次穿上沒多久就會飄出酸臭味？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kaw.azu/post/DeVyfXAIOpL", "note": "", "reply": "洗完明明香香的，穿上身一熱就翻臉\n這個落差真的很讓人崩潰 😮‍💨(´;ω;｀)\n\n樓上說的水量多一點、曬得到太陽，都很有感 ✨\n小編想補一個很多人會漏掉的地方：洗衣槽本身\n衣服洗得再乾淨，槽裡積的皂垢和悶味還是會回到衣服上\n\n美好實驗室有一罐洗衣槽清潔劑，一個月倒一次、空機跑完就好\n順手而已，不用另外安排時間 (๑•̀ㅂ•́)و✧\n貼身衣物那幾件最容易留味道，可以另外用全酵貼身衣物手洗露\n蛋白酵素分解汗水和分泌物的污垢，用量也很省 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@yun0723___", "topic": "大家都是用什麼消毒鍋跟泡奶飲水機？下個月要出月中回家，只剩電器還沒買", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yun0723___/post/Dea50mhiV8M", "note": "", "reply": "選擇障礙小編完全懂，每一台看起來都很需要 😂(๑˃̵ ᴗ ˂̵)\n小編的想法是：先買最常用的那兩台，其他等回家真的卡到再補\n月中那邊有的東西，回家之後不一定每天都會用到 ✨\n\n電器之外，回家第一週最有感的其實是洗澎澎那十分鐘：\nWeWee 全身洗香香是洗頭洗澡洗臉一瓶搞定，泡泡很細緻、洗完不乾澀\n一個人抱著新生兒洗，手上少拿一瓶就少一次手忙腳亂 ʕ•ᴥ•ʔ\n\n洗完趁皮膚還微濕擦一層寶貝潤潤乳，可以幫皮膚鎖住水分\n流程走順了，回家那幾天會輕鬆很多 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@anchiii.77", "topic": "即將成為二寶媽，互動枕、洗奶瓶機、蘋果洋蔥汁這幾樣很猶豫，求推薦或不推", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@anchiii.77/post/Dea60kFmEfq", "note": "", "reply": "二寶媽的清單真的很精準，每一項都是被大寶訓練出來的 😂(๑˃̵ ᴗ ˂̵)\n樓上「小孩很多東西都是階段性產品，能解放雙手就是好東西」這句小編大推 👏\n\n互動枕可以多想一個使用情境：喝完奶要在上面躺一陣子\n背後和脖子貼著布，躺久了容易悶出一層汗\n所以布套好不好拆洗，實際上比支撐力更常用到 ✨\n\n抱下來之後擦乾，再抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度\n一罐從脖子擦到小腿都行，二寶大寶共用也沒問題 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@yating_530", "topic": "每個媽媽都有一樣別人覺得沒必要、我卻離不開的育兒用品，丟上來我想抄作業", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yating_530/post/DeD-yN_k0I1", "note": "", "reply": "「好不好用都是其次，能救到自己才是真的」這句太中肯了 👏٩(๑❛ᴗ❛๑)۶\n奶粉罐改裝那招小編第一次聽到，馬上記下來 😂\n\n小編家的第一名是一條 WeWee 寶貝潤潤乳\n洗完澡、換尿布、外出回家，三個時段都用同一罐\n不用想「這個部位能不能擦」，要決定的事少一件就輕鬆一點 ✨\n\n吸收很快，擦完小孩馬上爬走也不會黏得滿身 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@selina_pipithth", "topic": "快 5 個月會翻身改穿拉拉褲，但他好像覺得不透氣、悶住屁屁，每次換都會哭", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@selina_pipithth/post/DeYYI3SEeH8", "note": "", "reply": "五個月會翻身之後換尿布真的像在打仗 😂\n換一次哭一次，媽媽也會跟著心慌 (´;ω;｀)\n\n挑的時候可以多看一個地方：腰圍和大腿的鬆緊帶寬不寬\n寬一點壓痕比較淺，小孩的抗拒常常是從那裡來的 ✨\n\n再說一個搭配的小事：悶到的那一圈換下來之後\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜\n這罐是針對台灣濕熱的海島型氣候調的，吸收快、不黏不悶\n擦完直接包尿布也不會黏黏的 ʕ•ᴥ•ʔ(๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@xianyu0510", "topic": "大家每天都會帶寶寶出門散步嗎？媽媽本人很宅，附近也沒有公園，感覺這樣對寶寶很不好", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@xianyu0510/post/Dedr3HGEr2x", "note": "", "reply": "每天育兒＋擠奶＋家事已經把一天排滿了，妳已經做很多了 🥹\n寶寶這個階段最需要的，大部分就在妳身邊 🤍\n\n想出去的時候，門檻可以放很低：\n推到巷口的便利商店買杯飲料、十分鐘就回來，也算散步了\n挑有樹蔭或騎樓那一側走，日照和車子都會少一點 ( ˘ᵕ˘ )\n\n出門前先擦一層 WeWee 寶貝潤潤乳，風吹一下也比較舒服\n等寶寶滿 6 個月之後，再加上極潤植萃防曬乳\n純物理性的、不泛白不黏，搭遮陽罩一起用最安心 ♡", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@just4funnmur", "topic": "最近該把嬰兒床組起來了，想問問大家有推薦的嬰兒床墊嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@just4funnmur/post/Deb0xXpGDAi", "note": "", "reply": "床組起來的那一刻真的很有儀式感 ✨(๑˃̵ ᴗ ˂̵)\n樓上「可水洗」這個方向小編也覺得最實際，吐奶漏尿是日常 😂\n\n再補一個很容易忽略的：下單前先量清楚床的內徑\n床墊和床框之間盡量不要留到縫，這件事比厚度還值得先確認 👏\n\n床鋪好之後，順手把睡前保養也排進流程裡：\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n可以幫皮膚鎖住水分，整晚躺著也比較舒服 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@huahua831107", "topic": "請各位推薦我媽媽包，謝謝", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@huahua831107/post/DecVx1Ij04s", "note": "", "reply": "媽媽包這題問得好，底下的推薦可以慢慢比 ٩(๑❛ᴗ❛๑)۶\n小編會先問自己一件事：主要是要掛推車，還是要背在身上？\n這個先決定，款式就會少掉一半 ✨\n\n再看一個細節：有沒有一個從外面單手就能拿到的口袋\n抱著小孩還要翻整包，是最容易暴走的那一刻 😂\n\n包裡小編固定塞兩樣：60ml 的 WeWee 寶貝潤潤乳\n玩完手腳乾乾、脖子悶到的時候隨手補一層，可以舒緩乾燥\n再加一瓶植萃抗菌噴霧，餐桌、推車扶手、玩具掉地上撿起來都能噴一噴擦過\n無色無味無酒精，小瓶的塞側袋剛好 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@_wenyi_hong", "topic": "寶寶換季可以推薦能保濕臉的乳液嗎？現在用的已經不適合他的皮膚了", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_wenyi_hong/post/DeTOuL-E5s8", "note": "", "reply": "換季的時候原本好好的那罐突然不合用，真的會手足無措 🥹\n臉又是最明顯的地方，每天看著更著急 (´;ω;｀)\n\n小編挑臉部乳液會看三件事：成分單不單純、有沒有做檢測、有沒有認證\n時機也差很多：洗完臉輕輕按乾、趁皮膚還微濕就擦，吸收會好很多 ✨\n\nWeWee 寶貝潤潤乳有積雪草、神經醯胺和甘草酸\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n臉和身體可以共用一罐 ( ˘ᵕ˘ )\n乾得特別明顯的地方，先點一點舒膚精華油再疊乳液鎖水，會更撐得住 🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@peichunnnnn1oo3", "topic": "座標台灣南部，2 個月寶寶入秋進冬要怎麼穿？長袖包屁衣要備幾件、尺寸怎麼抓", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@peichunnnnn1oo3/post/DecYjVYj_UT", "note": "", "reply": "南部的「微涼」真的是一門學問 😂\n樓上洋蔥式穿搭＋背心這個方向最實用 👏\n長袖包屁衣先備夠一天換洗的量，之後再視情況補就好 ✨\n\n小編補一個判斷的小撇步：\n想知道穿得夠不夠，摸脖子後面比摸手腳準\n手腳涼涼的很常見，脖子後面溫溫的、沒有濕黏就剛好 (๑˃̵ ᴗ ˂̵)\n\n一天穿脫好幾次，背後和皺摺悶出汗之後擦乾\n再抹一層 WeWee 寶貝潤潤乳，可以提升肌膚舒適度\n這罐是台灣團隊研發的，前後調了 30 幾次才推出，現在做到第三代了 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-14_1006", "title": "WeWee 脆海巡清單｜2026-10-14（三）早上 10 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@suoolong", "topic": "36 週產檢解鎖養胎不養肉，寶寶 2800 公克、媽媽只胖 0.6 公斤", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@suoolong/post/Deb_lrAk-Jw", "note": "", "reply": "36 週還只胖 0.6 公斤，寶寶又養得剛剛好\n這張成績單也太漂亮了 👏٩(๑❛ᴗ❛๑)۶\n\n留言區整排都在聊吃的，小編來補一個「擦的」：\n最後這幾週肚皮被撐到最大，很容易乾乾癢癢的\n洗完澡趁皮膚還微濕就擦，吸收會差很多 ✨\n\n順序是先點一點 WeWee 舒膚精華油，再疊一層寶貝潤潤乳鎖水\n油是無防腐劑的，維持肌膚彈性、調理紋路都靠這一步\n卸貨之後寶寶也能一起用同一罐喔～ ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@yee_0930", "topic": "Stokke 成長椅真的值得買嗎？想從新生兒就開始用", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yee_0930/post/DeQzGPvCW9U", "note": "", "reply": "已經入手了，而且還卡到婦幼展的折扣，這波超值得 👏(๑•̀ㅂ•́)و✧\n樓上那句「女兒 7 個月開始，用到現在 3Y9M 繼續服役中」聽起來最安心 ✨\n\n補一個開始坐餐椅之後才會遇到的小事：\n吃副食品那陣子，下巴和脖子皺摺整天都濕濕的\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@wangnan676", "topic": "寶寶 4 個多月準備找練習用的水杯，想蓋一個「超好用的學習水杯」樓", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wangnan676/post/DeOdIaSgOwJ", "note": "", "reply": "蓋樓問水杯這招太聰明了，一次收集完就不用一直爬文 😂٩(๑❛ᴗ❛๑)۶\n\n挑的時候小編會多看一個地方：吸管和止逆閥能不能整根拆開洗\n拆得開才洗得到裡面，不然用沒多久就會卡一層 ✨\n\n洗的時候可以用美好實驗室的果菜奶瓶潔淨液\n鳳梨酵素＋葡萄柚籽，奶瓶、水杯、蔬果都能洗，噴 3～5 下沖掉就好\n\n另外 4 個多月開始練習喝水，下巴那一圈常常整天濕濕的\n擦乾之後補一層 WeWee 寶貝潤潤乳，可以提升肌膚舒適度 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@wee__0312", "topic": "為什麼男生的衣服那麼難買？男寶的媽咪可以推薦我買男寶衣服的商店嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wee__0312/post/DeTaQTMAfgn", "note": "", "reply": "男寶的衣服選擇真的少一大截，花色翻來翻去都是恐龍跟汽車 😂(๑˃̵ ᴗ ˂̵)\n\n小編自己會多看兩個地方：\n肩膀是不是肩開式、下襬有沒有排扣\n男寶扭來扭去的時候，好不好穿脫比好不好看還重要 ✨\n褲頭有鬆緊可調的也很加分，長肉的速度真的超快\n\n再說一個：男寶活動量大，玩一玩就滿身汗\n擦乾之後抹一層 WeWee 寶貝潤潤乳\n是針對台灣的濕熱天氣調的，吸收快、不黏不悶\n擦完馬上穿衣服也不會黏在身上 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@xuannnn0114", "topic": "懷孕 24 週明天要出發東京，這次要爆買女兒的，有推薦在東京買什麼寶寶用品嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@xuannnn0114/post/DeT0XM1EkIq", "note": "", "reply": "懷孕 24 週還衝東京，媽媽體力也太好了 👏٩(๑❛ᴗ❛๑)۶\n樓上報的那幾個點，女寶媽真的會逛到走不動 😂\n\n買女兒的之外，順便提醒一下妳自己的部分：\n東京這個季節室內外溫差大、空氣偏乾\n肚皮本來就被撐著，更容易緊緊癢癢的 ✨\n\n行李可以塞一瓶 30ml 的 WeWee 舒膚精華油\n洗完澡趁皮膚微濕先擦一層，再疊 60ml 的寶貝潤潤乳鎖水\n比單擦一罐撐得久，兩瓶都是小容量，隨身包就塞得下 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@han07_26_", "topic": "這個連假到底要帶小孩去哪裡放電？高雄快被我們玩透透了", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@han07_26_/post/DeRUlqTE27D", "note": "", "reply": "高雄被玩透透這句也太真實 😂ʕ•ᴥ•ʔ 媽媽們的口袋名單真的消耗得超快\n\n挑地點的時候可以多看一個條件：有沒有遮蔭或半室內\n南部這個時節中午還是很有感，隨時有陰影可以躲\n整天的續航力會差很多 ✨\n\n出門前再補兩樣：WeWee 極潤植萃防曬乳，純物理性、6 個月以上就能用\n小孩不愛擦的話有防曬氣墊，輕拍就擦好了\n包包裡可以塞一瓶 60ml 植萃抗菌噴霧\n遊具扶手、野餐桌噴一噴擦過，無色無味無酒精\n玩完手腳乾乾的，再補一層寶貝潤潤乳 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@cc_34.c", "topic": "好想看看大家怎麼用 IKEA 佈置新生兒的房間！櫃子加尿布墊還是直接買尿布檯？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cc_34.c/post/DebZuK2gW5x", "note": "", "reply": "尿布檯這題，小編會先投「櫃子加尿布墊」一票 (๑˃̵ ᴗ ˂̵)\n樓上說折疊長桌過渡期後還能收起來，彈性真的大很多 ✨\n\n還有一個很多人會忽略的：檯面高度要抓在自己的腰上面一點點\n一天要換十幾次，差個兩三公分，一個月後腰就會告訴妳 😂\n\n檯面旁邊固定放一罐 WeWee 寶貝潤潤乳\n換尿布的時候順手在小腿、關節處抹一層，不用另外排保養時間\n吸收快、不黏不悶，擦完直接包尿布也不會黏 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@kjy241", "topic": "新生兒有什麼是必買電器～目前只知道消毒鍋", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kjy241/post/DebHazPEfyJ", "note": "", "reply": "消毒鍋之外，樓上提的除濕機和清淨機小編也會列進去 👏(๑•̀ㅂ•́)و✧\n真的要再加一台的話，溫控開飲機半夜泡奶會很感謝自己 🍼\n\n不過順便提醒一件很多人會忘記的事：\n除濕機一開，室內會比想像中乾，寶寶皮膚也跟著乾得比較快 ✨\n\n洗完澡趁皮膚還微濕就擦一層 WeWee 寶貝潤潤乳\n可以幫皮膚鎖住水分、形成保護膜\n這樣整晚開著除濕也比較放心 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@___z.zy___", "topic": "34+2 新手媽咪求推薦：屁屁膏、沐浴乳、乳液、濕紙巾、嬰兒洗衣精…有沒有成分單純的品牌？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@___z.zy___/post/DeDlWweEhVv", "note": "", "reply": "34+2 還有力氣把清單列得這麼完整，妳真的超穩 👏٩(๑❛ᴗ❛๑)۶\n\n挑的時候小編會看三件事：成分單不單純、有沒有做過檢測、有沒有認證\n瓶數少一點沒關係，每一瓶都用得安心比較重要 ✨\n\n洗沐可以看看 WeWee 全身洗香香，洗頭洗澡洗臉一瓶搞定\n泡泡很細緻、洗完不乾澀\n新生兒抱著洗的時候，少拿一個瓶子就少一次手忙腳亂\n\n乳液是寶貝潤潤乳，有積雪草、神經醯胺和甘草酸\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n\n衣物那格可以看美好實驗室的全酵貼身衣物手洗露\n蛋白酵素分解污垢，炸屎和奶漬都洗得掉 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@e0926438391", "topic": "寶寶 7 個月想換乳液，手肘附近乾乾紅紅，有推薦的乳液嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@e0926438391/post/DecXYrFE9cs", "note": "", "reply": "手肘那一圈乾乾紅紅的，看了真的會心疼 🥹\n\n幾個日常現在就能調：洗澡水不要太熱、十分鐘內結束\n洗完趁皮膚還微濕就擦，一天分幾次薄薄補，比厚厚擦一次有用\n睡前把指甲剪短，抓出來的傷口會比原本的乾癢更難處理 🤍\n\n之後想再試試看的話，WeWee 寶貝潤潤乳有積雪草、神經醯胺和甘草酸\n通過德國 Dermatest® 異膚與敏感肌測試 Excellent 等級\n乾得特別厲害的地方可以先點一點舒膚精華油，再疊乳液鎖水\n陪伴過很多異膚寶寶家庭度過反覆乾癢的日常 ( ˘ᵕ˘ )♡", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-14_0813", "title": "WeWee 脆海巡清單｜2026-10-14（三）早上 8 點場 10 篇＋2 則感謝", "keywords": [], "items": [{"n": "1", "who": "@kiwiwiki2526", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kiwiwiki2526/post/DeMWV85Eii0", "note": "", "reply": "建議回覆\n這種樓小編最愛逛了 🙋‍♀️٩(๑❛ᴗ❛๑)۶\n那就來自我介紹一下～\n\n我們是辰曜生技，旗下有兩個台灣自己研發的品牌：\n做敏感肌保養的 WeWee，和做無毒居家清潔的美好實驗室 🌿\n\n主力是寶貝潤潤乳，台灣團隊研發一年多、前後調了 30 幾次才推出\n現在已經做到第三代，通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級 ✨\n純物理防曬、全身洗香香、舒膚精華油也是一路陪爸媽到現在的經典品\n\n我們也一直在台灣做公益，陪重症病童說故事、走進國小教學\n寶寶每天用的，必須很棒 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@h.ccrow", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@h.ccrow/post/DebDwulEpH7", "note": "", "reply": "建議回覆\n「網路上 10 個有 8 個推，身邊卻一個都沒有」這種落差真的很常發生 😂\n樓上那句「小孩喝得順的就是好奶粉」小編覺得最中肯 👏\n\n補一個買之前的方向：先弄一小罐或試喝包跑一輪再決定要不要囤\n接受度每個寶寶差很多，囤了換不掉最頭痛 ( ˘ᵕ˘ )\n\n再說一個～等寶寶出生之後，洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快、不黏不悶，可以幫皮膚鎖住水分、形成保護膜\n這罐小編家是備著當日常班底的 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@dsenior_369", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dsenior_369/post/Deah0FdD_b0", "note": "", "reply": "建議回覆\n剛戒尿布那陣子，出門前先查好哪裡有親子廁所，整天真的會順很多 ( ˘ᵕ˘ )\n樓上「抱著懸空」那招小編也聽媽咪們說過，媽媽的手真的很偉大 😂\n\n外出廁所包想再輕一點的話，小編會塞一瓶 60ml 的植萃抗菌噴霧\n馬桶座、扶手、換尿布的檯面噴一噴擦過就好\n柿子＋葡萄柚籽萃取，無色無味無酒精，碰到小手也不用一直沖水 ✨\n\n擦完小手再補一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@lynnooh", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lynnooh/post/DeGwsNOklxi", "note": "", "reply": "建議回覆\n「小孩用不適合、她自己也能用」這個條件抓得真好 👏(๑˃̵ ᴗ ˂̵)\n送禮最怕的就是對方早就有自己習慣的牌子 ✨\n\n小編私心覺得保養類很好送：媽媽和寶寶可以共用一罐，比較不會被收進櫃子深處\nWeWee 寶貝潤潤乳有經典香和無香兩款\n都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n媽媽擦手、寶寶擦身體都行 🍼\n\n想再多一點儀式感，可以搭一瓶舒膚精華油\n無防腐劑，她自己按一按肩頸也很舒服 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@munto_0626", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@munto_0626/post/DebDEx1EguX", "note": "", "reply": "建議回覆\n玩具會自己繁殖這件事真的沒人提醒過我們 😂ʕ•ᴥ•ʔ\n樓上「分批輪流拿出來」那招聽起來超有用 👏\n\n挑櫃子的時候小編會多看一個地方：格子的開口夠不夠大\n開口大一點，小孩自己丟進去就算收好了，收納習慣才撐得久 ✨\n\n再說一個：輪替的時候順手把玩具擦一遍\n小編會用植萃抗菌噴霧噴一噴擦過，柿子＋葡萄柚籽萃取，無色無味無酒精\n什麼都想放嘴巴的年紀用起來很順手\n擦完小手再補一層 WeWee 寶貝潤潤乳，可以提升肌膚舒適度 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@cutelemonbabe", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cutelemonbabe/post/DeZl0L1GT__", "note": "", "reply": "建議回覆\n一週沒有連續睡兩小時，還記得大寶下課後要抱他、聽他講今天的事 🥹\n這些妳都一件一件做到了\n\n這一段的頻繁夜醒不會一直這樣下去，慢慢會拉長的，很快就能喘口氣 🤍\n大寶那邊挑一件小事固定做就好，像睡前五分鐘只屬於他，他會很有安全感\n\n先生上大夜班還能把事情打理好，你們兩個人都很努力\n寶寶睡的那十分鐘，請妳先躺平閉上眼睛，家事晚一點再說 ( ˘ᵕ˘ )♡", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@yibi.0614", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yibi.0614/post/DeW_toeifRc", "note": "", "reply": "建議回覆\n快出月中那幾天真的會突然手忙腳亂 🥹 不過妳已經在做功課了，很穩 👏\n\n洗沐小編推 WeWee 全身洗香香，洗澡洗頭洗臉一瓶搞定\n泡泡很細緻、洗完不乾澀，還帶淡淡香氣\n新生兒抱著洗的時候，少拿一個瓶子就少一個手忙腳亂 ʕ•ᴥ•ʔ\n\n洗奶瓶可以看看美好實驗室的果菜奶瓶潔淨液\n鳳梨酵素＋葡萄柚籽，奶瓶、蔬果、雞蛋都能洗，噴 3～5 下沖掉就好\n\n洗完澡趁皮膚還微濕擦一層寶貝潤潤乳，可以幫皮膚鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@qqgirl4kids", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qqgirl4kids/post/DeOcuK5mD1m", "note": "", "reply": "建議回覆\n小編被召喚到了，報到 🙋‍♀️٩(๑❛ᴗ❛๑)۶\n\n我們是 WeWee，台灣自己研發的敏感肌保養品牌\n主力是寶貝潤潤乳，敏感肌、異膚、新生兒和孕媽咪都能用\n台灣團隊研發一年多、調了 30 幾次，現在做到第三代了 ✨\n\n同公司還有做居家清潔的美好實驗室\n奶瓶、蔬果、貼身衣物那些瑣事都包在它身上 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@yx._o9", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yx._o9/post/DecIqqJEnc5", "note": "", "reply": "建議回覆\n樓上那份清單整理得超完整，直接照著打勾就行了 👏(๑•̀ㅂ•́)و✧\n\n小編補「盥洗和清潔」這一格，很多清單都會漏掉：\nWeWee 旅行組有無香的寶貝潤潤乳 60ml、舒膚精華 30ml、洗香香 60ml\n住院到月中，寶寶洗澎澎和保濕一次到位，小瓶不佔行李 ✨\n\n美好實驗室那組是餐具清潔露、貼身衣物手洗露、除臭噴霧、果菜奶瓶潔淨液\n月中洗奶瓶、洗小褲褲、尿布桶除味都用得到\n\n還有一瓶很推：60ml 植萃抗菌噴霧\n醫院和月中備的乾洗手大多是酒精，住院那幾天洗手次數暴增，手會乾到脫皮\n這罐無色無味無酒精，換著用比較不會乾 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@celindadadada", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@celindadadada/post/Deb3Sc6k-21", "note": "", "reply": "建議回覆\n出門泡奶這三題真的每次都要重新想一遍 😂\n樓上「保溫瓶＋拋棄式奶瓶」的組合聽起來最省力 👏\n\n小編補「燙之前那一步」：奶瓶先洗乾淨再燙，殘奶才不會卡在螺紋裡\n美好實驗室的果菜奶瓶潔淨液有 60ml 小瓶，鳳梨酵素＋葡萄柚籽，噴 3～5 下沖掉就好 ✨\n\n還有一個很多人回國才知道的：日本和沖繩的超市、藥妝店都買得到寶寶專用純水\n水質比台灣軟，小孩接受度高，泡奶也方便，不用從台灣扛水 ( ˘ᵕ˘ )\n\n行李再塞一組 WeWee 旅行組：寶貝潤潤乳 60ml＋舒膚精華 30ml＋洗香香 60ml\n飯店洗完澎澎順手保濕，小瓶不佔位 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-13_2107", "title": "WeWee 脆海巡清單｜2026-10-13（二）晚上 9 點場 10 篇＋1 則感謝", "keywords": [], "items": [{"n": ": "2m19d 就一覺睡到 6:30，這個進度太驚人了 👏٩(๑❛ᴗ❛๑)۶\n而且妳每次視訊都認真調整，水蜜桃也很給力地配合，這組合超強 🍼\n\n黑眼圈有救的那一刻，真的會想拍照存證 😂\n\n多說一句：睡前那一段可以再加一格——\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n新生兒就能用、吸收快不黏手，抹完接著熄燈剛好\n可以鎖住水分、形成保護膜 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@hannnah_0617", "topic": "救救乾肌女，換季臉頰直接變龜裂大地，求保濕產品但不要黏", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hannnah_0617/post/Dd-4EyrmpG_", "note": "", "reply": "換季那幾天真的像換了一張臉，前一週還好好的 🥹\n乾到脫皮的時候「不要黏」這個條件最難找 (´;ω;｀)\n\n可以先把順序調一下：洗完臉趁皮膚還微濕就上，比等全乾再擦好吸收很多 ✨\n\n再說一個組合：先用 WeWee 舒膚精華油薄薄一層當前導\n（乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷，無防腐劑）\n再疊一層寶貝潤潤乳鎖水\n兩罐都是吸收快、清爽不黏的質地，先油後乳保濕的時間明顯比單擦一罐長\n可以形成保護膜、舒緩乾燥 (๑•̀ㅂ•́)و✧\n\n台灣團隊研發的，大人小孩共用一罐，家裡有小孩的話一罐就夠 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@joyce_1206_", "topic": "7M 男寶要買秋冬裝，怎麼洋蔥式穿搭？褲子買 80 還是 90？要買護肚打底褲嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@joyce_1206_/post/DeL_DkRGWoU", "note": "", "reply": "「怕著涼又怕熱穿不住」這句完全是台灣秋冬的日常 😂\n一天裡溫差大，洋蔥式真的最保險 (｡•ᴗ-)✧\n\n可以抓一個方向：裡面留薄長袖當底，中間一件薄背心或針織，外面一件好脫的外套\n進室內和上車先脫一層，出門再加回去就好 ✨\n護肚打底褲這種高腰款，爬行期肚子比較不容易露出來，可以列入參考\n\n補一個搭配的小撇步：\n多穿一層之後，脖子和背後可能會悶出汗\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳 可以形成保護膜～ ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@woan_ru", "topic": "沒做攻略就這樣，攻略之後不得了，這邊都不花錢耶！媽媽們一起來分享戰利品", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@woan_ru/post/DeO5wu9FPiu", "note": "", "reply": "一天就收成這樣，而且全部不用花錢，這個戰力太強了 👏٩(๑❛ᴗ❛๑)۶\n底下大家都在問哪一攤換的，妳這一串已經變成情報站了 😂\n\n沒換到的先別可惜～展到 10/11，限量大多是每天重新發\n\n小編也來報一個不用消費的：\nWeWee 就在台北世貿，剩下這幾天小編都在\n來攤位跟小編打聲招呼就送品牌折疊扇＋寶貝潤潤乳體驗包，每天限量 🙋‍♀️\n\n潤潤乳是台灣團隊研發一年多、前後調了 30 幾次才量產，現在是 3.0 版\n現場可以直接擦在手上試質地 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@qoop45682", "topic": "#婦幼展 佛系戰利品，11 點多去換大會贈品、北區媽媽禮就沒了", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qoop45682/post/DeOz_S2gbux", "note": "", "reply": "「佛系亂走亂逛」還能撈成這樣，這也是一種實力 😂👏\n而且妳回頭把免費奶瓶的位置找出來貼給大家，底下整排都在問 (๑•̀ㅂ•́)و✧\n\n大會贈品沒換到的話，還有 10/9–10/11 三天可以補\n\n順便說一個：WeWee 這幾天也在台北世貿\n來攤位跟小編打聲招呼就送品牌折疊扇＋寶貝潤潤乳體驗包，我們這邊每天都是重新限量 🙋‍♀️\n\n潤潤乳新生兒就能用、大人小孩共用一罐\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級，現場可以先試質地 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@iembrace", "topic": "禾流文創是本次媽媽禮冠軍，現場限量 50 組一開門就秒殺，接下來 3 天想拿要更早起", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@iembrace/post/DeO-J-cn9We", "note": "", "reply": "一開門就秒殺的排隊人龍，光聽就能想像現場有多熱 😂\n妳還順手把登記方式跟剩下的名額講清楚，底下已經有人靠這串少走一趟了 👏٩(๑❛ᴗ❛๑)۶\n\n既然還有三天，再補一個不用登記、也不用消費的：\nWeWee 在台北世貿，10/11 前小編每天都在\n來攤位打聲招呼就送品牌折疊扇＋寶貝潤潤乳體驗包，每日限量 ✨\n\n潤潤乳是台灣團隊研發一年多、調了 30 幾次才量產的，現在是 3.0 版\n體驗包小小一支，帶回家先試幾天最實際 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@dj_vina4", "topic": "後天要前往禾馨生產了，待產包禾馨有附，但有什麼是建議必帶、清單上沒有的？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dj_vina4/post/DeOisX6FNzP", "note": "", "reply": "後天就要出發了，腦袋一片空白超正常 🥹\n禾馨附得很齊，清單上沒寫的通常是「住進去才會發現需要」的那幾樣 (｡•ᴗ-)✧\n\n樓上提到的可彎吸管、個人保溫杯真的很實用，再加一條長一點的充電線會更舒服 ✨\n\n再說兩樣小的：\n美好實驗室的植萃抗菌噴霧 60ml——醫院和月中備的乾洗手大多是酒精，住院那幾天洗手次數暴增，手會變得很乾，這罐無色無味無酒精，噴一噴擦過就好\n\n還有一小罐 60ml 的 WeWee 寶貝潤潤乳\n新生兒就能用、大人小孩共用一罐，產後手乾和寶寶的保養同一罐就夠\n可以鎖住水分、形成保護膜 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@a3353542001", "topic": "9 個月寶寶有推薦好用的嬰兒背帶嗎？越來越重，背久有點吃不消，想找有椅凳的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@a3353542001/post/DeOOO8JkmzD", "note": "", "reply": "9 個月開始越背越重，肩膀和腰都在抗議 😂\n不過這也代表寶寶這段長得很好，是很健康的重量 ٩(๑❛ᴗ❛๑)۶\n\n現場試背的時候可以多看兩件事：腰帶能不能穩穩卡在髖骨上（重量才會落在腰、不是全壓在肩膀）\n還有椅凳能不能單獨拆下來用，只帶腰凳出門會輕很多 ✨\n背著走個五分鐘再決定，差別通常馬上就出來了\n\n補一個搭配的小撇步：\n背帶貼著的大腿根和脖子皺摺，可能會悶著汗\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後擦一層 WeWee 寶貝潤潤乳 可以形成保護膜～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@kiss_419", "topic": "送公托的爸媽有推薦的三色碗嗎？小孩 5 個月，6 個月開始公托要餵副食品", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kiss_419/post/DeHpJvWiYt8", "note": "", "reply": "已經下訂了，恭喜脫離選擇障礙 😂👏\n「能銜接到幼稚園」這個方向抓得很好，一組用好幾年最省 (｡•ᴗ-)✧\n\n開始帶餐具之後，每天會多一輪要洗的東西\n三色碗、湯匙、水壺吸管 : "pending", "statusNote": ""}, {"n": "7", "who": "@jl20240421", "topic": "要進入秋冬了，七個月寶寶怎麼穿？也想請大家推薦台灣製好穿的日常寶寶服裝", "time": "6 天前", "stats": "16 讚 · 14 留言 · 0 轉發 · 0 分享", "tags": "", "url": "https://www.threads.com/@jl20240421/post/Dd2k_ExgdyY", "note": "她自己開口問「台灣製」，是 F-2 明列的「台灣品牌推薦例外」位置，可以大方講品牌故事；14 則留言幾乎全是蝦皮連結與童裝賣家自薦，真正回答「怎麼穿」的只有兩三則（洋蔥式穿搭）。衣服不是我們的品項，但換季那段皮膚最乾，接得很自然。深掃未發現我們回過。 - ⚠️ 童裝品牌、賣家一律不推薦也不比較（串裡有賣家在自薦、也有人在推特定牌子，我們都不接）；串裡「拜託不要買中國製」那條對立情緒的線一個字都不碰，我們只講自己的在地優勢；依 F-16 自己也要給一個具體方向、不講我們沒做這個品項；依 F-11 這是台灣情境，可以走氣候牌但不點名、不比較。", "reply": "台灣的秋冬真的最難抓，一週內可以從 28 度掉到 18 度 😂\n樓上媽咪推的洋蔥式穿法最實用，薄長袖＋背心＋外套\n厚長袖買少少幾件就夠，室內大多還是會熱 (๑•̀ㅂ•́)و✧\n\n說到台灣製～WeWee 也是台灣團隊自己研發的\n上市前花了一年多、前後調整 30 幾次\n專為台灣濕熱的海島型氣候調過，清爽好吸收不黏不悶\n寶貝潤潤乳現在已經做到第三代了喔～ ✨\n\n換季那陣子脖子和手腳最容易乾\n洗完澡趁皮膚還微濕擦一層，可以鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@you_nihappy", "topic": "女兒七個月一直有尿布疹，8.2kg 腿腿肉肉的，想問有推薦的尿布品牌嗎", "time": "4 小時前", "stats": "5 讚 · 27 留言 · 0 轉發 · 2 分享", "tags": "", "url": "https://www.threads.com/@you_nihappy/post/DeGFLkREu6_", "note": "4 小時就 27 則留言（讚只有 5 個，留言是讚的 5 倍），而且作者每一則都親自道謝、還會回報自己下單了什麼，是本場互動最熱的一篇；27 則留言清一色在報尿布牌子與貼蝦皮連結，沒有一則講「換尿布的時候怎麼顧皮膚」，這一格完全空著。深掃未發現我們回過。 - ⚠️ 尿布品牌、版型一律不推薦也不比較（串裡已經有七八個牌子在互打，我們不選邊）；依 G 節不能寫治療或預防尿布疹、不寫退紅消炎抗過敏；她沒有提到破皮流湯，所以不用把就醫放前面，但也不承諾會好；工具與動作用詞照 E-2 固定寫法。", "reply": "七個月一直反覆，看了真的會心疼 🥹\n腿肉肉的寶寶版型真的要挑，樓上媽咪們的經驗聽起來很實用 ✨\n\n再補一個搭配的小撇步：\n便便後用乾淨溫水沖一下屁屁\n再用乾濕兩用洗臉巾輕輕「按壓」吸乾、不要來回摩擦\n晾個三五分鐘讓皮膚乾透再包上去 (๑•̀ㅂ•́)و✧\n\n皺摺處壓乾之後抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜、提升肌膚舒適度 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@qq.9980.qq", "topic": "下週要出月中開始照顧寶寶了，新手媽媽非常緊張很怕照顧不好", "time": "1 小時前", "stats": "7 讚 · 8 留言 · 0 轉發 · 3 分享", "tags": "", "url": "https://www.threads.com/@qq.9980.qq/post/DeGYLUvGiXt", "note": "才發文 1 小時、只有 8 則留言，是本場最新的搶頭香位置；8 則留言都在報衛教來源（寶寶手冊、黃瑽寧醫師、母嬰同室），沒有一則講「回家前怎麼把環境準備好」，這是最實用也最空的角度。她正好站在 D-2／F-13 那個「從有人顧回到自己顧」的轉換點上。深掃未發現我們回過。 - ⚠️ 拍嗝幾下、側睡正睡、幾小時餵一次這些照護與安全判斷一個字都不下（串裡已經有人在給具體做法，我們不加入也不反駁）；依 F-14 不寫「撐過」；依 F-12 不去否認她沒說出口的自責（不寫「不是妳不會顧」這種澄清句）；串裡的 LINE 社群導流連結不碰。", <header class="top">
  <div class="top-inner">
    <h1>脆海巡回覆台</h1>
    <p class="sub" id="sub"></p>
    <button class="chip runpick" id="runpick" aria-expanded="false"></button>
    <div class="scroller" id="runs" hidden></div>
    <div class="row" style="margin-top:8px">
      <button class="chip" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" data-f="pending" aria-pressed="false">待回</button>
      <button class="chip" data-f="done" aria-pressed="false">已回</button>
      <button class="chip" data-f="skip" aria-pressed="false">不回</button>
      <input type="search" id="q" placeholder="搜尋帳號、主題或內容" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap" id="list"></main>

<script>
(function(){
  var DATA = window.HAIXUN || [];
  var state = {run: null, filter:'all', q:''};
  try{
    var saved = localStorage.getItem('haixun.state');
    if(saved){ var o = JSON.parse(saved); if(o){ if(o.run && DATA.some(function(r){return r.file===o.run;})){ state.run=o.run; } state.filter=o.filter||'all'; } }
  }catch(e){}
  function save(){ try{ localStorage.setItem('haixun.state', JSON.stringify({run:state.run, filter:state.filter})); }catch(e){} }

  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var label = function(file){
    var m = file.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})?/);
    if(!m) return file;
    return m[2]+'/'+m[3]+' '+m[4]+':'+(m[5]||'00');
  };
  var all = [];
  DATA.forEach(function(r){ r.items.forEach(function(it){ all.push(it); }); });

  var marks = {}, ducaMarks = {}, skipMarks = {};
  function loadMarks(){
    try{ marks = JSON.parse(localStorage.getItem('haixun.marks')||'{}'); }catch(e){ marks = {}; }
    try{ ducaMarks = JSON.parse(localStorage.getItem('haixun.marks.duca')||'{}'); }catch(e){ ducaMarks = {}; }
    try{ skipMarks = JSON.parse(localStorage.getItem('haixun.marks.skip')||'{}'); }catch(e){ skipMarks = {}; }
  }
  loadMarks();
  function markKey(it){ return it.url || it.who; }
  function whoDone(it){
    var id = markKey(it), out = [];
    if(marks[id]) out.push('Claude');
    if(ducaMarks[id]) out.push('Duca');
    return out;
  }
  // effective status: 已回覆／已標記不回都是本機打勾，疊在海巡當時的原始狀態上面
  function effStatus(it){
    if(it.status==='done') return 'done';
    if(it.status==='skip') return 'skip';
    if(skipMarks[markKey(it)]) return 'skip';
    return whoDone(it).length ? 'done' : 'pending';
  }

  function updateSub(){
    var doneN = all.filter(function(i){return effStatus(i)==='done';}).length;
    var pendN = all.filter(function(i){return effStatus(i)==='pending';}).length;
    document.getElementById('sub').innerHTML =
      '共 <b>'+DATA.length+'</b> 場 · <b>'+all.length+'</b> 篇貼文 · 待回 <b>'+pendN+'</b> 篇 · 已回 <b>'+doneN+'</b> 篇 · ✅ 克勞德助理已回　🔵 Duca已回';
  }

  var runsEl = document.getElementById('runs');
  var pickEl = document.getElementById('runpick');
  var allBtn = document.createElement('button');
  allBtn.className = 'chip'; allBtn.textContent = '全部場次';
  allBtn.setAttribute('aria-pressed', String(!state.run));
  allBtn.addEventListener('click', function(){
    state.run = null; state.q=''; document.getElementById('q').value='';
    runsEl.hidden = true; pickEl.setAttribute('aria-expanded','false');
    save(); render();
  });
  runsEl.appendChild(allBtn);
  DATA.forEach(function(r){
    var b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(r.file===state.run));
    b.addEventListener('click', function(){
      state.run = r.file; state.q=''; document.getElementById('q').value='';
      runsEl.hidden = true; pickEl.setAttribute('aria-expanded','false');
      save(); render();
    });
    runsEl.appendChild(b);
  });
  function refreshRunChipLabels(){
    Array.prototype.forEach.call(runsEl.children, function(b, i){
      if(i===0) return;
      var r = DATA[i-1];
      var pend = r.items.filter(function(it){return effStatus(it)==='pending';}).length;
      b.textContent = label(r.file) + (pend? '　'+pend+' 待回' : '');
    });
  }
  refreshRunChipLabels();
  pickEl.addEventListener('click', function(){
    var open = runsEl.hidden;
    runsEl.hidden = !open;
    pickEl.setAttribute('aria-expanded', String(open));
    pickEl.textContent = (open? '▴ ' : '▾ ') + (state.run? label(state.run)+' 場' : '全部場次');
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-f]'), function(b){
    b.addEventListener('click', function(){ state.filter = b.dataset.f; save(); render(); });
  });
  document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });

  function statusPill(it){
    var eff = effStatus(it);
    if(eff==='done'){
      var who = whoDone(it).join('、');
      var extra = [who, it.statusNote].filter(Boolean).join(' · ');
      return '<span class="pill done">✅ 已回覆'+(extra?' · '+esc(extra):'')+'</span>';
    }
    if(eff==='skip'){
      var note = it.statusNote || (it.status!=='skip' ? '本機標記' : '');
      return '<span class="pill skip">❌ 不回'+(note?' · '+esc(note):'')+'</span>';
    }
    return '<span class="pill">待回</span>';
  }

  function card(it){
    var tags = (it.tags||'').split('/').map(function(t){return t.trim();}).filter(Boolean);
    var id = markKey(it);
    var claudeChecked = it.status==='done' || !!marks[id];
    var ducaChecked = !!ducaMarks[id];
    var skipChecked = !!skipMarks[id];
    var eff = effStatus(it);
    var cls = eff + (ducaChecked? ' duca-done':'');
    // 海巡當時已經在資料裡定案的貼文（已回／不回）不給改；只有還待回的貼文可以在這裡打勾
    var editable = it.status!=='done' && it.status!=='skip';
    var toggles = editable
      ? '<label class="chk'+(claudeChecked?' on':'')+'"><input type="checkbox" data-id="'+esc(id)+'"'+(claudeChecked?' checked':'')+'> 克勞德助理已回</label>'
        + '<label class="chk duca'+(ducaChecked?' on':'')+'"><input type="checkbox" data-duca-id="'+esc(id)+'"'+(ducaChecked?' checked':'')+'> Duca已回</label>'
        + '<label class="chk skip'+(skipChecked?' on':'')+'"><input type="checkbox" data-skip-id="'+esc(id)+'"'+(skipChecked?' checked':'')+'> 不適合回應</label>'
      : '';
    return '<article class="card '+esc(cls)+'">'
      + '<div class="chead"><div class="who">'+(it.n?'<span class="num">'+esc(it.n)+'</span>':'')+esc(it.who)+'</div>'+statusPill(it)+'</div>'
      + (it.topic? '<div class="topic">'+esc(it.topic)+'</div>':'')
      + '<div class="meta">'+esc(it.time||'')+(it.stats? ' · '+esc(it.stats):'')+'</div>'
      + (tags.length? '<div class="tags">'+tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>':'')
      + (it.note? '<details class="note"><summary>重點與注意事項</summary><p>'+esc(it.note)+'</p></details>':'')
      + (it.reply? '<div class="reply">'+esc(it.reply)+'</div>':'')
      + '<div class="acts">'
      + toggles
      + (it.reply? '<button class="btn primary" data-copy="1">複製回覆</button>':'')
      + (it.url? '<a class="btn" href="'+esc(it.url)+'" target="_blank" rel="noopener">打開貼文</a>':'')
      + '</div></article>';
  }

  function render(){
    loadMarks();
    updateSub();
    refreshRunChipLabels();
    pickEl.textContent = (runsEl.hidden? '▾ ' : '▴ ') + (state.run? label(state.run)+' 場' : '全部場次');
    Array.prototype.forEach.call(runsEl.children, function(b, i){
      if(i===0){ b.setAttribute('aria-pressed', String(!state.run)); return; }
      b.setAttribute('aria-pressed', String(DATA[i-1].file===state.run));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-f]'), function(b){
      b.setAttribute('aria-pressed', String(b.dataset.f===state.filter));
    });

    var out = '';
    var runs = (state.q || !state.run) ? DATA : DATA.filter(function(r){ return r.file===state.run; });
    var shown = 0;
    runs.forEach(function(r){
      var items = r.items.filter(function(it){
        if(state.filter!=='all' && effStatus(it)!==state.filter) return false;
        if(state.q){
          var hay = (it.who+' '+it.topic+' '+it.reply+' '+it.note+' '+it.tags).toLowerCase();
          if(hay.indexOf(state.q.toLowerCase())<0) return false;
        }
        return true;
      });
      if(!items.length) return;
      shown += items.length;
      out += '<section><div class="runhead"><h2>'+esc(label(r.file))+' 場</h2>'
           + (r.keywords && r.keywords.length? '<span class="kw">'+esc(r.keywords.slice(0,6).join('、'))+'</span>':'')
           + '</div>' + items.map(card).join('') + '</section>';
    });
    var list = document.getElementById('list');
    list.innerHTML = out || '<p class="empty">這個條件下沒有貼文</p>';
    if(shown) list.insertAdjacentHTML('beforeend','<footer>清單同步自 Mac 的 Claude／脆海巡／清單資料夾</footer>');

    function saveMarks(){ try{ localStorage.setItem('haixun.marks', JSON.stringify(marks)); }catch(e){} }
    function saveDucaMarks(){ try{ localStorage.setItem('haixun.marks.duca', JSON.stringify(ducaMarks)); }catch(e){} }
    function saveSkipMarks(){ try{ localStorage.setItem('haixun.marks.skip', JSON.stringify(skipMarks)); }catch(e){} }

    Array.prototype.forEach.call(list.querySelectorAll('input[type="checkbox"][data-id]'), function(cb){
      cb.addEventListener('change', function(){
        marks[cb.dataset.id] = cb.checked;
        if(cb.checked){ skipMarks[cb.dataset.id] = false; saveSkipMarks(); }
        saveMarks();
        render();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('input[type="checkbox"][data-duca-id]'), function(cb){
      cb.addEventListener('change', function(){
        ducaMarks[cb.dataset.ducaId] = cb.checked;
        if(cb.checked){ skipMarks[cb.dataset.ducaId] = false; saveSkipMarks(); }
        saveDucaMarks();
        render();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('input[type="checkbox"][data-skip-id]'), function(cb){
      cb.addEventListener('change', function(){
        skipMarks[cb.dataset.skipId] = cb.checked;
        if(cb.checked){
          marks[cb.dataset.skipId] = false; ducaMarks[cb.dataset.skipId] = false;
          saveMarks(); saveDucaMarks();
        }
        saveSkipMarks();
        render();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-copy]'), function(btn){
      btn.addEventListener('click', function(){
        var txt = btn.closest('.card').querySelector('.reply').textContent;
        var ok = function(){ btn.textContent='已複製 ✓'; setTimeout(function(){ btn.textContent='複製回覆'; },1600); };
        try{
          navigator.clipboard.writeText(txt).then(ok, function(){ selectText(btn); });
        }catch(e){ selectText(btn); }
      });
    });
    function selectText(btn){
      var el = btn.closest('.card').querySelector('.reply');
      var range = document.createRange(); range.selectNodeContents(el);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent='請手動複製';
      setTimeout(function(){ btn.textContent='複製回覆'; },2200);
    }
  }
  render();
})();
</script>

</body>
</html>
