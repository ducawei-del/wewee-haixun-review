<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>脆海巡回覆台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
  :root{
    --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#EFF3EF; --ink:#1B2523; --muted:#5E6E69;
    --line:#E0E7E1; --accent:#1E7F6E; --accent-soft:#E3F1EC; --accent-ink:#125A4E;
    --done:#2E8B57; --done-soft:#E2F2E7; --skip:#8B9691; --skip-soft:#EDEFEE;
    --me:#2E6FB5; --me-soft:#E4EEF8;
    --shadow:0 1px 2px rgba(27,37,35,.06), 0 8px 24px rgba(27,37,35,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0E1413; --surface:#18211F; --surface-2:#1F2A28; --ink:#E9EFEC; --muted:#97A8A3;
      --line:#263230; --accent:#5FD0BC; --accent-soft:#16302B; --accent-ink:#8FE3D3;
      --done:#6FD08C; --done-soft:#17301F; --skip:#7C8884; --skip-soft:#1E2726;
      --me:#6FA8E0; --me-soft:#17293A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1413; --surface:#18211F; --surface-2:#1F2A28; --ink:#E9EFEC; --muted:#97A8A3;
    --line:#263230; --accent:#5FD0BC; --accent-soft:#16302B; --accent-ink:#8FE3D3;
    --done:#6FD08C; --done-soft:#17301F; --skip:#7C8884; --skip-soft:#1E2726;
    --me:#6FA8E0; --me-soft:#17293A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 64px}
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:14px 10px}
  h1{
    font-family:"Noto Serif TC",serif; font-weight:700; font-size:20px; margin:0 0 2px;
    letter-spacing:.01em; text-wrap:balance;
  }
  .sub{color:var(--muted); font-size:12.5px; margin:0 0 12px; font-variant-numeric:tabular-nums}
  .sub b{color:var(--ink); font-weight:700}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .scroller{display:flex; gap:6px; overflow-x:auto; padding:6px 0 8px; scrollbar-width:thin}
  .runpick{font-size:13.5px; font-weight:500; color:var(--ink); padding:7px 14px}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    padding:5px 11px; border-radius:999px; font-size:12.5px; cursor:pointer; font-family:inherit;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
  :root[data-theme="dark"] .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E1413}
  input[type="search"]{
    flex:1 1 180px; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:8px 12px; font-size:14px; font-family:inherit;
  }
  input[type="search"]:focus{outline:2px solid var(--accent); outline-offset:1px}
  .runhead{
    margin:22px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .runhead h2{font-family:"Noto Serif TC",serif; font-size:17px; margin:0; font-weight:600}
  .runhead .kw{color:var(--muted); font-size:12px}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card.done{border-left:4px solid var(--done)}
  .card.duca-done{border-left:4px solid var(--me)}
  .card.done.duca-done{border-left-width:4px; border-left-color:var(--done); box-shadow:inset 4px 0 0 -1px var(--me), var(--shadow)}
  .card.skip{opacity:.62}
  .chead{display:flex; gap:8px; align-items:flex-start; justify-content:space-between}
  .who{font-weight:700; font-size:15px; color:var(--accent-ink); word-break:break-all}
  .num{color:var(--muted); font-weight:500; margin-right:6px; font-variant-numeric:tabular-nums}
  .pill{
    flex:0 0 auto; font-size:11.5px; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--muted); white-space:nowrap;
  }
  .pill.done{background:var(--done-soft); color:var(--done); font-weight:500}
  .pill.skip{background:var(--skip-soft); color:var(--skip)}
  .topic{margin:6px 0 8px; font-size:14.5px; line-height:1.6}
  .meta{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; margin-bottom:8px}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
  .tag{font-size:11.5px; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--muted)}
  details.note{margin-bottom:10px}
  details.note summary{cursor:pointer; color:var(--muted); font-size:12.5px; list-style:none}
  details.note summary::-webkit-details-marker{display:none}
  details.note summary::before{content:"▸ "; color:var(--accent)}
  details.note[open] summary::before{content:"▾ "}
  details.note p{margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.7}
  .reply{
    background:var(--accent-soft); border-radius:10px; padding:12px 14px; font-size:14px;
    line-height:1.85; white-space:pre-wrap; word-break:break-word;
  }
  .acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:9px; padding:7px 13px; font-size:13px; font-family:inherit; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{color:#0E1413}
  .btn:hover{border-color:var(--accent)}
  .chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);
    border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:6px 11px; cursor:pointer}
  .chk input{accent-color:var(--done); width:15px; height:15px}
  .chk:has(input:checked), .chk.on{color:var(--done); border-color:var(--done); background:var(--done-soft); font-weight:700}
  .chk.duca input{accent-color:var(--me)}
  .chk.duca:has(input:checked), .chk.duca.on{color:var(--me); border-color:var(--me); background:var(--me-soft); font-weight:700}
  .chk.skip input{accent-color:var(--skip)}
  .chk.skip:has(input:checked), .chk.skip.on{color:var(--skip); border-color:var(--skip); background:var(--skip-soft); font-weight:700}
  .empty{color:var(--muted); text-align:center; padding:48px 0; font-size:14px}
  footer{color:var(--muted); font-size:12px; text-align:center; padding-top:18px; border-top:1px solid var(--line); margin-top:26px}
</style>
</head>

<script>window.HAIXUN=[{"file": "2026-10-30_1004", "title": "WeWee 脆海巡清單｜2026-10-30（五）早上 10 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@laurachi7890", "topic": "帶 10 個月寶寶去日本玩，寶寶睡覺要怎麼安排", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@laurachi7890/post/DfA4LptEgVC", "note": "", "reply": "第一次帶寶寶飛，光是「睡哪裡」就能想一整晚 🥹(´;ω;｀)\n和室跟嬰兒床兩種都有媽咪實際住過，可以照你們平常的睡法去選～\n\n再補一個很多人回國才想到的：\n11 月的日本室內暖氣很強、濕度低\n寶寶的臉和小腿會乾得比在台灣快\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油（無防腐劑，乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷）\n再疊一層寶貝潤潤乳鎖水，比單擦一層更持久一點 ✨\n\n行李再塞一瓶 60ml 的植萃抗菌噴霧\n飛機椅背、餐桌、飯店房間的桌面噴一噴擦過\n柿子＋葡萄柚籽萃取，無色無味無酒精，60ml 能上飛機 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@_love_1227_", "topic": "能不能推薦適合一歲＆兩歲半寶寶出遊的行程跟住宿（兩天一夜或三天兩夜）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_love_1227_/post/DfEcTmvE1bs", "note": "", "reply": "一歲跟兩歲半一起出門，行程越鬆越好玩 😂٩(๑❛ᴗ❛๑)۶\n樓上媽咪說的「一天排 1～2 個景點、住宿挑有遊戲區的」真的很實用\n小編再補一個方向：挑有半室內或大樹遮陰的點，熱了累了隨時能躲，一整天的續航力會差很多 ✨\n\n還有一個很容易忘記的：防曬！\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦，6 個月以上就能用，海洋友善、不泛白不黏，溫和不熏眼睛\n小孩不給擦臉就換防曬氣墊，自己輕拍兩下就搞定 (⁎˃ᴗ˂⁎)\n它跟寶貝潤潤乳一樣通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級\n玩完洗好澡趁微濕擦一層潤潤乳，可以鎖住水分 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@boomshagalagga", "topic": "求推薦不悶好洗掉的屁屁膏（選手一施巴、選手二葵森）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@boomshagalagga/post/De9ZqDcEysl", "note": "", "reply": "「不悶」又「好洗掉」這兩個條件一起要，挑起來真的很花時間 ( ˘ᵕ˘ )\n質地上通常越像油膏的越好擦掉、越像厚泥的越難，可以往這個方向試\n\n順便說一個搭配的小撇步：\n包了一整夜或悶久的地方，換下來先讓它晾個十幾秒再包新的\n晾乾之後薄薄抹一層 WeWee 寶貝潤潤乳，可以形成肌膚保護膜 ✨\n吸收很快、不黏不悶，半夜單手抱著也擦得完 (｡•ᴗ-)✧👶🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@cc._.0408", "topic": "有寶寶的大家可以分享，平常都怎麼保養皮膚的嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cc._.0408/post/De7Uv9jEyFN", "note": "", "reply": "當媽之後保養時間被壓縮到只剩洗完臉那幾分鐘，小編超有感 🥲(´;ω;｀)\n所以比買幾罐更關鍵的是時機——洗完不要等全乾，趁臉還微濕就把保濕那層補上去，推開很順、用量也省 ✨\n\n多說一句：成分表的長度比形容詞實在，短到看得懂才知道自己對什麼有反應\nWeWee 寶貝潤潤乳就是積雪草、靈芝多醣體、神經醯胺、甘草酸這幾樣，大人小孩一罐共用\n經典香和無香兩款都通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級，兩款都可以放心選\n可以提升肌膚舒適度喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@peiyun0111", "topic": "6 歲兒童有異膚，適合用哪一種沐浴乳", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@peiyun0111/post/DfEqINBmfaa", "note": "", "reply": "六歲這個年紀活動量大，流汗又吹到風，洗澡那一段真的要挑 ( ˘ᵕ˘ )\n洗的時候水溫調溫涼、時間十分鐘以內，泡泡停在皮膚上不要太久，洗完的感受就會差很多 🤍\n\n我們家的全身洗香香是洗澡洗頭洗臉一瓶搞定，泡泡很細緻、好沖，洗完不乾澀\n最關鍵的是關水之後那三分鐘，趁皮膚還微濕就擦一層寶貝潤潤乳\n成分表很短：積雪草、靈芝多醣體、神經醯胺、甘草酸，可以減緩因乾燥引起的皮膚癢 (๑•̀ㅂ•́)و✧\n有在看診、有療程的話，還是以醫師的安排為主喔 ♡", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@chenchen_3310", "topic": "快推薦我中部民宿，附近有景點可以走走逛逛，想帶寶寶跟家人出去散散心", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chenchen_3310/post/De_niJAkhYD", "note": "", "reply": "中部這一圈光是鹿港和日月潭就夠逛好幾天了，帶寶寶散心選得很好 ٩(๑❛ᴗ❛๑)۶✨\n民宿那塊照你們想要的風格和距離挑就好～\n\n補一個收行李的小撇步：\n很多民宿都有準備嬰幼兒洗沐用品，不過多半是通用款，寶寶比較敏感的話自己帶一小瓶會安心一點\nWeWee 旅行組剛好是無香乳液 60ml＋舒膚精華 30ml＋洗香香 60ml，洗澡保濕一次到位，不佔行李 (｡•ᴗ-)✧\n玩回來洗好澡趁微濕抹一層潤潤乳，可以呵護肌膚 🧸🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@wohenwuliao.55", "topic": "大家都是手洗小孩衣服到幾歲？冬天手真的好冷好裂", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wohenwuliao.55/post/DfGYufmk1aB", "note": "", "reply": "一歲三個多月＋明年二寶，光想到那個衣服量就覺得妳已經很努力了 🥹\n而且冬天手冷到乾裂還在洗，這一段真的很不容易 (´;ω;｀)\n\n自動投放的洗衣機要換瓶子確實麻煩，可以換個角度想：\n大面積交給洗衣機，只有奶漬、口水漬、炸屎那一小塊先手搓一下\n那一塊用美好實驗室的全酵貼身衣物手洗露，蛋白酵素就是分解這類污垢的，局部搓完再丟洗衣機，用量很省 (๑•̀ㅂ•́)و✧\n\n手已經裂開的話，洗完擦乾趁手還微濕抹一層 WeWee 輕潤護手乳，清爽不黏、可以形成肌膚保護膜，寶貝潤潤乳也一樣能擦 🤍✨", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@ziqing_.0214", "topic": "有沒有台灣製的面膜可以推薦（修護或亮白有感），想試試台灣國產的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ziqing_.0214/post/DfCqGOwEnus", "note": "", "reply": "想支持台灣製這件事小編看了很開心 🥹🫶\n面膜那塊可以從精華液的成分表和膜布材質下手，成分表短到看得懂的通常比香味重的實在，這個方向挑比較不會踩雷 ✨\n\n既然是在找台灣國產的，那就大方自我介紹一下：\n我們是辰曜生技，旗下有做敏感肌保養的 WeWee 和做無毒居家清潔的美好實驗室，都是台灣自己研發的\n寶貝潤潤乳當初台灣團隊研發了一年多、前後調整 30 幾次，請敏感肌寶寶實際用過才量產，現在已經是 3.0 版\n經典香和無香兩款都通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級 (๑˃̵ ᴗ ˂̵)\n敷完面膜之後拿它收尾也很順，大人小孩一罐共用，可以修護、潤澤肌膚 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@__jhihhhh.h_", "topic": "有媽咪推薦異膚寶寶使用的乳液嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@__jhihhhh.h_/post/De4RA11gQW-", "note": "", "reply": "異膚寶寶的乳液換來換去，那個反覆的過程最磨人 🥹\n\n除了擦什麼，居家這幾個習慣其實也很有感：\n貼身衣物挑透氣寬鬆的純棉，室內維持涼爽通風（開冷氣其實是好選擇，比悶熱流汗好）\n洗澡水不要太熱、時間十分鐘以內\n睡前把指甲剪短磨圓，抓出來的傷口比原本的乾癢更麻煩 ( ˘ᵕ˘ )\n\n乳液的話 WeWee 寶貝潤潤乳的成分表很短：積雪草、靈芝多醣體、神經醯胺、甘草酸，可以減緩因乾燥引起的皮膚癢\n我們陪伴過很多異膚寶寶家庭度過反覆乾癢的日常，很多媽咪都走過同一段路 ♡(｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@celinachen2", "topic": "帶四歲小孩搭遊覽車出門，都帶哪些零食和玩具", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@celinachen2/post/DfGPiDWn48p", "note": "", "reply": "早安！遊覽車最怕的就是「東西掉到地板」那一秒 😂(⁎˃ᴗ˂⁎)\n樓上媽咪推的磁吸拼圖和貼紙簿真的最耐玩，零食挑單包裝、不會碎屑滿地的也很關鍵 👏\n\n再說一個：外出包塞一瓶 60ml 的植萃抗菌噴霧\n椅背小桌、扶手、玩具掉地上撿起來都能噴一噴擦過\n柿子＋葡萄柚籽萃取，無色無味無酒精 ✨\n吃完擦完手，順手補一層 WeWee 寶貝潤潤乳，可以防護肌膚，吸收很快不黏不悶 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-29_2127", "title": "WeWee 脆海巡清單｜2026-10-29（四）晚上 9 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@zyx__0520", "topic": "托嬰中心老師的手到底是什麼做的，女兒下課都會被新造型驚豔到（今天是兩根閃電）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zyx__0520/post/DfE3B5ykg72", "note": "", "reply": "兩根閃電⚡️也太強了啦\n老師是不是私底下有練過 😂\n\n而且能綁成這樣寶寶也超配合\n看起來是個很有個性又很給面子的小女孩 (⁎˃ᴗ˂⁎)\n下課看到新造型的那一秒應該最療癒 ٩(๑❛ᴗ❛๑)۶🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@sunvi_a_sunvi", "topic": "高雄的爸媽們，要不要來創一個「高雄親子放電群」？有興趣留言 +1", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@sunvi_a_sunvi/post/DfB7UADHzVE", "note": "", "reply": "露營＋戰鬥陀螺＋跑公園這個組合\n光聽就知道你們家小孩電量很滿 😂٩(๑❛ᴗ❛๑)۶\n這個群真的會很需要！\n\n揪團之後補一個很容易漏掉的：\n野餐、公園、露營這種一整天在外面的行程，防曬一定要帶\nWeWee 極潤植萃防曬乳是純物理性二氧化鈦、6 個月以上就能用\n不泛白不黏、溫和不熏眼睛，也是海洋友善配方\n而且跟乳液一樣通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級 ✨\n小孩不給擦臉就換防曬氣墊，自己輕拍兩下就好 (๑•̀ㅂ•́)و✧\n\n玩完回家洗好澡，趁皮膚還微濕擦一層寶貝潤潤乳\n可以鎖住水分 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@lesliegreen17392", "topic": "老公超前部署比孕婦還認真，待產包清單自己列好開始採買（但奶粉買錯號數）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lesliegreen17392/post/DfEHFD_H4kn", "note": "", "reply": "一號直接買成三號 😂\n這個超前部署的方向沒錯，只是跑得有點遠 🤣\n但老公主動列清單、一個個打勾這件事真的很加分 👏\n\n補一個清單上最容易漏的：\n醫院和月子中心備的乾洗手大多是酒精成分\n住院加坐月子洗手的次數會暴增，手很容易乾、甚至脫皮\n可以塞一瓶美好實驗室的植萃抗菌噴霧（柿子＋葡萄柚籽萃取、無色無味無酒精）\n病房桌面、奶瓶放的地方噴一噴擦過就好 (๑•̀ㅂ•́)و✧\n\n旁邊再放一瓶 60ml 的 WeWee 寶貝潤潤乳\n妳的手跟寶寶都能一起擦，可以呵護肌膚 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@__cimf359_", "topic": "再一個月就要生了，越接近預產期心裡越慌（順便問奶粉和尿布要怎麼買）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@__cimf359_/post/DfB4ImsE47s", "note": "", "reply": "一個月前會慌是很正常的\n妳已經開始問、開始準備，就是走在前面了 🥹🤍\n尿布先單包買這個方向，樓上媽咪們講得真的最省\n\n多說一句很少人提的：\n住院那幾天加月中，洗手的次數會比想像中多很多\n醫院備的乾洗手大多是酒精，手很快就會乾\n可以帶一瓶植萃抗菌噴霧（無色無味無酒精），桌面、奶瓶放的地方噴一噴擦過 ( ˘ᵕ˘ )\n\n隨身包再丟一瓶 60ml 的 WeWee 寶貝潤潤乳\n妳的手跟寶寶出生後都能一起擦，可以保持肌膚健康 ♡", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@chou.phoebe", "topic": "帶小孩出門都會提前準備好，但想到韓國十一月天氣不知道如何，就沒辦法先打包行李", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chou.phoebe/post/DezZF7zkk86", "note": "", "reply": "十一月的韓國是又冷又乾\n先把「保暖」和「乾」這兩件事打包起來就對了 ✨( ˘ᵕ˘ )\n衣服走薄長袖＋一件擋風外套，室內暖氣都開很強，一件一件脫比較好調\n\n再說一個：暖氣房濕度很低\n小孩的臉和小腿會乾得比在台灣快很多\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油\n（無防腐劑，乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷）\n再疊一層寶貝潤潤乳鎖水，比單擦一罐久一些，可以舒緩肌膚乾燥 (๑˃̵ ᴗ ˂̵)\n\n不想佔行李的話 WeWee 旅行組剛好\n（無香乳液 60ml、舒膚精華 30ml、洗香香 60ml）\n另外塞一瓶 60ml 的植萃抗菌噴霧，飛機椅背、餐桌、飯店房間噴一噴擦過，能上飛機 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@wanghuensh", "topic": "換工作後作息整個亂掉，皮膚也變差，以前用習慣的保養品擦上去會刺刺癢癢的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wanghuensh/post/De_fUVBESPK", "note": "", "reply": "作息一亂，皮膚真的是第一個跳出來抗議的 🥲\n原本那幾罐先暫停、保養簡化成清潔＋保濕，這個方向很對 ( ˘ᵕ˘ )\n\n再補一個挑的方法：\n成分表的長度比形容詞實在，短到看得懂才知道是哪一支不合\nWeWee 寶貝潤潤乳的成分表很短（積雪草、靈芝多醣體、神經醯胺、甘草酸）\n經典香和無香兩款都通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級\n兩款都可以放心選，大人小孩也能共用一罐 (๑•̀ㅂ•́)و✧\n\n擦的時機其實差很多\n洗完臉不要等全乾，趁還微濕就把保濕那層補上去\n推開很順、用量也省，可以提升肌膚舒適度 ✨🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@ci7nd2y", "topic": "36 週，待產包進度 0％", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ci7nd2y/post/De70EKRE-bz", "note": "", "reply": "36 週還 0% 真的超多人都這樣\n看完這串應該安心不少 😂( ˘ᵕ˘ )\n一個好上手的切法：先把「醫院住院那幾天會用的」和「月中之後才用的」分成兩袋\n不用一次想完，分兩次收就沒那麼可怕了\n\n補一個清單上常漏的：\n住院加月中，洗手、擦東西、洗奶瓶的次數都很可觀\n帶一瓶美好實驗室的植萃抗菌噴霧（柿子＋葡萄柚籽萃取、無色無味無酒精）會很順手 (๑•̀ㅂ•́)و✧\n\n保養品整罐帶的時候，順手丟一瓶 60ml 的 WeWee 寶貝潤潤乳\n妳的手跟寶寶都能擦，可以形成肌膚保護膜 🫶🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@innn.24s", "topic": "不是高雄人但想帶小孩出門遛遛，有高雄人推薦可以帶小孩去哪嗎（大寶 2y4m、小寶 8m）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@innn.24s/post/Denrxd4Egn3", "note": "", "reply": "不是本地人要挑景點真的最難 🥹\n樓上推的壽山動物園、凹子底、親子館這幾個方向都很實在\n八個月和兩歲四個月一起出門，半室內又有遮陽的地方最好用，熱了累了可以隨時躲 (๑˃̵ ᴗ ˂̵)\n\n再說一個小撇步：\n這個月齡什麼都會摸、摸完就往嘴巴送\n外出包塞一瓶 60ml 的植萃抗菌噴霧（柿子＋葡萄柚籽萃取、無色無味無酒精）\n遊戲區扶手、餐桌、玩具掉地上撿起來都能噴一噴擦過 ʕ•ᴥ•ʔ\n\n玩完手腳乾乾、脖子皺摺悶到的時候，抹一層 WeWee 寶貝潤潤乳\n吸收很快不黏不悶，可以防護肌膚 ✨🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@__sharonlin__", "topic": "3m16d 寶寶長牙了，難怪一直流口水一直吃手手，除了勤清潔口腔還需要注意什麼嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@__sharonlin__/post/DfEz9B1j83d", "note": "", "reply": "三個多月就長牙，進度超前欸！\n難怪固齒器咬得特別勤 😂👶\n口腔清潔有顧到就已經很好了 ( ˘ᵕ˘ )\n\n補一個這段最容易被忽略的：\n長牙的時候口水量會突然變多，下巴和脖子皺摺可能會悶著口水\n用乾濕兩用洗臉巾沾乾淨飲用水，輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再薄薄抹一層 WeWee 寶貝潤潤乳 (๑•̀ㅂ•́)و✧\n\n吸收很快不黏不悶，單手抱著也擦得完\n可以使肌膚留住水分 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@yiting199728", "topic": "寶寶 1Y7M 想買新的日用品，但看賣家推薦買回來才發現不實用，玩具餐具外出用品都想參考", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yiting199728/post/DfFA_PNnwF6", "note": "", "reply": "「買回來才發現根本不實用」這句太真實了 😂\n1Y7M 這個年紀，挑可以重複用、好收、好洗的最不會後悔 (๑˃̵ ᴗ ˂̵)\n餐具可以挑整個拆得開的，接縫少才洗得乾淨；新的拆封先洗過再用\n美好實驗室的果菜奶瓶潔淨液（鳳梨酵素＋葡萄柚籽）噴 3～5 下沖掉就好\n餐具、奶瓶、蔬果雞蛋都能一起洗 ✨\n\n妳提到之前擦完有一片紅紅的，所以乳液這塊小編會先看檢測：\nWeWee 寶貝潤潤乳的經典香和無香兩款都通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級\n成分表也很短（積雪草、靈芝多醣體、神經醯胺、甘草酸），好判斷\n換新的時候先在手臂內側連擦兩三天再全身用，比較安心\n吸收快不黏不悶，可以強化肌膚的防禦力 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-29_1409", "title": "WeWee 脆海巡清單｜2026-10-29（四）下午 2 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@rrrrapunzel_", "topic": "求推薦 1 歲以下硬頁書或布書（已經列了 11 本，兩本快被撕爛）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@rrrrapunzel_/post/De7GSKJCYl9", "note": "", "reply": "把每本書的反應都記得這麼細，共讀一定很有畫面 👏٩(๑❛ᴗ❛๑)۶\n補一個挑的方向：\n布書看「能不能整本下水洗」，硬頁書看邊角有沒有包圓\n這兩個其實決定了它能撐多久 ✨\n\n再說一個～這個月齡的書幾乎都會進嘴巴\n美好實驗室的植萃抗菌噴霧是柿子＋葡萄柚籽萃取\n無色無味無酒精，書角、布書響紙那一面噴一噴擦過就好 (๑•̀ㅂ•́)و✧\n\n啃完口水流在下巴那圈，順手抹一層 WeWee 寶貝潤潤乳\n可以形成肌膚保護膜 ʕ•ᴥ•ʔ🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@chi_174396", "topic": "集思廣益～聖誕交換禮物 $500，有沒有人收到覺得很讚的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chi_174396/post/De4dGEQoxpG", "note": "", "reply": "交換禮物最怕抽到要另外找地方放的那種 😂(⁎˃ᴗ˂⁎)\n樓上「會用完的好東西」這個標準小編超同意 👏\n\n$500 這個價位，挑「拆開就能馬上用」的最安全 ✨\n我們家 WeWee 寶貝潤潤乳 150ml 剛好在這個範圍\n大人小孩都能擦，成分表很短：積雪草、靈芝多醣體、神經醯胺、甘草酸 (๑•̀ㅂ•́)و✧\n\n冬天剛好是最需要的時候，可以鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@elva_05.11", "topic": "寶寶四個月了，即將開啟副食品之路，有推薦的食譜&餐具嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@elva_05.11/post/De-tWrrE9L4", "note": "", "reply": "四個月就開始做功課，寶寶也太幸福 🤩( ˘ᵕ˘ )\n十倍粥跟分裝盒樓上媽咪們都列得很完整了\n\n補一個開始之前的小步驟：\n新餐具、冰磚盒拆封先洗過再用 ✨\n蔬果那一關可以用美好實驗室的果菜奶瓶潔淨液\n鳳梨酵素＋葡萄柚籽，噴 3～5 下沖掉，奶瓶、雞蛋也能一起洗 (๑•̀ㅂ•́)و✧\n\n開始吃之後嘴邊跟小手會比以前黏得多\n擦乾淨之後補一層 WeWee 寶貝潤潤乳，可以舒緩肌膚乾燥 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@mia.novell23", "topic": "颱風天好冷，請問大家都去哪邊買小孩的衣服呢？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mia.novell23/post/De2ExxgAawM", "note": "", "reply": "颱風天一降溫，才發現小孩的長袖根本不夠 😂(⁎˃ᴗ˂⁎)\n樓上媽咪們推的店家看起來都很好逛\n小編補一個挑的方向：\n這個季節薄長袖比厚外套實用，室內室外溫差大也好一件一件脫 ✨\n\n再說一個～新衣服拆封先洗過再穿\n局部的奶漬、口水漬可以用美好實驗室的全酵貼身衣物手洗露搓一下再丟洗衣機\n蛋白酵素分解那類污垢、用量很省 (๑•̀ㅂ•́)و✧\n\n換季這段皮膚容易乾，睡前補一層 WeWee 寶貝潤潤乳\n可以使肌膚留住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@snowball_momo_sprite", "topic": "外出都是怎麼幫寶貝用副食品的？過年要帶寶貝出去（矯齡 8m）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@snowball_momo_sprite/post/DfCdP5zkw_y", "note": "", "reply": "過年出門那幾天的副食品真的是一門學問 (⁎˃ᴗ˂⁎)\n常溫粥＋矽膠袋＋熱水這一套，樓上媽咪們講得很清楚了 👏\n\n補一個比較少被提到的：吃完的湯匙跟碗\n外面常常沒地方好好洗，小編會帶一瓶 60ml 的餐具清潔露 ✨\n環境分解度 97% 以上、用的是食品級防腐劑，沖得很乾淨 (๑•̀ㅂ•́)و✧\n\n另外行李丟一罐 60ml 的 WeWee 寶貝潤潤乳\n吃得滿臉的時候擦完補一層，妳的手也能一起擦\n可以提升肌膚舒適度 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@arielshen2020", "topic": "異膚寶寶不能穿洞洞裝，但 Uniqlo 的洞洞裝也是 100% 棉，不能的原因是什麼？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@arielshen2020/post/De9DSp9Gb_z", "note": "", "reply": "妳會去翻成分、還去研究洞洞是怎麼打的，真的很用心 ( ˘ᵕ˘ )♡\n樓上媽咪們說的「洞是從外往內打，所以內層比較粗」講得很清楚了\n\n補一個角度：同樣的摩擦，皮膚水分夠的時候感受會差很多\n所以貼身衣物挑寬鬆的純棉、室內保持涼爽通風\n洗澡水不要太熱、時間抓在十分鐘以內，睡前把指甲剪短磨圓 ✨\n\n洗完澡趁皮膚還微濕就擦一層 WeWee 寶貝潤潤乳\n可以減緩因乾燥引起的皮膚癢 (๑•̀ㅂ•́)و✧\nWeWee 陪伴過很多異膚寶寶家庭度過反覆乾癢的日常 🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@hannahs.studio_", "topic": "秋冬要到了ㄟ，有什麼保濕推薦的嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hannahs.studio_/post/De38NbEoACp", "note": "", "reply": "秋冬一到，原本那罐就突然不夠力了 🥲( ˘ᵕ˘ )\n分享一個比換一整套更快的做法：\n\n洗完澡趁皮膚還微濕，先點一點油再疊乳液鎖住\n會比單擦一層撐得久很多 ✨\nWeWee 舒膚精華油沒有加防腐劑\n乳木果油、荷荷芭油、甜杏仁油加角鯊烷，吸收很快不悶不黏 (｡•ᴗ-)✧\n\n疊在上面那層用寶貝潤潤乳就可以，大人小孩共用一罐\n可以維持肌膚彈性 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@swi_927", "topic": "寶寶 7 個月多突然不愛吃副食品，牙包長一個多月還沒冒牙，這幾晚一直哭", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@swi_927/post/DfEAhZwiYKE", "note": "", "reply": "連續幾天哭、又突然不想吃，媽媽當然會慌 🥹(´;ω;｀)\n妳在這一串裡每一則都認真回，看得出來有多在意他 ( ˘ᵕ˘ )\n\n長牙這段還有一件事很容易被忽略：口水量會突然變多\n下巴和脖子皺摺悶著口水，很快就會紅紅乾乾的\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦 🤍\n\n壓乾之後再薄薄抹一層 WeWee 寶貝潤潤乳\n可以呵護肌膚，吸收很快不黏不悶，單手抱著也擦得完 ♡", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@yuiii1017", "topic": "3 歲需要換奶粉嗎？孩子是異膚寶寶，0-2 歲喝水解、2-3 歲喝羊奶", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yuiii1017/post/De5P2GVE1Wv", "note": "", "reply": "從水解一路顧到羊奶，這三年真的是一步一步陪過來的 👏( ˘ᵕ˘ )\n樓上媽咪們的經驗聽起來很一致，可以當參考\n如果真的要調整，一次只換一樣、慢慢換比例，比較看得出來合不合 ✨\n\n再補一個這個季節的方向：\n三歲開始活動量大，流完汗又吹到風，皮膚的乾燥感會比夏天明顯\n洗完澡趁皮膚還微濕就擦一層 WeWee 寶貝潤潤乳\n積雪草、靈芝多醣體、神經醯胺、甘草酸，成分表很短 (๑•̀ㅂ•́)و✧\n可以強化肌膚的防禦力 🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@mandy_kuokuo", "topic": "6 個多月超愛趴睡，過夜尿布連續好幾天早上正面漏出濕掉", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mandy_kuokuo/post/DfD1J4Ljy9U", "note": "", "reply": "後半部全乾、正面濕掉，這個反差太有畫面了 😂(⁎˃ᴗ˂⁎)\n樓上把尿布往前多拉一點、腿圍再順一次，這幾招聽起來很實用 👏\n\n補一個漏完之後的小事：\n悶了一整夜的地方，換下來先讓它晾個十幾秒再包新的\n會比馬上包起來舒服很多 ✨\n\n晾乾之後薄薄抹一層 WeWee 寶貝潤潤乳\n可以防護肌膚，吸收很快不黏不悶，半夜單手也擦得完 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-29_1235", "title": "WeWee 脆海巡清單｜2026-10-29（四）早上場 10 篇（＋加碼 1 篇、感謝粉絲 1 則）", "keywords": [], "items": [{"n": "1", "who": "@ll323127", "topic": "有沒有人推薦「台灣」的小物、商品、紀念品？台灣製！不是台灣出貨而已！", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ll323127/post/Dest8zbmV0s", "note": "", "reply": "這串整個變成台灣品牌大集合 看得好過癮 👏٩(๑❛ᴗ❛๑)۶\n送人的話小編補一個方向：\n「對方每天都會用到、但不會自己買來送自己」的那種最容易被記住 ✨\n\n那就自我推薦一下～我們是辰曜生技，台灣自己研發的 WeWee\n寶貝潤潤乳當初台灣團隊研發一年多、前後調整 30 幾次\n請敏感肌寶寶實際用過、確定好用才量產，現在已經做到 3.0 版 (๑•̀ㅂ•́)و✧\n也通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級\n\n大人小孩都能擦，可以形成肌膚保護膜\n在台灣做公益這件事也一直沒停過 🤍( ˘ᵕ˘ )", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@mi.qi.1028", "topic": "想幫家裡的浴巾全部換掉，有推薦的浴巾品牌嗎？不掉屑、吸水強、顏值高", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mi.qi.1028/post/DeyxhHLGXPB", "note": "", "reply": "浴巾全換掉這種事做一次爽很久 😂 (๑˃̵ ᴗ ˂̵)\n補一個挑的方向：\n「不掉屑」比較看織法，無撚紗或純棉長纖的屑屑通常少很多\n新的拆封先單獨洗一次再用，第一輪棉絮會差很多 ✨\n\n再說一個～擦乾之後那三分鐘其實最關鍵 🫶\n不要等全乾，趁皮膚還微濕就把乳液抹上去\n推開很順、用量也省 (｡•ᴗ-)✧\n我們家 WeWee 寶貝潤潤乳吸收很快、不黏不悶，可以鎖住水分 🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@fymaskiola", "topic": "有沒有推薦小孩衣服的店家或品牌？材質要像 Konny 那樣、儘量不要陸製、1000 元內", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@fymaskiola/post/De9vZebE1Ig", "note": "", "reply": "Konny 那個觸感摸過一次就回不去了 真的懂 ( ˘ᵕ˘ )♡\n補一個挑的方向：\n翻洗標看是不是「精梳棉」或有機棉，同  {"n": "3", "who": "@8.8.7.1.2", "topic": "家裡有異膚的小孩，求推薦乳液，說看到小孩快要抓爛掉好擔憂", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@8.8.7.1.2/post/De9bVVYk-tp", "note": "", "reply": "看到小孩抓，那種心疼真的很難形容 🥹\n妳外敷內服兩邊都在顧了，很不容易\n\n分享幾個居家可以一起做的：\n貼身衣物選寬鬆的純棉，避免粗纖維摩擦\n室內保持涼爽通風，開冷氣其實比悶熱流汗好\n洗澡水不要太熱、時間控制在十分鐘內\n睡前把指甲剪短，抓出來的傷口比原本的乾癢更難處理\n\n洗完澡趁皮膚還微濕\n先點一點 WeWee 舒膚精華油，再疊一層寶貝潤潤乳鎖水\n比單擦一罐撐得久一些 🤍\n這兩支陪伴過很多異膚寶寶家庭度過反覆乾癢的日常\n可以減緩因乾燥引起的皮膚癢\n療程還是照醫師走，顧好習慣可以讓發作頻率減少很多 ( ˘ᵕ˘ )", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@woan_ru", "topic": "距離預產期還有一週，忘記做寶寶用品的功課，問一定要買、不買會後悔的神物", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@woan_ru/post/DezGOvwFNZZ", "note": "", "reply": "距離一週還有時間做功課，完全來得及 (๑•̀ㅂ•́)و✧\n尿布和濕紙巾分享兩個判斷方式：\n尿布看腿圍貼不貼、會不會漏，比看牌子準\n濕紙巾看厚度和會不會連抽，一次先一包就好\n\n另外補一個很多人會漏掉的：\n醫院和月子中心備的乾洗手大多是酒精\n住院加坐月子洗手消毒次數會暴增，手很容易乾、甚至脫皮\n待產包裡放一瓶 60ml 的植萃抗菌噴霧\n柿子＋葡萄柚籽萃取、無色無味無酒精\n病房桌面、奶瓶放的地方都能噴一噴擦過 ( ˘ᵕ˘ )\n\n再塞一罐 60ml 的寶貝潤潤乳\n妳的手和寶寶都能擦，可以維持水分 ✨🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@yayuan_1227", "topic": "問孕婦可以吃的益生菌有沒有推薦", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yayuan_1227/post/De3NYaPIJXW", "note": "", "reply": "孕期吃進去的東西特別想確認清楚，完全可以理解 ( ˘ᵕ˘ )\n\n挑的時候可以先看兩件事：\n外盒有沒有明確寫孕哺期可以補充\n還有菌數、保存方式標得清不清楚\n往這兩個方向篩會快很多 ✨\n\n順便說一個外用的～\n肚子開始撐大之後會有點乾、有點緊\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n比全乾才抹好推開，用量也省\n可以維持肌膚彈性，寶寶出生後也能一起用 (๑˃̵ ᴗ ˂̵)🍼🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@fxy1108", "topic": "問有沒有推薦的乳液和妝前保濕", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@fxy1108/post/De8ircTkpZf", "note": "", "reply": "妝前這一步做對，底妝會差超多 ✨\n\n分享兩個小撇步：\n保濕那層薄薄一層就好，厚擦反而容易浮\n擦完等個兩三分鐘再上妝，讓它真的吸收進去 (｡•ᴗ-)✧\n\n多說一句～\nWeWee 寶貝潤潤乳吸收快、不黏不悶\n當保濕那一步薄擦很好推開\n積雪草、靈芝多醣體、神經醯胺、甘草酸，成分表很短\n大人小孩都能擦，可以提升肌膚舒適度 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@ting921102", "topic": "40+ 想找適合混合敏感油肌的保養", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ting921102/post/De8DyEaE07B", "note": "", "reply": "混合敏感油肌最怕悶\n擦完黏住一整天真的很難受 😮‍💨\n\n挑的時候可以把順序換一下：\n先看質地會不會悶、好不好吸收\n再看成分表長不長，越短越好判斷\n這樣比一次換一整套安心很多 (｡•ᴗ-)✧\n\nWeWee 寶貝潤潤乳是台灣研發的\n針對這邊濕熱的海島型氣候調過\n清爽好吸收、不黏不悶\n保濕那一步用它很舒服\n可以調理肌膚油水平衡 ( ˘ᵕ˘ )✨🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@kelinfish", "topic": "請問有推薦的身體乳液嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kelinfish/post/Dey9V64H-9I", "note": "", "reply": "身體乳液每一罐看起來都差不多\n真的很難選 (´;ω;｀)\n\n小編自己會先翻成分表\n表越短越好判斷，再看有沒有實際做過檢測\n這兩個條件過了，味道和質地再憑喜好挑就好 ✨\n\nWeWee 寶貝潤潤乳是台灣研發的\n積雪草、靈芝多醣體、神經醯胺、甘草酸\n經典香和無香款都通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級\n兩款都可以放心選\n洗完澡趁微濕薄擦一層，吸收快不黏\n可以舒緩肌膚乾燥 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@qoo07212000", "topic": "求推薦可以加在身體乳液裡一起抹的保濕油", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qoo07212000/post/De2RJCQkxSv", "note": "", "reply": "油加在乳液裡抹，真的比單擦省力很多 (๑˃̵ ᴗ ˂̵)\n\n一個小撇步：\n洗完澡趁皮膚還微濕的時候混著抹\n比全乾才抹好推開，吸收也快\n\nWeWee 舒膚精華油可以這樣用～\n無防腐劑配方，乳木果油、荷荷芭油、甜杏仁油、葡萄籽油、角鯊烷\n吸收很快、不悶不黏\n覺得單擦乳液撐不久的時候\n先抹一層油再疊一層寶貝潤潤乳\n可以鎖住水分、提升肌膚舒適度 ✨( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@nely_12370", "topic": "想換寶寶乳液但不想踩雷，自己開了四個牌子的票選", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@nely_12370/post/De6-8xCI7dl", "note": "", "reply": "看到有人幫我們把精華油講出來，真的很暖 🥹\n謝謝妳 @we261204 ～\n混在乳液裡一起抹這個用法妳也抓得很準 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-26_1228", "title": "WeWee 脆海巡清單｜2026-10-26（一）早上 10 點場（延遲觸發，12:07 開跑）10 篇＋感謝粉絲 1 筆", "keywords": [], "items": [{"n": "1", "who": "@mindiworldnews（敏迪選讀）", "topic": "12 月要去東京一趟，問去日本有什麼必買的母嬰用品", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mindiworldnews/post/De66DIMk6-4", "note": "", "reply": "女鵝第一張照片太可愛了 ٩(๑❛ᴗ❛๑)۶👶\n樓上推的推車和繪本都很值得扛，\n小編補一個「不用扛、當地買更方便」的方向 ✨\n\n日本的超市和藥妝店就買得到寶寶專用純水，\n水質比台灣軟，小孩通常比較願意喝，泡奶也方便，\n不用從台灣帶水出門 🍼\n\n行李再說一句：\nWeWee 旅行組（乳液、舒膚精華、洗香香）和美好實驗室旅行組\n（餐具清潔露、貼身衣物手洗露、除臭噴霧、果菜奶瓶潔淨液）都是小容量，\n塞進行李幾乎不佔位置 (๑•̀ㅂ•́)و✧\n再放一瓶植萃抗菌噴霧，飛機椅背、機艙扶手、轉機候機室噴一噴擦過，\n無色無味無酒精、60ml 能上飛機 🤍\n\n12 月東京室內整天開暖氣，小臉會乾得特別快，\n一天多補一層寶貝潤潤乳，可以提升肌膚舒適度 ( ˘ᵕ˘ )", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@se221.06", "topic": "想知道大家懷孕期間買的「效果很讚的保健食品」有哪些", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@se221.06/post/DeyDEZrkw7x", "note": "", "reply": "「連吃的、用的都變得特別小心」這句超有感 ( ˘ᵕ˘ )🤍\n吃的部分這串已經整理得很完整了 ✨\n\n小編想補「用的」那一半：\n孕期的身體保濕越早開始越輕鬆，\n肚子長大的速度到後期會變很快，皮膚會覺得緊緊的 🥹\n\n洗完澡趁皮膚還微濕的時候就擦，比等到全乾才抹好推開很多、用量也省 (｡•ᴗ-)✧\nWeWee 寶貝潤潤乳大人小孩都能擦，吸收快、不黏不悶，可以維持肌膚彈性，\n寶寶出生後也能一起用，不用再另外買一罐 (๑˃̵ ᴗ ˂̵)", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@rong_er_1111", "topic": "本人是敏感肌不敢亂用保養品，不知道適合哪一款，需要能幫我詳細介紹的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@rong_er_1111/post/Deq0SFhkyDa", "note": "", "reply": "敏感肌想先問清楚再買，這份謹慎完全是對的 ( ˘ᵕ˘ )\n不過與其先挑牌子，小編會建議先用「成分表短不短」來篩 ✨\n\n成分越單純，萬一哪天不合，越容易回推是哪一支的問題 (｡•ᴗ-)✧\n\n想參考質地的話～WeWee 寶貝潤潤乳的成分表很短，\n積雪草、靈芝多醣體、神經醯胺、甘草酸，\n當年是台灣團隊研發一年多、請敏感肌寶寶實際體驗、前後調了 30 幾次才推出，\n現在已經做到第三代了喔～\n吸收快、不黏不悶，大人小孩都能擦，可以維持肌膚健康 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@hsinhua195", "topic": "28 週了還沒長任何紋路，在想要不要開始用油了，但聽說和體質比較有關", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hsinhua195/post/De3gtpjmHVi", "note": "", "reply": "28 週還沒有任何痕跡，這個狀況很好呢 ٩(๑❛ᴗ❛๑)۶\n串裡媽咪們講的體質那一塊，看起來大家的經驗都很一致 ✨\n\n不過保養這件事可以換個角度看：\n肚皮撐大的時候會乾、會緊，好幾位媽咪也說到後期很癢，\n抹油其實更多是讓自己這段時間舒服一點 ( ˘ᵕ˘ )\n\nWeWee 舒膚精華油是無防腐劑的配方，\n乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷，吸收很快、不悶不黏 🤍\n洗完澡趁皮膚還微濕先抹一層，再疊寶貝潤潤乳，\n可以減緩因乾燥引起的皮膚癢，也能調理肌膚紋路 (๑˃̵ ᴗ ˂̵)♡", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@me.me.me.441", "topic": "請問一歲寶寶有沒有推薦的沐浴乳，現在用的味道好聞但比較貴", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@me.me.me.441/post/De0w89nk99N", "note": "", "reply": "一歲正是洗澡最像在打仗的時候 😂\n挑的時候小編會先看「一瓶能洗到哪裡」(｡•ᴗ-)✧\n洗頭洗澡還要分兩瓶，一隻手抱著小孩真的換不了第二瓶 🍼\n\nWeWee 全身洗香香是洗澡洗頭洗臉一瓶搞定，\n泡泡很細緻、好沖，洗完不乾澀，有淡淡的香氣 ✨\n\n洗完趁皮膚還微濕擦上寶貝潤潤乳，吸收很快不黏不悶，\n可以使肌膚留住水分 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@n74137", "topic": "可以推薦國小生都用什麼牌子的沐浴乳嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@n74137/post/De4A1G6kiVg", "note": "", "reply": "國小生自己洗澡，可以把「好不好沖」放第一個 (๑•̀ㅂ•́)و✧\n泡泡沖不乾淨悶在皮膚上，洗完反而更不舒服 ✨\n\nWeWee 全身洗香香從頭到腳一瓶，小孩自己按壓就會用，\n泡泡細緻、沖得掉，洗完不乾澀 🫧\n\n再補一個最常被跳過的：\n自己洗的孩子通常洗完就跑走了 😂\n睡前幫他補一層寶貝潤潤乳，手肘和小腿前側順手帶過，\n可以舒緩肌膚乾燥 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@dnciksmjo3899", "topic": "寶貝要滿四個月了，想直接買市售的寶寶泥，有推薦的品牌嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dnciksmjo3899/post/DewhFvaExNh", "note": "", "reply": "四個月就開始做功課，進度抓得很好 👏٩(๑❛ᴗ❛๑)۶\n樓上媽咪說可以拿寶寶手冊去門市領試吃組，這個方法很實用 ✨\n小編再補一個方向：先從小包裝或試吃組開始、喜歡再訂整箱，冷凍庫比較不會壓一堆 🍼\n\n另外兩件開始吃副食品之後才會發現的小事：\n嘴邊和脖子皺摺會一直濕濕的，\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦拭掉、不要來回摩擦，\n壓乾之後擦一層 WeWee 寶貝潤潤乳，可以形成肌膚保護膜 ( ˘ᵕ˘ )\n\n之後自己做泥的話，美好實驗室的果菜奶瓶潔淨液是鳳梨酵素＋葡萄柚籽，\n噴 3～5 下就好，洗蔬果和奶瓶都用得到 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@0706kaoyi__", "topic": "32 週、預產期 12 月中，待產包進度 0，在醫院生產怎麼準備最實際＋出院穿什麼", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@0706kaoyi__/post/De8TaKeGcea", "note": "", "reply": "32 週、預產期 12 月中，現在開始收完全來得及 ٩(๑❛ᴗ❛๑)۶\n出院衣物樓上講的寬鬆、方便哺乳那個方向就很實在 ✨\n\n小編想補一樣很容易漏掉的：\n樓上提到家裡要準備乾洗手，待產包裡也值得放一瓶 (｡•ᴗ-)✧\n醫院和月子中心備的乾洗手大多是酒精的，\n住院加坐月子期間洗手的次數會暴增，手很容易變乾、甚至脫皮 🥹\n美好實驗室的植萃抗菌噴霧是柿子＋葡萄柚籽萃取，無色無味無酒精，\n病房桌面、奶瓶放的地方也都能噴一噴擦過 🍼\n\n旁邊再留一格給 60ml 的 WeWee 寶貝潤潤乳，\n妳的手和寶寶都能擦，可以維持水分 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@annielimzhen2330", "topic": "小寶有點輕微異膚，想找無香的乳液，鎖定四個牌子想問哪個比較推薦", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@annielimzhen2330/post/De8V_dQkvHj", "note": "", "reply": "@we261204 又出現了，小編每次看到都好感動 🥹\n謝謝妳幫媽咪回答，還記得我們家這一罐 🤍\n被人這樣順手推薦，對我們來說真的很有份量 ( ˘ᵕ˘ )♡", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@yi__wen_", "topic": "連假 4 天，想帶小孩去外面住宿玩樂，有推薦的嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yi__wen_/post/DezR09NFOy6", "note": "", "reply": "連假四天出門住一晚，整個人會鬆很多 (๑˃̵ ᴗ ˂̵)✨\n樓上提到的海邊和潮間帶那些行程，小孩絕對會玩得很開心 🌿\n\n行李小編補三樣：\n海邊和戶外的大魔王是太陽，\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦、6 個月以上就能用，\n海洋友善、不泛白也不黏，溫和不熏眼睛；\n小孩不愛被擦就換防曬氣墊，輕拍一下就好 ☀️(๑•̀ㅂ•́)و✧\n\nWeWee 旅行組（乳液、舒膚精華、洗香香）小容量不佔行李，\n玩一整天回房間洗澡保濕一次到位 🍼\n再塞一瓶植萃抗菌噴霧，房間桌面、餐廳桌面、泳池躺椅噴一噴擦過，無色無味無酒精 ( ˘ᵕ˘ )\n\n玩回來擦一層寶貝潤潤乳，可以鎖住水分 🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-25_2126", "title": "WeWee 脆海巡清單｜2026-10-25（日）晚上 9 點場（第二輪）10 篇＋加碼 1 篇", "keywords": [], "items": [{"n": "1", "who": "@___ooo.o", "topic": "快要出月子中心，寶寶回家後馬上會用到的東西一個都還沒買", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@___ooo.o/post/De4TJyfGv_P", "note": "", "reply": "快出月中這個時間點，清單抓「回家第一週真的會碰到的」就夠了 ٩(๑❛ᴗ❛๑)۶\n妳自己列的洗澡用品，剛好就是第一天會用到的那一類 🍼\n\n洗沐挑一瓶能從頭洗到腳的最省事，\n軟趴趴的小嫩嬰一隻手抱著，另一隻手真的換不了第二瓶 😂\nWeWee 全身洗香香洗澡洗頭洗臉一瓶搞定，泡泡很細緻、洗完不乾澀 ✨\n\n洗好趁皮膚還微濕擦上寶貝潤潤乳，新生兒就能用、吸收快不黏不悶，\n可以使肌膚留住水分 (๑•̀ㅂ•́)و✧\n\n尿布台、背巾這種「看體型和習慣」的，回家住一兩週再決定也不遲 🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@amber_dooo", "topic": "寶寶 2M23D 深夜紀錄：臉部耳朵一粒粒、四肢乾燥起粗疹子，每天補擦 3 次以上", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@amber_dooo/post/De50CXuE8HU", "note": "", "reply": "2M23D 就把餵奶、便便、皮膚、睡眠整理得這麼有條理，這份紀錄太強了 👏🤩\n妳連「前期飢餓訊號」都抓出來，看得出來觀察得很細 ✨\n\n耳朵和臉上那些一粒粒，很多寶寶這個月齡都會有，通常不痛，大一點會慢慢退掉 ( ˘ᵕ˘ )\n\n搭一個小撇步：洗頭前先在那幾個地方抹一點 WeWee 舒膚精華油讓皮屑軟化，\n等幾分鐘再用指腹輕輕推開，接著用全身洗香香洗掉，\n比乾的直接搓好清很多，一次沒清乾淨就分幾天慢慢來 🍼\n\n洗完趁皮膚還微濕擦一層寶貝潤潤乳，可以形成肌膚保護膜 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@yunying502", "topic": "每天的保養一次擦幾瓶才算正常？有人也是走極簡懶人路線的嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yunying502/post/De1NyjroKjR", "note": "", "reply": "走極簡其實完全沒問題 (｡•ᴗ-)✧\n整輪擦下來不一定比較有效，順序對、時機對反而更有感 😌\n\n如果只留一樣，小編會留「洗完臉之後的保濕那一步」，\n而且趁皮膚還微濕的時候就擦，吸收和推開都會順很多 ✨\n\n質地想參考的話～WeWee 寶貝潤潤乳是台灣團隊研發一年多、\n前後調了 30 幾次才推出，現在做到第三代了喔～\n吸收快、不黏不悶，大人小孩都能擦，可以維持肌膚健康 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@pn_die", "topic": "最近準備來洗寶寶的用品，在思考要不要購入洗奶瓶的清潔劑和手洗精", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@pn_die/post/De3nb2RI-lF", "note": "", "reply": "「我就是會常常撿肥皂的人」這句太真實了 😂🤣\n奶瓶和衣服其實是兩種污垢，分開挑會比較好用 (｡•ᴗ-)✧\n\n洗奶瓶的話，美好實驗室的果菜奶瓶潔淨液是鳳梨酵素＋葡萄柚籽，\n噴 3～5 下就好，之後開始副食品、洗蔬果也用得到 🍼\n\n寶寶衣服最常卡的是奶漬、口水、便便這種蛋白類的污垢，\n全酵貼身衣物手洗露靠酵素去分解它，局部搓一下再丟洗衣機，用量很省 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@apo_chou", "topic": "求推薦跟團親子旅遊行程，明年 1-2 月要有雪季，主要帶孩子看雪", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@apo_chou/post/De0ahMTj2bx", "note": "", "reply": "帶孩子追雪這個目標超浪漫 ✈️٩(๑❛ᴗ❛๑)۶\n樓上業務貼的行程選擇很多，明年 1-2 月還有時間慢慢比 ✨\n\n先說一件很多人回國才發現的事：\n雪季室外乾冷、室內又整天開暖氣，小孩的臉和手會乾得特別快 🥹\n洗完澡趁皮膚還微濕，先抹一層 WeWee 舒膚精華油\n（無防腐劑，乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷），\n再疊寶貝潤潤乳，比單擦一罐更能鎖住水分 (๑•̀ㅂ•́)و✧\n\n行李再說一句：WeWee 旅行組（乳液、舒膚精華、洗香香）小容量不佔位置，\n美好實驗室的植萃抗菌噴霧也可以塞一瓶，\n飛機椅背、機艙扶手、轉機候機室噴一噴擦過，無色無味無酒精、60ml 能上飛機 🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@falo0418", "topic": "滿 1 歲的女寶，每次換尿布都用純水濕紙巾擦，老師和醫生都說要避免過度清潔，該怎麼照護", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@falo0418/post/Deso_ZsD_d5", "note": "", "reply": "妳自己整理出來的那個結論真的抓得很準 ( ˘ᵕ˘ )\n沒排便的時候少擦一次、換完先晾一下再包，這兩件事就很有幫助 🤍\n\n補一個動作上的小細節：\n真的需要擦的時候，用乾濕兩用洗臉巾沾乾淨飲用水，\n輕輕「按壓」擦拭掉就好、不要來回摩擦，\n腿根那一圈皺摺也是一樣的做法 🥹\n\n壓乾之後薄薄擦一層 WeWee 寶貝潤潤乳，可以防護肌膚 ♡", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@yutung.cheng412", "topic": "換季皮膚又紅又癢，手臂跟腳踝常常乾到起小紅疹，擦一般的乳液還會刺痛", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yutung.cheng412/post/De3f49oE7Hy", "note": "", "reply": "換季換到手臂和腳踝也跟著來，真的很煩人 (´;ω;｀)\n這種時候先把保養收得簡單一點，反而比較快穩回來 😌\n\n分量也可以調一下：一次擦厚改成一天分兩三次少量補，\n留一點吸收的空間，皮膚的負擔會小很多 ✨\n\n想找成分單純一點的話～WeWee 寶貝潤潤乳的成分表很短，\n積雪草、神經醯胺、甘草酸，\n而且通過德國 Dermatest® 異膚、敏感肌測試 Excellent 等級 👏\n洗完澡趁皮膚還微濕薄擦一層，可以提升肌膚舒適度 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@gazelle.79403183", "topic": "脆上有沒有 40+ 的姐姐，分享給 30 歲的我一些保養建議", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@gazelle.79403183/post/DemUofTkz4g", "note": "", "reply": "這串的答案看起來都很一致：防曬、睡飽、保濕 👏٩(๑❛ᴗ❛๑)۶\n30 歲就開始養，時間其實是站在妳這邊的 ✨\n\n保濕這一步小編想補一個很小的細節：\n洗完臉趁皮膚還微濕的時候就擦，比等到全乾才抹好推開很多、用量也省 😌\n\n想找成分單純的話，WeWee 寶貝潤潤乳大人小孩都能擦，\n吸收快、不黏不悶，可以維持肌膚彈性 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@zzd___1996", "topic": "簡單紀錄目前用過的五瓶妊娠油（附清爽度、吸收度、味道三個排行）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zzd___1996/post/DeyuUfWml7L", "note": "", "reply": "一次整理五瓶還排了清爽度、吸收度、味道三個榜，這篇太實用了 👏🤩\n妳說「皮膚太乾、加減保養比較舒服」，這個理由小編完全懂 ( ˘ᵕ˘ )\n\n如果還想再試一瓶～WeWee 舒膚精華油是無防腐劑的配方，\n乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷，吸收很快、不悶不黏 ✨\n\n肚子大起來之後，洗完澡趁微濕先抹油、再疊一層寶貝潤潤乳，\n可以調理肌膚紋路 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@su._.0416", "topic": "想詢問有推薦的親子飯店嗎🏨", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@su._.0416/post/DezXZstkphn", "note": "", "reply": "「明天太陽沒有升起也沒關係了」這句，半夜擠過奶的人都懂 🥹\n還要起來洗配件那一段，也是真的很消耗人 ( ˘ᵕ˘ )\n\n可是妳形容的奶醉、吃飽睡在自己的食物上，光看文字就被療癒到了 😂🤍\n這一段會越來越上手的，妳已經做得很好了 ♡", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-25_2012", "title": "WeWee 脆海巡清單｜2026-10-25（日）晚上 9 點場 10 篇＋加碼 1 篇＋感謝粉絲 1 筆", "keywords": [], "items": [{"n": "1", "who": "@chiao___u", "topic": "雙十一要囤什麼新生兒用品，預產期 1/5", "time": "2026-10-24（1 天前）", "stats": "163 讚 · 73 留言 · 15 轉發 · 261 分享", "tags": "⭐⭐⭐ 本場分享王（261 分享）｜🍼 預產期 1/5 完全對位｜帶產品｜⚠️ 深掃未發現", "url": "https://www.threads.com/@chiao___u/post/De3313vkhDm", "note": "她把功課做得很細（汽座買完、衣服口水巾買了一點、器材類還沒買），自己點出「消耗品都還沒買、例如乾濕兩用巾」——洗沐和乳液正好是她還沒想到的消耗品，而整串六則留言全是蝦皮／酷澎分潤連結，沒有一則幫她把「哪些該囤、哪些該等」分開來看。切入就走這個分法。", "reply": "預產期 1/5，現在開始囤時間抓得剛剛好 ٩(๑❛ᴗ❛๑)۶\n器材類（消毒鍋、調乳機）其實可以再等一下，\n很多醫院和月中都會先借你用，試過再決定比較不會買錯 🍼\n\n消耗品才是真的要趁雙十一囤的，\n乾濕兩用巾厚薄各一箱很實用，\n洗沐和乳液也算消耗品，因為是天天都會用到 ✨\n洗澡用 WeWee 全身洗香香，從頭洗到腳一瓶就夠、洗完不乾澀，\n擦的備一罐寶貝潤潤乳，新生兒就能用、吸收很快不黏不悶，可以滋潤肌膚 (๑•̀ㅂ•́)و✧\n\n奶瓶的清潔劑也可以一起算進去，\n美好實驗室的果菜奶瓶潔淨液是鳳梨酵素和葡萄柚籽，噴 3～5 下就好，\n之後開始副食品、洗蔬果也用得到 🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@smallfish_0718_", "topic": "異膚寶寶到底要擦什麼乳液，這樣很嚴重嗎", "time": "2026-10-23（2 天前）", "stats": "183 讚 · 203 留言 · 2 轉發 · 128 分享", "tags": "⭐⭐ 本場留言王（203 留言）＋ 128 分享｜⚠️⚠️ 醫療題：純互動、整則 是積雪草＋神經醯胺＋甘草酸\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n台灣團隊研發一年多、前後調了 30 幾次，現在是第三代囉～🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@star_is_bornnn", "topic": "天氣忽冷忽熱，一變冷寶寶皮膚就很容易變粗粗，有推薦的嬰兒護膚油嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@star_is_bornnn/post/DetY8DKmkLE", "note": "", "reply": "忽冷忽熱這幾天真的超難顧\n一變天皮膚馬上就反應給你看 🥲\n\n挑油的時候除了看成分表\n小編還會看它是不是單純的植物油配方\n擦起來比較不會悶在皮膚上 (｡•ᴗ-)✧\n\nWeWee 舒膚精華油是乳木果油＋荷荷芭油＋甜杏仁油＋角鯊烷，沒有加防腐劑\n吸收快，疊在寶貝潤潤乳下面當前導\n粗粗的地方會比較快變柔嫩 ✨\n\n媽媽自己拿來按摩、擦肚肚也可以，一瓶兩個人用 ٩(๑❛ᴗ❛๑)۶🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@shiba_ashema", "topic": "懷裡的小孩已經 3200g，懷不動了。待產包、嬰兒衣服都洗好打包完，還有什麼事是產前要注意的？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@shiba_ashema/post/DevQrCpgS--", "note": "", "reply": "3200g 還能藏肚，媽咪妳這個肚皮也太會裝 😂👏\n待產包跟衣服都弄好了，妳已經是隨時可以出發的狀態 ٩(๑❛ᴗ❛๑)۶\n\n補一樣很多人會忘記塞的：\n一瓶 60ml 的植萃抗菌噴霧\n醫院、產房備的乾洗手大多是酒精，住院那幾天洗手次數暴增，手很容易變得超乾\n我們這罐是柿子＋葡萄柚籽萃取，無色無味無酒精，噴一噴擦過就好 (๑•̀ㅂ•́)و✧\n\n再塞一條寶貝潤潤乳，大人小孩都能擦\n手乾的時候補一層可以鎖住水分 🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@little_lumi_cm", "topic": "女兒皮膚極乾燥，已經去皮膚科看過，目前擦貝膚黛瑪，舒特膚、雅漾也試過了，有推薦的乳液乳霜嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@little_lumi_cm/post/Den9uoIk6ee", "note": "", "reply": "已經試過三四個牌子還在找，這一段真的最磨人 🥹\n妳有固定看診、又願意一個一個慢慢試，真的已經顧得很細了 ( ˘ᵕ˘ )\n\n分享一個換季的疊法：\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油\n（乳木果油＋荷荷芭油＋角鯊烷，沒有加防腐劑）\n再疊一層寶貝潤潤乳鎖住水分\n比單擦一罐的保濕力撐得久，也能減緩因乾燥引起的皮膚癢 ♡\n\n另外睡前順手把指甲剪短\n抓出來的小傷口會比乾燥本身更難顧 🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@leeminiisme", "topic": "想帶家人去日本玩雪，有老有小，孩子點名要玩雪，不考慮自由行，有推薦的旅行社嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@leeminiisme/post/DejSatoky8G", "note": "", "reply": "孩子自己點名要玩雪，這種行程光想就很值得 ❄️٩(๑❛ᴗ❛๑)۶\n有老有小的話，拉車時間短、住宿舒服，通常比景點多寡還關鍵～\n\n補一個很常被漏掉的行前準備：\n雪地加上飯店暖氣，濕度低到臉頰和手背很容易乾到脫屑\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油\n再疊一層寶貝潤潤乳鎖住水分，比只擦一罐撐得久 (๑•̀ㅂ•́)و✧\n\n60ml 的小罐塞隨身包剛好\n白天在室內一天多補個一兩次，整趟會舒服很多 🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@tsai_coco007", "topic": "奶瓶、奶嘴頭、安撫奶嘴要消毒鍋一遍，準備奶瓶刷、奶瓶清潔劑、寶寶洗澡巾、口水巾，最後保持愉快的心情等寶寶到來", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@tsai_coco007/post/Der3lGuEi99", "note": "", "reply": "連「保持愉快的心情」都寫進清單裡\n這份準備度真的很可以 👏٩(๑❛ᴗ❛๑)۶\n\n補一個最容易被漏掉的：\n洗這些東西的那台洗衣機，洗衣槽本身\n裡面的皂垢看不到，寶寶衣服洗再多次也會沾回去\n美好實驗室的洗衣槽清潔劑一個月跑一次就夠 (๑•̀ㅂ•́)و✧\n\n之後炸屎、溢奶那些\n全酵貼身衣物手洗露的蛋白酵素可以分解頑強污垢，用量很省\n先備一瓶放著會很有用 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@caspianbuddy", "topic": "兒子異膚一直反反覆覆，看到廣告好像蠻多人推薦，有人用過可以分享心得嗎？或有什麼好用的乳液或方法", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@caspianbuddy/post/DevnxwHoL7J", "note": "", "reply": "每天看他在抓，那個心疼真的很難形容 🥹\n先不用急著一次把東西全換掉\n日常幾個小習慣其實影響很大 ( ˘ᵕ˘ )\n\n貼身衣物選寬鬆的純棉、室內保持涼爽通風，開冷氣其實是好選擇\n洗澡水不要太熱、十分鐘內起來\n睡前把指甲剪短，抓出來的傷口會比乾癢本身更難顧 ♡\n\n乳液的部分，WeWee 寶貝潤潤乳是積雪草、靈芝多醣體、神經醯胺加甘草酸\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n可以減緩因乾燥引起的皮膚癢\n我們也陪伴過很多異膚寶寶家庭度過反覆乾癢的日常 🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@tsai33333", "topic": "寶寶乳液一罐 $890 大家可以接受嗎？這種每天用的東西你們會比較看單價還是成分跟使用感？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@tsai33333/post/DeviLJDk5Fb", "note": "", "reply": "「算一瓶大概可以用多久」這個動作太實際了 😂\n每天都要擦的東西本來就該算一下 (๑•̀ㅂ•́)و✧\n\n小編自己會先看三件事：\n成分表短不短、有沒有真的做過實測、擦起來悶不悶\n質地不合的話，再便宜也會剩大半罐放在角落 🥲\n\nWeWee 寶貝潤潤乳是積雪草＋靈芝多醣體＋神經醯胺＋甘草酸\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n台灣團隊研發了一年多、前後調整 30 幾次才推出，現在做到第三代了 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-21_1004", "title": "WeWee 脆海巡清單｜2026-10-21（三）早上 10 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@chuanyu__", "topic": "寶寶滿 1Y 第一次喝保久乳，結果直接捏爆噴得全身都是。本來要買防擠壓杯架，想到家裡的拋棄式奶瓶裝起來剛好", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@chuanyu__/post/DetQAvakqkU", "note": "", "reply": "現成的拋棄式奶瓶直接變杯架\n這個腦袋轉速太快了啦 👏٩(๑❛ᴗ❛๑)۶\n\n被奶淋一身之後最難處理的其實是衣服 😂\n奶漬乾掉再洗很容易留下一圈味道\n小編家都用美好實驗室的全酵貼身衣物手洗露\n蛋白酵素可以分解奶漬這種頑強污垢、用量也很省 (๑•̀ㅂ•́)و✧\n\n皮膚被噴到的那幾塊先壓乾\n再抹一層 WeWee 寶貝潤潤乳\n可以形成保護膜～ ʕ•ᴥ•ʔ🍼🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@jessy_92727", "topic": "已經連洗三天的寶寶衣服和用品，衣服襪子手套床圍防踢被圍兜紗布巾安撫毯背巾床包都洗了，還有漏掉沒洗的嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@jessy_92727/post/Derp0DnGdUW", "note": "", "reply": "連洗三天還記得把清單列出來\n這個準備度已經超過九成的新手媽媽了 👏🤩\n\n補一個很多人會留到最後才想起來的：\n奶瓶、奶嘴頭跟副食品的小餐具\n第一次使用前也可以先洗過一輪 ✨\n小編家用美好實驗室的果菜奶瓶潔淨液\n鳳梨酵素加葡萄柚籽、噴三到五下就夠\n蔬果、雞蛋、奶瓶可以一起洗 (｡•ᴗ-)✧\n\n剩下的時間就拿去躺平吧～ ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@stb_1031", "topic": "38+1，晚餐後覺得胎動少，去醫院測胎心音結果內診已經三公分、子宮頸也軟了，直接被留院待產。新手媽媽好緊張", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@stb_1031/post/DeuPbPoExjf", "note": "", "reply": "連產兆都還沒出現就直接被留下來\n這一下真的很突然，難怪會緊張 🥹\n剩下的交給醫護團隊\n妳只要把力氣留著就好 ( ˘ᵕ˘ )\n\n等一下如果有家人要幫妳補帶東西\n小編會多塞一瓶美好實驗室的植萃抗菌噴霧\n醫院和產房備的乾洗手大多是酒精的，很傷手\n這罐是柿子加葡萄柚籽萃取、無色無味無酒精\n擦完手再抹一點 WeWee 寶貝潤潤乳\n住院那幾天的手會舒服很多 🤍\n\n等妳回來報喜 ♡", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@zxcv_00123", "topic": "請問大家有推薦小嫩嬰的澡盆嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zxcv_00123/post/Def4Qfcmo9f", "note": "", "reply": "嫩嬰時期的澡盆真的是每天都要上陣的那一組 🍼\n樓上媽咪們的經驗聽起來都很實用 ✨\n\n再補兩個可以一起看的：\n一個是盆底摸起來有沒有止滑的紋路\n另一個是先想好它平常要放哪裡\n浴室地板、洗手台上還是陽台\n放的位置常常比款式更決定你會不會想用 (๑•̀ㅂ•́)و✧\n\n洗的部分小編家是 WeWee 全身洗香香\n洗澡洗頭洗臉一瓶搞定、泡泡很細緻、洗完不乾澀\n起來趁皮膚還微濕擦寶貝潤潤乳\n可以鎖住水分喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@pinanjiang35", "topic": "求推薦寶寶洗澡和乳液的旅行組，月底要帶孩子去沖繩家族旅遊想省行李空間，希望是無香或異膚寶寶可以用的，也歡迎品牌自薦", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@pinanjiang35/post/Detc1NSlHFG", "note": "", "reply": "月底沖繩天氣剛好，行李能省一點真的差很多 ✈️(๑˃̵ ᴗ ˂̵)\n既然歡迎自薦，小編就直接舉手了～\n\nWeWee 旅行組是無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n洗澎澎到保濕一次到位\n經典香和無香款都通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n成分單純、有檢測報告，異膚寶寶家庭用得很安心 🤍\n\n再補三個沖繩限定的提醒：\n當地超市和藥妝店就買得到寶寶專用純水\n水比台灣軟、小孩接受度高，泡奶也方便，不用從台灣扛 ✨\n太陽很大，記得帶 WeWee 極潤植萃防曬乳\n純物理性二氧化鈦、海洋友善、六個月以上可用\n小孩不肯乖乖擦就換防曬氣墊，輕拍就好 ☀️\n行李再塞一組美好實驗室旅行組和 60ml 植萃抗菌噴霧\n飯店桌面、餐椅扶手、推車扶手噴一噴擦過，無色無味無酒精 (๑•̀ㅂ•́)و✧\n\n玩得開心喔～ ʕ•ᴥ•ʔ♡", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@_syun_156", "topic": "想問有沒有媽媽推薦奶粉。第一胎還沒有頭緒，開始準備待產包，想買一瓶帶去醫院＋月子中心", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_syun_156/post/DetP8dHESkE", "note": "", "reply": "第一胎開始收待產包的時候\n真的每一項都想一次買對 🥹\n\n奶粉這題小編給一個方向就好：\n帶去醫院和月中那一瓶先抓最小的包裝\n回家之後再慢慢決定要不要長期喝\n這樣就算中途換也不會剩一大罐 ✨\n\n另外一樣很容易漏掉的是乾洗手的替代品！\n醫院、產房、月中備的大多是酒精成分\n住院加坐月子那一個月洗手消毒次數爆增，手會超乾\n小編會塞一瓶美好實驗室的植萃抗菌噴霧\n柿子加葡萄柚籽萃取、無色無味無酒精 (๑•̀ㅂ•́)و✧\n再帶一條 WeWee 寶貝潤潤乳，大人小孩共用\n可以提升肌膚舒適度～ ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@lysalm17", "topic": "有沒有 1 歲以下適合異膚寶寶的保健品", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lysalm17/post/DeriNrJGmIu", "note": "", "reply": "一歲以下的異膚寶寶，吃的那一塊交給兒科醫師最安心 ( ˘ᵕ˘ )\n小編這邊補兩個日常就能先調的 ✨\n\n一個是貼身衣物挑透氣寬鬆的純棉，避開羊毛和粗纖維\n另一個是室內維持涼爽通風\n開冷氣其實是好選擇，比悶著流汗不容易發作喔～\n\n保養小編最推油乳雙疊：\n洗完澡趁皮膚還微濕先點一點 WeWee 舒膚精華油\n無防腐劑，乳木果油加荷荷芭油加角鯊烷\n再疊一層寶貝潤潤乳鎖水，保濕感比單擦一罐維持得更久\n可以減緩因乾燥引起的皮膚癢 (๑•̀ㅂ•́)و✧\n\n這一組陪伴過很多異膚寶寶家庭度過反覆乾癢的日常 🤍ʕ•ᴥ•ʔ", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@jingru1991", "topic": "家有二寶，大寶 2y 小寶剛出生，外出時媽媽包一個好像裝不下，東西又都不能共用。有推薦大容量的後背媽媽包嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@jingru1991/post/DeuYiFfErUm", "note": "", "reply": "兩個孩子的東西完全不能共用\n包包的體積直接變兩倍 😂\n\n分享一個小編覺得比換包更有感的做法：\n不要按「大寶的、小寶的」分\n改成按「十分鐘內會用到的」分\n尿布、濕紙巾、一套衣服收成一個小袋放最上面\n其他的壓到包底就好\n在外面找東西的時候差超多 (๑•̀ㅂ•́)و✧\n\n那個小袋裡小編會再塞一條 60ml 的 WeWee 寶貝潤潤乳\n換完尿布、擦完汗順手補一層\n吸收快不黏不悶，兩個孩子一起用也夠 👜( ˘ᵕ˘ )\n\n小寶貝看起來超可愛的 ٩(๑❛ᴗ❛๑)۶🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@baby_11510", "topic": "請問媽媽們帶嫩嬰出門都怎麼換尿布？新手媽媽非常焦慮，好怕要換尿布沒廁所、剛好不在車上怎麼辦，還有餵奶、哭的話⋯", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@baby_11510/post/DeufkFAE66I", "note": "", "reply": "還沒出門就先把三種狀況都想過一輪\n這個準備度其實已經很夠了 👏( ˘ᵕ˘ )\n\n小編給一個很小的起步方式：\n第一趟先挑離家十分鐘以內的地方\n待個一小時就回來\n把「出去再回來」這件事先完整跑過一次\n下一趟心裡的底會穩很多 ✨\n\n換尿布的小撇步補一個：\n外面不方便沖洗的時候\n用乾濕兩用洗臉巾沾乾淨飲用水\n輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳\n可以形成保護膜～ (๑•̀ㅂ•́)و✧🍼🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@1.2_3.yp", "topic": "求防曬推薦！！！！（作者在串裡補充：目前用的那牌有一點小悶痘，所以想換）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@1.2_3.yp/post/DeuO3U7mV-p", "note": "", "reply": "擦起來會不會悶，真的是在台灣挑防曬最實際的一關 ☀️\n樓上媽咪已經先幫小編舉手了，謝謝妳 🫶\n\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦\n在台灣研發、針對濕熱的海島型氣候調的\n不泛白、不黏不悶，大人拿來當素顏奶油肌也很順\n裡面有神經醯胺和玻尿酸，擦完是清爽的那種感覺 (๑˃̵ ᴗ ˂̵)\n\n再補一個順序上的小撇步：\n防曬前先薄薄一層寶貝潤潤乳打底\n後面推開會更滑順、也比較不容易卡屑 ✨( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-21_1000", "title": "WeWee 脆海巡清單｜2026-10-21（三）早上 10 點場 10 篇＋感謝粉絲 1 則", "keywords": [], "items": [{"n": "1", "who": "@boomshagalagga", "topic": "求推薦異膚也能用的乳液🥹 之前跟風買了幾個大家都在推的，有的太厚、有的悶、還有用了更嚴重的，實在是有夠難", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@boomshagalagga/post/DetcY2Dk2QJ", "note": "", "reply": "「有的太厚、有的悶、還有用了更嚴重的」\n這一輪踩雷小編看了都心疼 🥹\n\n樓上兩位媽咪已經先幫小編舉手了，有點害羞 ( ˘ᵕ˘ )🤍\n挑的時候可以把重點放在成分單純、有沒有做過檢測\n我們家寶貝潤潤乳是通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n積雪草、靈芝多醣體、神經醯胺、甘草酸這幾樣在撐著 ✨\n\n洗完澡趁皮膚還微濕就擦，不用來回推\n吸收快不黏不悶，寶貝自己也願意伸手 (๑˃̵ ᴗ ˂̵)🍼", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@wenhsin___", "topic": "身為宜蘭人完全沒過敏的，結果生了兩隻都異膚⋯媽媽真的很努力了🫠", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wenhsin___/post/DehNF26CfAU", "note": "", "reply": "兩隻都異膚，媽媽的洗澎澎跟擦乳液流程一天要跑兩輪\n這真的很努力了 👏( ˘ᵕ˘ )\n而且樓上媽咪已經先幫小編舉手了，好感動 🥹\n\n除了乳液，居家習慣其實蠻有感：\n貼身衣物選透氣寬鬆的純棉、避免粗纖維磨\n室內維持涼爽通風，開冷氣其實是好選擇\n睡前把指甲剪短，抓出來的傷口比原本的乾癢更麻煩 ✨\n\n我們家寶貝潤潤乳是台灣團隊研發一年多、前後調了 30 幾次才推出\n現在已經是第三代，陪伴過很多異膚寶寶家庭度過反覆乾癢的日常\n洗完澡趁微濕擦，可以增強肌膚的防禦力 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@su_70in45", "topic": "我的皮膚天生就超乾，每天擦身體乳還是有乾乾的細紋，冬天要再加身體油。皮膚乾真的只是喝水跟擦保濕就能解決嗎？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@su_70in45/post/Dete8i7Ep0v", "note": "", "reply": "天生乾肌真的不是喝水就能補回來的，這點小編完全同意 ( ˘ᵕ˘ )\n水喝到 2000cc 還是乾，那種挫折感超級真實 🥹\n\n小編想補一個很小的順序問題：\n油疊在乳液上面，其實是把乳液封住；\n反過來先一層薄薄的油、再疊乳液，鎖水的那層會更穩一點 ✨\n\n我們家舒膚精華油是無防腐劑的配方\n乳木果油、荷荷芭油、甜杏仁油加角鯊烷，吸收快不悶\n上面再疊一層寶貝潤潤乳\n走保濕跟維持肌膚彈性，細紋那一塊也會比較服貼 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@cahhh_812115", "topic": "坐月子的媽咪是不是都不能洗頭～", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cahhh_812115/post/Deiu0Qjibun", "note": "", "reply": "「不洗頭真的會全身都癢」這句小編超有感 🥹\n坐月子那一個月流汗多，背上跟皺摺是最容易悶的 ʕ•ᴥ•ʔ\n\n身體這一塊可以先顧起來：\n洗完澡趁皮膚還微濕就把乳液抹上去\n比乾了再擦省力，也不用一直來回推 ✨\n\n寶貝潤潤乳大人小孩都能擦，月中先備一罐很划算\n積雪草加神經醯胺，可以減緩因乾燥引起的皮膚癢 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@pinanjiang35", "topic": "求推薦寶寶洗澡和乳液的旅行組，月底要帶孩子去沖繩家族旅遊，想省一下行李空間🫶🏻 希望是無香或異膚寶寶可以用的，也歡迎品牌自薦～～", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@pinanjiang35/post/Detc1NSlHFG", "note": "", "reply": "沖繩家族旅遊！行李要省空間這件事小編太懂了 ✈️(｡•ᴗ-)✧\n\nWeWee 旅行組裡面是無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n洗澎澎到保濕一次到位，而且乳液就是無香款\n洗香香是洗澡洗頭洗臉一瓶搞定，不佔行李 ✨\n\n再補兩個沖繩限定的小撇步：\n當地超市和藥妝店就買得到寶寶專用純水，水比台灣軟、泡奶很方便，不用從台灣扛\n另外沖繩的太陽很不客氣，極潤植萃防曬乳是純物理性二氧化鈦、海洋友善，六個月以上就能用 ☀️\n\n美好實驗室的旅行組（餐具清潔露、手洗露、除臭噴霧、果菜奶瓶潔淨液）加一瓶 60ml 植萃抗菌噴霧\n飯店桌面、餐椅扶手、推車扶手噴一噴擦過就好，無色無味無酒精，60ml 能上飛機\n玩回來洗乾淨再擦一層潤潤乳，可以舒緩乾燥 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@angel53124", "topic": "生產日子越來越接近，越來越焦慮。到底還要準備什麼、待產包還要塞什麼東西、房間還要怎麼整理？好⋯⋯好焦慮啊救命", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@angel53124/post/DepAjWQE6Ip", "note": "", "reply": "「怕少帶要一直回去拿、多帶又要搬回家」這個兩難小編完全懂 🥹\n不過妳待產包都整理好了，進度其實比自己以為的快 ( ˘ᵕ˘ )\n\n小編的想法是：體積小、每天都會用到的先塞，大件的留給家人補送\n這樣就不用在「要不要帶」之間一直反覆了\n\n補一樣很多人會漏掉的：一瓶 60ml 的植萃抗菌噴霧\n醫院、產房備的乾洗手大多是酒精的，很傷手\n住院那幾天消毒次數會暴增，手真的會乾到脫皮\n這罐是無色無味無酒精，換著用會舒服很多 🤍\n\n寶寶那一格先放一罐寶貝潤潤乳就夠，新生兒就能用，洗完澡趁微濕擦可以鎖住水分 ♡", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@_syun_156", "topic": "想詢問一下有沒有媽媽推薦奶粉，第一胎目前還沒有頭緒。開始準備待產包，想說買一瓶奶粉帶去醫院＋月子中心", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_syun_156/post/DetP8dHESkE", "note": "", "reply": "第一胎光是站在奶粉架前面就會當機，這個小編聽很多媽咪說過 ٩(๑❛ᴗ❛๑)۶\n而且妳每一則都認真回，好認真的新手媽媽 👏\n\n小編想提供一個分類的方式：\n會被寶寶本人否決的（奶粉、奶嘴、尺寸）先少量、別囤\n擦的、洗的那一類不會被退貨，可以安心先備 ✨\n\n寶貝潤潤乳就屬於後者，新生兒就能用\n150ml 一罐用很久，醫院那幾天到月中都接得上\n洗完澡趁皮膚還微濕擦，吸收快不黏，順手呵護肌膚 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@1.2_3.yp", "topic": "求防曬推薦！！！！（她在串裡補：目前用的那支會有一點點小悶痘，所以想換）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@1.2_3.yp/post/DeuO3U7mV-p", "note": "", "reply": "「會有一點點小悶」這個感覺超難形容但真的很煩 (´;ω;｀)\n樓上媽咪已經先幫小編舉手了，有點害羞 🥹\n\n怕悶的話，純物理性的配方可以列進候選：\n我們家極潤植萃防曬乳是二氧化鈦的純物理配方、海洋友善\n推開不泛白也不黏，大人擦起來是素顏奶油肌那種感覺 ✨\n真空瓶裝，用到最後一次都不用擠空氣 (｡•ᴗ-)✧\n\n底妝前那一步也別省：防曬前先一層寶貝潤潤乳\n有打底，防曬推起來順很多，也可以形成肌膚保護膜 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@jingru1991", "topic": "家有二寶（大寶 2y、小寶剛出生），外出時媽媽包都怎麼收？東西原則上都沒辦法共用，頭痛。有推薦好收納或大容量的後背媽媽包嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@jingru1991/post/DeuYiFfErUm", "note": "", "reply": "大寶小寶的東西一條一條列出來，看了都替妳頭痛 😂\n兩套行李塞一個包真的是另一個等級的任務 ٩(๑❛ᴗ❛๑)۶\n\n小編想從另一邊切：先把「真的能共用的那幾樣」挑出來\n包會瘦得比想像中多，大寶小寶能共用的其實不多 ✨\n\n乳液就是其中一樣：一小罐 60ml 的寶貝潤潤乳\n大寶玩完手腳乾乾、小寶脖子皺摺悶到，兩個都能順手補一層\n新生兒就能用，可以提升肌膚舒適度 (๑•̀ㅂ•́)و✧🍼🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@prettyshaofu", "topic": "我的寶寶有輕微異膚、很怕熱，一不注意就會身體起熱疹。阿嬤這週末要幫忙顧，他要我們準備長袖，我自己覺得不用。想問大家都大概到多冷的天氣才會給寶寶穿長袖", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@prettyshaofu/post/Deg0f85mT5G", "note": "", "reply": "「一不注意就起熱疹」這種怕熱的寶寶，夏天到秋天都在拚通風 🥹\n而且妳每一則都認真回，好用心的媽媽 👏(｡•ᴗ-)✧\n\n小編補一個流汗之後的小步驟：\n脖子、手腳皺摺容易積汗，用乾濕兩用洗臉巾沾乾淨飲用水\n輕輕「按壓」擦掉、不要來回摩擦，壓乾之後再擦乳液 ✨\n\n我們家寶貝潤潤乳是專為台灣濕熱的海島型氣候調的\n清爽好吸收、不黏不悶，擦完不會又多一層悶住的感覺\n可以幫忙把水分留住 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-20_1404", "title": "WeWee 脆海巡清單｜2026-10-20（二）下午 2 點場 10 篇", "keywords": [], "items": [{"n": "1", "who": "@yahui616", "topic": "以為生到天使寶寶，結果二月鬧遇到夜哭大魔王。朋友竟然推美強生奶粉＋紅豆手套偏方，也想問大家夜哭都是怎麼哄睡的？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yahui616/post/Des1n5FkhCS", "note": "", "reply": "「新手爸媽每天都在解新任務」這句小編完全被戳到 😂\n紅豆手套那段真的笑了好久 ٩(๑❛ᴗ❛๑)۶\n\n二月鬧這一段很多媽咪都遇過，慢慢會越來越好哄的 🥹\n小編想補一個很小的方向：\n睡前那一段的「順序」每天固定一樣就好\n順序比內容重要，寶寶比較容易知道接下來是要睡了 ✨\n\n收尾那一步小編會留給擦乳液：\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快不黏，可以提升肌膚舒適度 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@mo.chao__", "topic": "想送懷孕的姊妹禮物，但不想送寶寶的東西。最累的是媽媽本人吧？想問懷孕期間其實最需要的是什麼", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mo.chao__/post/Des_lWxGaMx", "note": "", "reply": "「最累的是媽媽本人」這個出發點小編超喜歡 👏\n而且「我又不認識他」真的太好笑了 😂\n\n樓上媽咪已經先幫小編舉手了，有點害羞 🥹\n送每天會擦的那一類確實很實用：\n孕期肚子越來越緊的時候，洗完澡趁皮膚還微濕\n先點一點 WeWee 舒膚精華油，再疊一層寶貝潤潤乳\n油乳疊起來走保濕跟維持肌膚彈性，比單擦一罐久一點 (๑•̀ㅂ•́)و✧\n\n挑的時候可以先問一下她手邊已經備了什麼\n這一類很多媽咪會自己先買，問過比較不會重複 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@youboyyeah", "topic": "給各位準備待產包的爸爸媽媽，建議帶上可彎吸管，兄弟推薦，還好我有買", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@youboyyeah/post/DehW74djxlw", "note": "", "reply": "可彎吸管這個提醒超實用，而且是真的用過才知道 👏٩(๑❛ᴗ❛๑)۶\n爸爸視角的待產包清單總是特別接地氣 ✨\n\n小編補一樣很多人會漏掉的：一瓶 60ml 的植萃抗菌噴霧\n醫院、產房備的乾洗手大多是酒精的，很傷手\n住院那幾天消毒次數會暴增，手真的會乾到脫皮\n這罐是無色無味無酒精，換著用會舒服很多 (๑•̀ㅂ•́)و✧\n\n寶寶那一格先放一罐寶貝潤潤乳就夠，新生兒就能用\n洗完澡趁皮膚還微濕擦，吸收快不黏不悶 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@amysaystory", "topic": "有些東西買之前覺得超需要，買回來根本沒用幾次。想問有沒有什麼育兒用品是妳買完真的覺得「早知道就早點買」的？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@amysaystory/post/DemDvKhiNvP", "note": "", "reply": "「買之前覺得超需要，買回來根本沒用幾次」這句太真實了 😂\n小編的購物車也是這樣長大的 ٩(๑❛ᴗ❛๑)۶\n\n小編的看法是：會被寶寶本人否決的（尺寸、口味、形狀）可以慢慢來\n每天都會用到的消耗類跟保養類，早一點入手最有感 ✨\n\n我們家寶貝潤潤乳就屬於後者：\n台灣團隊研發一年多、前後調了 30 幾次才推出，現在已經是第三代\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n150ml 一罐用很久，洗完澡趁微濕擦可以鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@wchen7207", "topic": "求推薦寶寶米餅！到底哪款比較能安心買？你們家寶寶最愛哪一款？哪款會回購？也歡迎分享踩雷款", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@wchen7207/post/DerfypzCWYX", "note": "", "reply": "米餅這一題小編先給一個挑的角度 🍼\n看它在嘴裡化得快不快、拿在手上好不好握 (｡•ᴗ-)✧\n底下爸媽給的實際經驗比包裝上的字準多了 ✨\n\n再說一個米餅時間的配套：\n吃完嘴巴周圍那一圈餅屑加口水，留著可能會更容易乾\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜～ (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@yuan20240912", "topic": "洗屁屁神器到底好不好用？女兒快五個月、8 公斤，一個人扛到手快斷，求推薦神器或輕鬆洗屁屁的方法", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yuan20240912/post/Dei9M-ak1y6", "note": "", "reply": "8 公斤單手抱著洗，手真的會想罷工 🥹\n而且妳已經找到幫手了，太好了 ٩(๑❛ᴗ❛๑)۶\n\n小編想補洗完的那一步：\n擦乾的時候輕輕壓一下、不要來回搓\n皺摺裡面常常壓完才發現還有點濕 ✨\n\n壓乾之後趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快不黏，可以幫忙把水分留住 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@yi.hzz", "topic": "有沒有也是 6 個月的寶寶？①出門都會帶什麼配備（目前自己煮副食品）②一天的作息，在考慮要不要加到 2 餐", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yi.hzz/post/Deo6PGYDwwv", "note": "", "reply": "六個月這個階段，出門的行李量會突然升級一級 😂\n底下媽咪們講的加熱方式都好實用 ✨\n\n小編補兩樣容易被忘記的：\n剛好滿六個月，防曬可以列進配備了！\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦配方、海洋友善\n推開不泛白也不黏，小朋友不愛被擦就用防曬氣墊輕拍一下 (๑•̀ㅂ•́)و✧\n\n另外外出包塞一瓶 60ml 的寶貝潤潤乳\n擦完手、玩到乾乾的時候隨手補一層，可以舒緩乾燥 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@_z.0603", "topic": "媽媽們都怎麼幫四個月寶寶準備副食品呀", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_z.0603/post/DegjHMLn2Kx", "note": "", "reply": "四個月剛開始這一段，一次準備一點點就很夠了 ( ˘ᵕ˘ )🍼\n底下媽咪們的流程分享都很完整，可以挑一套順手的照做 ✨\n\n小編補一個前置的小地方：\n蔬果下鍋前那一步，用美好實驗室的果菜奶瓶潔淨液噴三到五下再沖\n鳳梨酵素加葡萄柚籽，蔬果、雞蛋、奶瓶都用得上\n一瓶從備料洗到器具，流程可以少繞一圈 (๑•̀ㅂ•́)و✧🫶", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@happywife0505", "topic": "寶寶兩個多月大（脖子還沒硬），有適合的背巾推薦嗎？想要帶寶寶出門散步走走", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@happywife0505/post/Des-FZHk6W1", "note": "", "reply": "兩個多月就想帶出去走走，媽媽的行動力太強了 👏\n底下媽咪們提醒的「一定要試背」小編也很有感 ٩(๑❛ᴗ❛๑)۶\n\n小編補一個試背時可以加做的：\n請人幫妳調好之後，自己拆下來、再從頭穿一次\n之後在家多半是一個人上陣，自己穿得順才是真的順 ✨\n\n貼著胸口那一段容易悶，回家洗完澡趁微濕擦一層 WeWee 寶貝潤潤乳\n積雪草、神經醯胺、甘草酸，新生兒就能用，可以增強肌膚的防禦力 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@mona825_", "topic": "當媽之後一直想辦法幫小孩找事情做。買了磁吸片回家意外很常玩，有沒有媽媽可以推薦其他讓小孩自己動手玩的玩具？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mona825_/post/DerQ-tggdsO", "note": "", "reply": "「當媽之後一直想辦法幫小孩找事情做」這句笑著點頭 😂\n而且找到一樣他每天吵著要玩的，媽媽真的能喘口氣 ٩(๑❛ᴗ❛๑)۶\n\n小編想到的方向是「要用手出力」的那一類：\n貼紙書、按壓式的小機關、簡單的穿線板\n收起來也不佔位置，外出包塞得下 ✨\n\n順便說，這類會一直被小手摸、偶爾還會放到嘴邊的東西\n小編會隨手噴一瓶美好實驗室的植萃抗菌噴霧\n柿子加葡萄柚籽萃取，無色無味無酒精，噴一噴擦過就好\n玩完手腳乾乾的時候再擦一層寶貝潤潤乳呵護肌膚 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-20_1127", "title": "WeWee 脆海巡清單｜2026-10-20（二）早上 10 點場 10 篇＋感謝粉絲 1 則（排程延後，實際 11:27 跑）", "keywords": [], "items": [{"n": "1", "who": "@nardeart_", "topic": "嗨～想要認識台灣製的好東西和品牌", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@nardeart_/post/Deio8enD7iz", "note": "", "reply": "樓上兩位媽咪已經先幫小編舉手了，有點害羞又好感動 🥹🤍\n\n我們是辰曜生技，旗下有做敏感肌保養的 WeWee\n和做無毒居家清潔的美好實驗室，都是台灣自己研發的 ٩(๑❛ᴗ❛๑)۶\n\n最常被回購的是寶貝潤潤乳：\n台灣團隊研發一年多、前後調了 30 幾次才推出，現在已經是第三代\n專為台灣濕熱的海島型氣候調的，清爽好吸收、不黏不悶 ✨\n純物理防曬、洗香香、舒膚精華也都是走一樣的路線\n\n我們也長期在台灣做公益，陪重症病童說故事、走進國小教學\n不是一次活動，是一直在做的事 ( ˘ᵕ˘ )🫶", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@crow.unana", "topic": "新手爸爸出任務！老婆臥床安胎，採購寶寶用品的任務交給我了。一進去直接傻眼，想問有沒有什麼新生兒必備用品是一定要先準備…", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@crow.unana/post/Deot7xpkgS2", "note": "", "reply": "自己扛著採購任務跑一趟，還開視訊連線邊逛邊問，這位爸爸真的很有擔當 👏٩(๑❛ᴗ❛๑)۶\n\n「先準備一定會用到的」這個方向小編大推\n洗的、擦的這兩類最安全，不挑尺寸也不挑口味 ✨\n\n補一樣很多人會漏掉的：一瓶 60ml 的植萃抗菌噴霧\n醫院、產房備的乾洗手大多是酒精的，很傷手\n住院那幾天消毒次數會暴增，手真的會乾到脫皮\n這罐是無色無味無酒精，換著用會舒服很多 (๑•̀ㅂ•́)و✧\n\n寶寶那邊先備一罐寶貝潤潤乳就夠，新生兒就能用\n洗完澡趁皮膚還微濕擦，吸收快不黏不悶 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@iamdoris.c", "topic": "要出月中了！即將帶寶寶回家一起生活，好緊張呀～", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@iamdoris.c/post/Debc0QfiV01", "note": "", "reply": "「好緊張」這三個字小編完全懂，回家的第一週本來就是最陡的那一段 🥹\n\n在月中還有人幫忙的時候，請妳放心睡飽\n回家之後還要繼續練功呢～把體力留到那時候用 🤍\n\n想給一件很小但很有用的事：\n回家先把「洗澡—擦乳液—換衣服」這段流程的順序固定下來\n每天都一樣，寶寶比較快進入狀況，大人也會越來越順手 ( ˘ᵕ˘ )\n\n洗完澡趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n吸收快不黏，可以提升肌膚舒適度 ♡", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@ty.ting.0106", "topic": "有誰家的寶寶也是洗澡時候都正常，準備要擦身體穿衣服的時候瞬間大哭的嗎？（寶寶 2 個月）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ty.ting.0106/post/Deo1dHfH2ES", "note": "", "reply": "「洗的時候超享受，一離開水面就開始哭」這個對比太寫實了 😂\n看他哭成那樣真的會很捨不得 🥹\n\n小編聽過一個蠻有效的做法：\n把擦乾跟擦乳液整段都留在浴室裡做\n溫差小一點，通常會比抱到房間再處理順利很多 ✨\n\n而且趁皮膚還微濕就把 WeWee 寶貝潤潤乳抹上去\n吸收快、不用來回推，整個流程可以縮短不少\n也比較能幫忙把水分留住 (๑•̀ㅂ•́)و✧\n\n兩個月的寶寶正在熟悉這一套，慢慢會越來越順的 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@mumu726", "topic": "預產期 1 月女寶，要怎麼買衣服？選項太多都好想買，又怕小孩長太快穿不到，幾公分的要幾件、要長袖還是短袖", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mumu726/post/Deo2zYzk-gR", "note": "", "reply": "一月的女寶，光是想小衣服就會忍不住一直加購物車 😂\n底下媽咪們給的件數跟尺寸都很實用，可以再照妳家的室溫抓一次 ✨\n\n小編想補一個比較少人提的：\n買回來先洗過再穿，順手摸一下領口跟內側的標籤會不會磨\n寶寶整天躺著、側著睡，接觸最久的其實是那幾條車縫線 ʕ•ᴥ•ʔ\n\n新生兒的皮膚還很薄，洗完澡趁微濕擦一層 WeWee 寶貝潤潤乳\n積雪草、神經醯胺、甘草酸，可以增強肌膚的防禦力 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@ginny911997", "topic": "有什麼育兒知識是可以在月子中心請教護理師的？出月中後自己帶比較不會崩潰手忙腳亂", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ginny911997/post/Dens064EnQf", "note": "", "reply": "「在月中跟回家會判若兩嬰」這句笑到不行，但也太真實 🤣\n\n小編的建議是：除了看，請護理師在旁邊陪妳自己做一次\n洗澡、拍嗝、換尿布這幾項，手感真的要自己做過才記得住 (๑•̀ㅂ•́)و✧\n\n還有一個很容易被跳過的：洗完澡怎麼擦乳液\n趁皮膚還微濕就擦，比乾了再擦更能鎖住水分，也不用一直來回推 ✨\n我們家寶貝潤潤乳吸收快不黏，新生兒就能用\n在月中先練熟，回家那一套就直接接上了 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@ooxx1788", "topic": "快出月中了家裡沒有飲水機，想買台調乳器，有媽咪可以分享實際心得嗎？（她在兩個牌子之間猶豫）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ooxx1788/post/DemkC8pifkZ", "note": "", "reply": "家裡沒有飲水機的話，這台確實會變成每天的主力 (｡•ᴗ-)✧\n底下有實際在用的媽咪分享使用細節，比看規格表準多了 ✨\n\n小編補一個挑的時候容易漏掉的：先決定它要放哪裡\n半夜泡奶的動線順，一個晚上能少走好幾趟\n水箱開口夠大、手伸得進去，之後清洗也會輕鬆很多 (๑•̀ㅂ•́)و✧\n\n另外出月中的清單裡，一天會用到好幾次的其實是乳液\n寶貝潤潤乳 150ml 一罐用很久，新生兒就能用\n洗完澡、換完尿布順手補一層，可以幫忙鎖住水分 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@haha______p", "topic": "準備第一次帶 6 個月寶寶出遠門！從高雄出發去墾丁三天兩夜，想問適合小寶寶的親子景點、室內景點和美食", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@haha______p/post/DeoXP_vGcb4", "note": "", "reply": "第一次帶寶寶出遠門，那種又期待又緊張小編太懂了 🥹\n而且妳已經先排好「進飯店就耍廢」的行程，這個節奏抓得超好 👏\n\n墾丁的太陽真的很不客氣，防曬請列進必帶 ☀️\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦配方、海洋友善\n剛好六個月以上就可以用，推開不泛白也不黏\n小朋友不愛被擦的話，防曬氣墊輕拍一下就好 (๑•̀ㅂ•́)و✧\n\n行李想輕一點，WeWee 旅行組裡是無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n玩回來洗乾淨再擦一層寶貝潤潤乳，可以舒緩乾燥 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@anitacreamm", "topic": "嬰兒要擦護唇膏嗎？剛剛看他奶嘴掉下來好像嘴唇有點乾，畢竟每天都在 25 度冷氣房（2 個月寶寶）", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@anitacreamm/post/DeKXz1sk-tS", "note": "", "reply": "兩個月就注意到嘴唇乾乾的，媽媽的觀察力也太細 👏( ˘ᵕ˘ )\n底下媽咪們提的方向，可以先拿妳手邊已經有的試試看 ✨\n\n小編補一個容易被忽略的地方：\n喝完奶、流口水之後，嘴巴周圍那一圈留著奶漬可能會更容易乾\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜～ (๑•̀ㅂ•́)و✧\n\n冷氣房待久了濕度會偏低，一天多補一次會更舒服 🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@pomme1984", "topic": "天氣一變，家裡有異敏兒／乾癢肌寶寶的媽媽又開始睡不好了，整晚都在聽抓癢聲。換季你們都怎麼幫寶寶維持肌膚穩定？求分享名單", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@pomme1984/post/DedjZ9nGlcp", "note": "", "reply": "樓上媽咪已經先幫小編說了，看到的時候整個害羞 🥹🤍\n換季那幾天整晚聽著抓癢聲，真的會睡不好 (´;ω;｀)\n\n小編補兩個居家的小地方：\n洗澡水不要太熱、時間控制在十分鐘以內\n睡前把指甲剪短，抓出來的傷口會比原本的乾癢更麻煩 ✨\n\n洗完澡趁皮膚還微濕，先點一點 WeWee 舒膚精華油再疊一層寶貝潤潤乳\n積雪草、神經醯胺、甘草酸，通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n可以減緩因乾燥引起的皮膚癢\n我們陪伴過很多異膚寶寶家庭度過反覆乾癢的日常 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "11", "who": "@forever801217＋we261204", "topic": "（感謝粉絲）@forever801217 與 @we261204 在 @nardeart_ 的台灣製品牌串裡推薦我們", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@nardeart_/post/Deio8enD7iz", "note": "", "reply": "看到「台灣製我推 Wewee 家的所有產品」跟「Wewee 防曬及寶貝潤潤乳推」，小編在螢幕前笑了好久 🥹👏\n兩位每次都主動幫我們說話，真的都有收到喔 ٩(๑❛ᴗ❛๑)۶\n下次換我們幫妳們加油 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-19_2230", "title": "WeWee 脆海巡清單｜2026-10-19（一）晚上 9 點場 10 篇＋感謝粉絲 1 則（排程延後，實際 22:30 跑）", "keywords": [], "items": [{"n": "1", "who": "@tine922", "topic": "雙十一要囤什麼？什麼買了反而會閒置？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@tine922/post/DenzOd7kt50", "note": "", "reply": "「買了反而容易閒置」這個提醒也太實在 😂\n囤貨最怕的就是買一整箱，結果寶寶本人不買單 ٩(๑❛ᴗ❛๑)۶\n\n小編的看法是：尺寸類、口味類的先別囤\n消耗類跟保養類可以安心囤，不挑人、開封後慢慢用也不怕放到過期 ✨\n\n我們家寶貝潤潤乳就屬於後者：\n台灣團隊研發一年多、前後調了 30 幾次才推出，現在做到第三代\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n150ml 一罐用很久，經典香跟無香款都有，吸收快不黏不悶 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@kangaroo.8503343", "topic": "新手爸爸：太太 11 月底生，這一個月我可以做什麼？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@kangaroo.8503343/post/DepSgP6kw7j", "note": "", "reply": "光是這篇文的語氣，就看得出來你會是很靠得住的爸爸 👏٩(๑❛ᴗ❛๑)۶\n\n小編給一個很具體的：這一個月挑一兩件事「整包認領下來」\n住院那幾天的行李由你打包、你記得在哪一格\n太太在產房就不用再當總指揮了 (๑•̀ㅂ•́)و✧✨\n\n那一袋一定要放一瓶 60ml 的植萃抗菌噴霧：\n醫院、產房、月子中心備的乾洗手大多是酒精的，很傷手\n住院加坐月子那段消毒次數爆增，手會乾到脫皮\n這罐是無色無味無酒精，換著用手比較不會乾 ✨\n\n洗澎澎那一袋也交給你：\nWeWee 旅行組裡面是無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n寶貝潤潤乳洗完澡趁皮膚還微濕擦，吸收快不黏\n很多新手爸爸第一個學會的就是這一步，超有成就感的 ( ˘ᵕ˘ )🍼🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@___rouuuuu.20", "topic": "滑步車跟學步車看了好久，不知道怎麼下手", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@___rouuuuu.20/post/DepFBYDiVbG", "note": "", "reply": "選項一攤開真的會選擇障礙，光是名字就一大串 😂\n而且九個月這個階段變化超快，會難挑是正常的 (๑•̀ㅂ•́)و✧\n\n小編補一個比較少人提的角度：\n看握把的布套跟坐墊能不能拆下來洗\n這台之後會天天被小手抓、被口水沾到，能洗的用起來最舒服 ✨\n\n另外公園那一輪的標配別忘了防曬！\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦配方，推開不泛白也不黏，溫和不熏眼睛\n小孩不愛被擦的話，防曬氣墊輕拍一下就好 ٩(๑❛ᴗ❛๑)۶\n\n玩回來洗乾淨，再擦一層寶貝潤潤乳\n可以幫忙鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@enjoythelife520", "topic": "孕婦臉部保養品牌，市面太多牌子難選", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@enjoythelife520/post/DeqaXz4kxBa", "note": "", "reply": "牌子一攤開真的會看到頭昏 😂 懷孕這一段皮膚本來就比平常挑 🥲\n\n小編給一個挑的方向：\n先把「每天一定會擦的那兩三樣」顧好，成分單純一點、一次只換一樣\n這樣萬一不合，也比較知道是哪一瓶 (๑•̀ㅂ•́)و✧\n\n臉的部分底下媽咪們已經給了不少選擇，身體那一塊小編補一下：\n肚肚越來越緊的時候，洗完澡趁微濕先點一點 WeWee 舒膚精華油\n再疊一層寶貝潤潤乳，走保濕跟維持肌膚彈性\n油乳疊起來，保濕感會明顯久一點 ✨( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@ann0925v", "topic": "待產用品越看越不敢下單，哪些要先備、哪些先忍住？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ann0925v/post/Den541DGqbY", "note": "", "reply": "「每樣都有人說必買，也有人說用不到」這句太真實了 😂\n會這樣是因為每個寶寶的意見都不一樣啊 ٩(๑❛ᴗ❛๑)۶\n\n小編給一個很好用的分界：\n會被寶寶本人否決的（口味、尺寸、形狀）先別囤\n不會被否決的（洗的、擦的、收納這幾類）可以先備起來 ✨\n\n待產包裡小編最推薦先放的，是一瓶 60ml 的植萃抗菌噴霧\n醫院備的乾洗手大多是酒精的，很傷手\n住院那幾天消毒次數爆增，手真的會乾得很快\n這罐無色無味無酒精，換著用會舒服很多 (๑•̀ㅂ•́)و✧\n\n保養那一格先備一罐寶貝潤潤乳就夠，新生兒就能用\n洗完澡趁皮膚還微濕擦，吸收快不黏不悶，可以提升肌膚舒適度 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@ephemerallll___", "topic": "奶粉分裝盒實用嗎？過幾天要出月中", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ephemerallll___/post/DeoxF3vEzmx", "note": "", "reply": "出月中前的採購清單真的會越列越長 😂\n分裝盒底下大家講得很完整了，可以先入手一個用順了再補 ( ˘ᵕ˘ )\n\n小編想補一個出月中後最容易手忙腳亂的：洗澎澎那一段\n回家第一週先把流程固定下來，寶寶比較不會抗拒 ✨\n\n洗完澡趁皮膚還微濕就把 WeWee 寶貝潤潤乳擦上去\n比乾了再擦更能幫忙把水分留住，吸收也快 (๑•̀ㅂ•́)و✧\n\n月中這一個月辛苦了，接下來慢慢會越來越上手的 🍼🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@hsin_523", "topic": "寶寶冬天衣服太少，皮膚偏敏感想找純棉的", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hsin_523/post/DegAFr7n-nx", "note": "", "reply": "二個多月就已經在備冬天的衣服，妳的進度超前欸 👏\n而且直接鎖定純棉，這個方向小編大推 ٩(๑❛ᴗ❛๑)۶\n\n想補一個挑的小角度：\n除了材質，也看一下領口跟袖口的車縫線在裡面會不會磨\n寶寶整天躺著、側著睡，接觸最久的其實是那幾條線 ✨\n\n另外敏感一點的膚質，洗完澡那一步也很關鍵：\n趁皮膚還微濕擦一層 WeWee 寶貝潤潤乳\n積雪草、神經醯胺、甘草酸，新生兒就能用\n可以增強肌膚的防禦力 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@roros.wow", "topic": "過夜尿布沒漏，但早上衣服有一股淡淡的尿騷味", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@roros.wow/post/DeiPSqUEkGT", "note": "", "reply": "紀錄做得這麼細，光看就知道妳有多用心 👏( ˘ᵕ˘ )\n那股味道淡淡的卻又很難忽略，確實有點惱人 🥲\n\n尿布的選擇底下媽咪們已經給了不少方向，\n小編補的是「衣服那一端」：\n味道一旦留在布纖維裡，一般洗程常常帶不太走 ✨\n\n睡衣跟床單那幾件，可以先用美好實驗室的全酵貼身衣物手洗露局部搓過再丟洗衣機\n蛋白酵素會把那種頑強污垢分解掉，用量也很省 (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@qqjmb71", "topic": "想找中南部可以試背揹巾的母嬰用品店", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qqjmb71/post/DerAj-jkpwz", "note": "", "reply": "堅持要試背過才下手，這個謹慎度小編很欣賞 👏\n揹巾真的是「規格漂亮不等於背起來舒服」的那一種 (๑•̀ㅂ•́)و✧\n\n分享兩個試背的小撇步：\n帶著寶寶一起去，而且挑剛喝完奶、比較願意待著的時段\n背上之後現場走個三到五分鐘，肩膀跟腰的感覺才會跑出來 ✨\n\n再補一個搭配的：\n貼著胸口那一段，脖子皺摺可能會悶著汗水\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後擦一層 WeWee 寶貝潤潤乳，可以形成保護膜～ ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@go_to_hell748", "topic": "帶不到一歲的寶寶去香港，熱寶寶粥跟泡奶怎麼解決？", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@go_to_hell748/post/DeR00lVGGrD", "note": "", "reply": "熱粥跟泡奶這兩題，出門在外真的最卡 🥹\n底下媽咪們的方法都很實用，可以照妳的行程挑最順手的 ( ˘ᵕ˘ )\n\n小編補一個很多人回國才想到的：晚上回飯店那一關\n碗、奶瓶、奶嘴頭都要洗，房間又只有一個洗手台\n美好實驗室旅行組剛好都是 60ml 的小容量\n果菜奶瓶潔淨液、餐具清潔露塞行李箱角落就好 ✨\n\n餐廳的桌面、餐椅扶手，可以帶一瓶 60ml 的植萃抗菌噴霧噴一噴擦過\n無色無味無酒精，而且能上飛機 (๑•̀ㅂ•́)و✧\n\n一整天跑行程下來手腳容易乾，睡前補一層寶貝潤潤乳\n可以舒緩乾燥 ٩(๑❛ᴗ❛๑)۶🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-18_1633", "title": "WeWee 脆海巡清單｜2026-10-18（日）下午 2 點場 10 篇（排程延後，實際 16:33 跑）", "keywords": [], "items": [{"n": "1", "who": "@dafeng8", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@dafeng8/post/DemJSe-EjJa", "note": "", "reply": "「單身漂亮又有錢的姑姑」這個自我介紹太強了，姪女真的賺到 😂👏\n八個月正是什麼都要抓來啃的時期，送保養類其實最被需要 ٩(๑❛ᴗ❛๑)۶\n\n小編私心推 WeWee 寶貝潤潤乳：\n台灣團隊研發一年多、前後調了 30 幾次才推出，現在已經是第三代\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n經台美檢驗科技（SUPERLAB）檢驗，化粧品塑化劑 7 項均未檢出、定量極限 5 ppm ✨\n\n專為台灣濕熱的海島型氣候調的，吸收快、不黏不悶\n經典香跟無香款都有，當禮物送一組很體面喔～ ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@lu1108", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lu1108/post/DejARdmkzPn", "note": "", "reply": "「床圍目前是防止我掉下床」這句笑死 😂\n寶寶睡中間之後，版圖擴張的速度真的很驚人 ٩(๑❛ᴗ❛๑)۶\n\n底下推的款式都有人實際用過，可以照妳說的「下床方便」再篩一次\n小編想多補一個角度：看那片網布的套子能不能整件拆下來洗\n小孩的臉跟手整晚都貼在那一面，能常洗的用起來最舒服 ✨\n\n翻來翻去一整夜之後，睡前擦一層 WeWee 寶貝潤潤乳\n吸收快不黏，可以幫忙鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@ding_dang1995", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ding_dang1995/post/DeQ66Frkwmx", "note": "", "reply": "「看到贈品就默默在算要買什麼剛好滿額」這段小編完全有畫面 🤣\n小編那幾天也在世貿擺攤，看媽咪們人手好幾袋真的很壯觀 👏٩(๑❛ᴗ❛๑)۶\n\n以現場的角度看，最值得掃的其實是消耗品跟保養類\n這兩類平常不太會有活動，而且開封後慢慢用剛好不會放到過期 ✨\n\n我們家寶貝潤潤乳 150ml 一罐可以用很久\n洗完澡趁皮膚還微濕擦，吸收快又不黏不悶 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@zhen10.28", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zhen10.28/post/Dehn5thE6vk", "note": "", "reply": "「玩到忘記有媽媽」這個需求描述太精準了 🤣👏\n而且樓上說的瓶蓋真的是免錢的神級玩具，小編笑到不行 ٩(๑❛ᴗ❛๑)۶\n\n六個月開始什麼都往嘴巴送，補一個搭配的方向：\n玩具、遊戲墊、餐椅扶手，用美好實驗室的植萃抗菌噴霧噴一噴擦過就好\n柿子＋葡萄柚籽萃取，無色無味無酒精，碰到小手也不用一直沖水 ✨\n\n玩到滿頭汗、脖子皺摺悶悶的時候，再擦一層寶貝潤潤乳\n可以形成保護膜～ ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@bear74612", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@bear74612/post/Deeb8vFk9PL", "note": "", "reply": "不泛白又要耐汗，這兩個條件放在一起真的滿難的 🥲\n小編的經驗是，泛白多半是一次推太厚、或是還沒吃進去就動作了\n先薄薄擦一層、等個一分鐘再補第二層，會改善很多 ✨\n\nWeWee 極潤植萃防曬乳是純物理性的二氧化鈦配方\n加了神經醯胺跟玻尿酸，推開不泛白也不黏，溫和不熏眼睛\n大人拿來當素顏的奶油肌也很好用 (๑˃̵ ᴗ ˂̵)\n\n流汗後還是記得補擦，晚上洗乾淨再擦一層潤潤乳收尾 (｡•ᴗ-)✧🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@nn._0508", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@nn._0508/post/DeZBV3GjwwD", "note": "", "reply": "樓上媽咪們已經先幫小編說了，有點害羞 🥹🤍\n妳說擦起來黏黏的，那方向就很清楚了——挑純物理性的會清爽很多 ✨\n\nWeWee 極潤植萃防曬乳是二氧化鈦的純物理配方\n裡面加了神經醯胺跟玻尿酸，推開不泛白也不黏膩，溫和不熏眼睛\n海洋友善，六個月以上的寶寶跟大人可以一起用 (๑˃̵ ᴗ ˂̵)\n\n晚上洗乾淨之後，趁皮膚還微濕擦一層寶貝潤潤乳\n幫忙把水分留住，隔天上妝也比較服貼 ʕ•ᴥ•ʔ", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@zi.tyn027", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zi.tyn027/post/DecB54sFL_Q", "note": "", "reply": "包巾真的是每個寶寶喜好都不一樣，有的愛被包緊緊、有的手一定要露在外面 👶( ˘ᵕ˘ )\n挑的時候可以多看一個點：肩頸那一段能不能單獨翻開，半夜擦汗不用整件拆開 ✨\n\n補一個搭配的小撇步：\n包著的時候脖子皺摺可能會悶住汗水跟口水\n用乾濕兩用洗臉巾沾乾淨飲用水輕輕「按壓」擦掉、不要來回摩擦\n壓乾之後再擦一層 WeWee 寶貝潤潤乳，可以形成保護膜～ (๑•̀ㅂ•́)و✧🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@8_n.n__2.4", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@8_n.n__2.4/post/Demcec2I0AV", "note": "", "reply": "想要雙向這個需求小編懂，嫩嬰時期能一直看到寶寶的臉差很多 👶🤍\n除了重量，建議也看一下「單手能不能收」——抱著小孩的時候那隻手是真的騰不出來的 (๑•̀ㅂ•́)و✧\n\n順著說一個之後會用到的：\n推車到手之後，扶手跟餐盤會是整台最常被小手摸的地方\n外出包放一瓶 60ml 的植萃抗菌噴霧，噴一噴擦過就好，無色無味無酒精 ✨\n玩完手腳乾乾的時候，再補一層寶貝潤潤乳提升肌膚舒適度 ( ˘ᵕ˘ )", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@zxcv_00123", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@zxcv_00123/post/DeVlgTQGtod", "note": "", "reply": "寶寶的衣服小小一件，掛大人的衣架真的會一直滑下去 😂\n小編的看法是「肩線有一點弧度」比造型可愛更實用，包屁衣跟紗布衣比較撐得住\n買伸縮款的話，用到兩三歲都還掛得上 ✨(๑˃̵ ᴗ ˂̵)\n\n再多說一個晾之前的小步驟：\n炸屎、奶漬那幾件，先用美好實驗室的全酵貼身衣物手洗露局部搓過再丟洗衣機\n蛋白酵素會把那種頑強污垢分解掉，用量也很省 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@_____cl.______", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_____cl.______/post/Den8og9kXcX", "note": "", "reply": "剛開始整理的話，小編給一個方向：把「住院那幾天」跟「坐月子那一個月」分開想，比較不會漏 ( ˘ᵕ˘ )✨\n\n月中那一段最常卡住的其實是洗東西——奶瓶、內衣、寶寶的小衣服\n美好實驗室旅行組都是小容量的：果菜奶瓶潔淨液、全酵貼身衣物手洗露、餐具清潔露、茶香除臭噴霧\n塞行李箱角落就好，用量也很省 (๑•̀ㅂ•́)و✧\n\n寶寶那邊帶一罐小罐的寶貝潤潤乳，出院回家可以直接接著用 🍼🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-18_1045", "title": "WeWee 脆海巡清單｜2026-10-18（日）早上 8 點場 10 篇＋感謝 1 則", "keywords": [], "items": [{"n": "1", "who": "@jessy_92727", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@jessy_92727/post/DelnMyHmRM5", "note": "", "reply": "第一排晾得整整齊齊，這張照片真的很療癒 🥹👏\n而且妳連洗衣機都先請人洗過才開始，這個細心度太高了 ٩(๑❛ᴗ❛๑)۶\n\n洗衣精底下已經有好多選擇了，小編補兩個搭配的方向：\n洗衣機洗過之後，之後每個月自己維持一次就不會打回原形\n美好實驗室的洗衣槽清潔劑是過氧碳酸鈉，一個月丟一次就好 ✨\n\n另外炸屎、奶漬那幾件，可以先用全酵貼身衣物手洗露局部搓過再丟洗衣機\n蛋白酵素會把那種頑強污垢分解掉，用量也很省 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@bear_x.x1025", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@bear_x.x1025/post/DegdkiHDwsO", "note": "", "reply": "一打開留言就看到好幾位媽咪幫我們介紹，謝謝大家 🥹👏\n挑乳液小編會看三件事：成分單純有效、有認證、有檢測\n\nWeWee 寶貝潤潤乳是台灣團隊研發一年多\n前後調整 30 幾次才推出，現在已經做到第三代 (๑•̀ㅂ•́)و✧\n積雪草、靈芝多醣體、神經醯胺、甘草酸，新生兒就能用\n通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n也經台美檢驗科技（SUPERLAB）檢驗，\n化粧品塑化劑 7 項均未檢出、定量極限 5 ppm ✨\n\n經典香跟無香款都有，兩款都過同一個測試\n吸收快、不黏不悶，很多寶貝後來願意自己動手擦 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@thera.h_", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@thera.h_/post/DePoq1fE4wf", "note": "", "reply": "清水洗兩天就抓出兇手，這個實驗精神太強了 👏٩(๑❛ᴗ❛๑)۶\n4M 的洗沐可以挑單純一點的，一瓶從頭洗到腳就夠了\n\nWeWee 全身洗香香是洗澡、洗頭、洗臉二合一\n泡泡細緻好沖，洗完不乾澀，只有淡淡的香氣 ✨\n\n洗完趁皮膚還微濕就把寶貝潤潤乳擦上去\n比乾了再擦更能鎖住水分 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@_o2227s", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@_o2227s/post/Deihd5Cj9-T", "note": "", "reply": "「包尿布就願意大」這件事，留言區一排同梯 😂\n三天沒大號確實會讓媽媽心跳加速 🥹\n\n看起來寶寶對「哪裡才安心」超有自己的主見呢 ٩(๑❛ᴗ❛๑)۶\n底下繪本引導、讓他自己按沖水那兩招都好有畫面\n\n妳說的順其自然，小編覺得是最舒服的那條路\n慢慢會越來越順手的 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@molly._.7777", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@molly._.7777/post/Dejb548mJSX", "note": "", "reply": "側背又要夾層多，這個條件其實不好找 😂(๑•̀ㅂ•́)و✧\n底下大家推的款式都蠻有誠意的，可以慢慢比\n\n小編想補一個挑的角度：\n看「最外面那一格」能不能單手打開\n抱著小孩的時候，真正會一直用到的就只有那一格 ✨\n\n順便說，那一格小編會固定塞一條 60ml 的 WeWee 寶貝潤潤乳\n在外面洗完手、擦完臉之後補一層\n吸收很快，也可以舒緩乾燥 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@beauty_bw_jiaruchang", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@beauty_bw_jiaruchang/post/Del5cUnGEmf", "note": "", "reply": "彌月禮盒的選擇多到會選擇障礙 😂(｡•ᴗ-)✧\n底下口味已經有人分享了，剩下的就看怎麼送最順手\n\n小編想補兩個很實用的判斷：\n一個是挑常溫、保存天數長一點的，親友不用急著吃完\n另一個是能不能分批取、分批寄，親友的時間不會全擠在同一天 ✨\n\n多說一句，有些媽咪會在禮盒旁邊搭一個小東西：\n像 60ml 的 WeWee 寶貝潤潤乳這種每天都會用到的\n大人小孩一起擦，不用猜尺寸也不太會撞 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@hua0927", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@hua0927/post/Deiy7yKFDLy", "note": "", "reply": "幼幼班要自己開的水壺，容量跟滑蓋真的很難兩全 😂(๑•̀ㅂ•́)و✧\n底下款式蒐集得好齊，可以照妳說的容量再篩一次\n\n小編想補一個挑的方向：\n看吸管、墊圈能不能整個拆下來\n死角少一點，洗起來才不會洗到懷疑人生 👏\n\n再說一個：水壺是整天被抱著、提著、放桌上的東西\n外出包會放一瓶 60ml 的植萃抗菌噴霧\n提把、瓶身、放桌面碰到的地方噴一噴擦過\n無色無味無酒精，小手直接抓也不用一直沖水\n玩回來洗完澡趁微濕擦一層寶貝潤潤乳\n可以提升肌膚舒適度 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@mm______.21", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mm______.21/post/DeimaXSCUZ6", "note": "", "reply": "又要不太硬、又要不容易滑，條件抓得很清楚 👏(｡•ᴗ-)✧\n底下大家推的都有人實際用過，可以照妳的條件再挑\n\n小編想補一個很容易被忽略的：\n看枕套、布套能不能整件拆下來洗\n這個時期難免會溢到，能常洗的那款用起來最輕鬆 ✨\n\n多說一句，溢到脖子跟皺摺的時候\n壓乾之後擦一層 WeWee 寶貝潤潤乳\n吸收很快，可以幫忙把水分留住 ʕ•ᴥ•ʔ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@elva_05.11", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@elva_05.11/post/DecVegVEwet", "note": "", "reply": "相簿整個被同一個人佔滿，這真的是當媽的標配 😂🥹\n快 4 個月就越來越會聊天，粉粿很有自己的節奏呢 👶ʕ•ᴥ•ʔ\n\n皮膚紅紅粗粗的時候，小編會先顧兩件事：\n室內維持涼爽通風，比悶著流汗友善很多（妳開 22 度就很到位了 👏）\n洗完澡趁皮膚還微濕就把乳液擦上去，不要等全乾\n\nWeWee 寶貝潤潤乳是在台灣研發、針對濕熱天氣調的\n擦起來清爽不悶、吸收也快\n可以強化肌膚的防禦力 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@punb811", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@punb811/post/DeY5kSlD6bL", "note": "", "reply": "「忍不住想吸」這句小編完全懂 😂ʕ•ᴥ•ʔ\n層數多到根本不只雙下巴，妳形容得太傳神了\n\n洗的時候可以先把那幾層輕輕撐開、讓泡泡帶過再沖乾淨\nWeWee 全身洗香香泡泡細緻、沖起來很快，洗完也不乾澀 ✨\n\n洗完先把皺摺壓乾，再擦一層寶貝潤潤乳\n吸收快不黏，可以呵護肌膚 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "11", "who": "@shan583、@we261204、@bilubilu_5.2.0（感謝粉絲）", "topic": "", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@bear_x.x1025/post/DegdkiHDwsO", "note": "", "reply": "@shan583 @we261204 @bilubilu_5.2.0\n謝謝三位媽咪主動幫我們推薦 🥹🤍\n小編看到的時候真的很開心\n有你們在，我們會繼續把產品做好的 ♡", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-18_1038", "title": "WeWee 脆海巡清單｜2026-10-18（日）早上 10 點場 10 篇＋感謝粉絲 1 則", "keywords": [], "items": [{"n": "1", "who": "@nikke.bubu", "topic": "38+5、寶寶 3300g，下週要去催生，最後幾天紀錄胎動", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@nikke.bubu/post/DejCq06icHk", "note": "", "reply": "38+5、3300g，下週就要見面了 🥹٩(๑❛ᴗ❛๑)۶\n最後這幾天還願意這樣記錄胎動，真的很浪漫\n\n往下鑽那一下，看影片都能感覺到力氣 😂\n底下好多媽咪說產後最懷念的就是這個 ✨\n\n下週順順利利，媽媽寶寶都平安 ( ˘ᵕ˘ )🤍", "status": "pending", "statusNote": ""}, {"n": "2", "who": "@a0933976896", "topic": "奉勸新手爸媽不要幻想幼兒出國多開心，五天行程不是追小孩就是安撫，解鎖八個「地板成就」", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@a0933976896/post/DemhJo8E29T", "note": "", "reply": "「華航地板成就、成田機場地板成就」這個成就系統太好笑了 😂🤣\n一路解鎖到迪士尼跟三麗鷗，含金量滿點\n\n五天追下來真的是體力活，回來先睡一波 ( ˘ᵕ˘ )\n地板躺過的那幾件衣服，小編會先用美好實驗室的全酵貼身衣物手洗露泡一下\n蛋白酵素分解污垢，用量也很省 (๑•̀ㅂ•́)و✧\n\n連著幾天在外面跑，皮膚會比在家累一點\n洗完澡趁還微濕抹一層 WeWee 寶貝潤潤乳，可以鎖住水分 🤍", "status": "pending", "statusNote": ""}, {"n": "3", "who": "@qqaz89899", "topic": "第一次當爸爸比想像中緊張，搜尋紀錄全是孕期問題——想問老公做過最加分或最扣分的事", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qqaz89899/post/DejgqvME05a", "note": "", "reply": "搜尋紀錄已經變成那四行，光看就知道你有在認真做功課 👏٩(๑❛ᴗ❛๑)۶\n\n小編私心覺得最加分的一件事是：\n待產包你自己親手打包一次\n住院那幾天都是你在袋子裡找東西，哪一包放什麼只有你最清楚\n老婆開口之前就遞過去，加分會爆表 (๑˃̵ ᴗ ˂̵)\n\n洗沐清潔那一格可以挑小容量的\n美好實驗室旅行組有餐具清潔露、貼身衣物手洗露、除臭噴霧、果菜奶瓶潔淨液\n洗奶瓶、洗貼身衣物、尿布味都顧到了 ✨\n再放一罐 WeWee 寶貝潤潤乳，媽媽寶寶一起擦 🤍", "status": "pending", "statusNote": ""}, {"n": "4", "who": "@yo___0312", "topic": "選擇障礙工作狂夫妻，女兒出生前只剩這個檔期——推車到底現在買還是等下個月", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@yo___0312/post/DejprCliaXT", "note": "", "reply": "「選擇障礙工作狂夫妻」這個自我介紹太傳神 😂(｡•ᴗ-)✧\n女兒出生前把清單整個盤一遍，這個節奏抓得很好 👏\n\n補一個很常留到最後才想起來的格子：洗沐保養\n這一類新生兒第一天就會用到，反而最不適合臨時買\n\n挑的時候可以看成分單純不單純、有沒有做過檢測\nWeWee 寶貝潤潤乳通過德國 Dermatest® 敏感肌貼膚測試 Excellent 等級\n台灣團隊研發一年多、前後調了 30 幾次，現在已經是 3.0 版了喔～ (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "5", "who": "@168_qqxin", "topic": "兒子最近一直想舔手手，手又在臉上抹來抹去，現在兩側臉頰都紅紅的該如何處理", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@168_qqxin/post/DeheACYE650", "note": "", "reply": "一直舔手手又抹在臉上，兩邊自然最容易受不了 🥹\n妳已經決定去給皮膚科醫師看一眼，這一步很對 🤍\n\n日常可以換一個擦法：\n用乾濕兩用洗臉巾沾乾淨飲用水，輕輕「按壓」把口水擦掉、不要來回摩擦\n壓乾之後再薄薄抹一層 WeWee 寶貝潤潤乳，可以形成保護膜 ( ˘ᵕ˘ )\n\n這是日常保養用的，擦藥的部分照醫師走就好 ♡", "status": "pending", "statusNote": ""}, {"n": "6", "who": "@cookt_ichiban", "topic": "寶寶 9M 什麼都想放嘴巴咬，洗澡給玩具比較好洗——有推薦可以放嘴巴咬的洗澡玩具嗎", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@cookt_ichiban/post/DemRssEgUHR", "note": "", "reply": "用玩具換到一個乖乖洗澡的寶寶，這招太划算了 😂٩(๑❛ᴗ❛๑)۶\n\n挑的時候可以多看一個條件：一體成形、沒有進水孔的\n會進水的那種擠一下常常是黑黑的，咬進嘴巴反而麻煩 ʕ•ᴥ•ʔ\n\n這個年紀小編會隨手帶一瓶美好實驗室的植萃抗菌噴霧\n玩具、固齒器、餐椅扶手掉地上撿起來，噴一噴擦過就好\n無色無味無酒精，小手直接抓也不用一直沖水 ✨\n洗完澡趁微濕抹一層 WeWee 寶貝潤潤乳，可以提升肌膚舒適度 (๑˃̵ ᴗ ˂̵)🤍", "status": "pending", "statusNote": ""}, {"n": "7", "who": "@ciotter_blog", "topic": "每次帶寶寶出門都覺得找尿布台找到懷疑人生，不然就是只有哺乳室有、間數又不多", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@ciotter_blog/post/DelyIvBn2yz", "note": "", "reply": "「只是想換個尿布」這句太真實了 😮‍💨(´;ω;｀)\n明明只要三十秒，偏偏得先繞整層樓找\n\n小編會固定帶一條可以折起來的尿布墊\n車上、長椅、休息區攤開就能換，不必跟哺乳室排隊 ✨\n\n尿布台的台面也是百人千人摸過的\n外出包塞一瓶 60ml 的植萃抗菌噴霧，噴一噴擦過再放寶寶上去\n無色無味無酒精，60ml 也可以上飛機 (๑•̀ㅂ•́)و✧\n換完擦乾抹一層 WeWee 寶貝潤潤乳，可以舒緩乾燥 🤍", "status": "pending", "statusNote": ""}, {"n": "8", "who": "@lovehibou", "topic": "帶寶寶出門必定觸發的路人 NPC 台詞排行榜：第一名「穿這樣會不會冷？」——後面交給你們補完", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@lovehibou/post/DemPn_sH1VW", "note": "", "reply": "「穿這樣會不會冷？」穩坐第一名，無人能敵 🤣\n\n小編補幾句：\n第三名：是男生還是女生？（明明穿得很明顯）\n第四名：有沒有喝母奶？\n第五名：手手冰冰的欸～（然後就開始要幫你加衣服）(´;ω;｀)\n\n加碼一句：好可愛，長得像爸爸還是媽媽？\n這題不管怎麼回答都會被延伸十分鐘 😂٩(๑❛ᴗ❛๑)۶✨", "status": "pending", "statusNote": ""}, {"n": "9", "who": "@qapdkebdj_22", "topic": "台大生產，37 週、預計 38 週催生，院方也沒給待產包清單，第一胎好緊張什麼都不懂", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@qapdkebdj_22/post/DemW1M7kw91", "note": "", "reply": "第一胎又遇上「什麼清單都沒有」，難怪會慌 🥹\n不過妳提前一週就在問，時間完全夠 (๑˃̵ ᴗ ˂̵)\n\n小編給一個很省力的打包法：分兩袋\n一袋是產房真正會用到的，另一袋是產後病房那幾天的\n老公要補送東西的時候，講袋子就好，不用猜 ✨\n\n洗沐保養這塊直接挑小容量的\nWeWee 旅行組是無香乳液 60ml、舒膚精華 30ml、洗香香 60ml\n住院一路用到坐月子，行李也不佔位 (๑•̀ㅂ•́)و✧\n寶貝潤潤乳也放一罐，媽媽寶寶一起擦，很快就能見到她了 🤍", "status": "pending", "statusNote": ""}, {"n": "10", "who": "@mcmxcxiix", "topic": "寶寶 2w18d 6kg，夜用尿布換了尺寸後這兩天大腿都漏尿、衣服都濕了，而且尿味很重", "time": "", "stats": "", "tags": "", "url": "https://www.threads.com/@mcmxcxiix/post/DendoV9k5im", "note": "", "reply": "2w18d 就 6kg，長得好好 👏( ˘ᵕ˘ )\n凌晨換床單那個心情，小編完全懂 😮‍💨\n\n給一個減災的方向：\n床墊上多鋪一層防水墊，再疊一條布墊\n真的漏了只抽掉最上面那一層，半夜就不用整組大工程 ✨\n\n尿味那件事可以用美好實驗室的茶香除臭噴霧\n專利柿子萃取，分解蛋白異味，尿布桶那一區噴一噴 (๑•̀ㅂ•́)و✧\n換完尿布擦乾再抹一層 WeWee 寶貝潤潤乳，可以呵護肌膚 🤍", "status": "pending", "statusNote": ""}]}, {"file": "2026-10-17_2228", "title": "WeWee 脆海巡清單｜2026-10-17（六）晚上 9 點場 10 篇＋加碼 1 篇", "keywords": [], "items": [{"n": "1", "who": "@4people.4life", "topic": "", "time": "", "
